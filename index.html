// ══════════════════════════════════════════════════════════════════
// Clé super admin dans Firestore : collection "superadmin" / doc "config"
// Chaque admin : { id, name, pin (btoa), shopId, active, createdAt }
// Sur chaque shop : champ sessionActive (bool, défaut true)

function SuperAdminDashboard({ T, themeName, setThemeName, logout, flashMsg }) {
  const [tab, setTab] = useState("shops");
  const [shops, setShops] = useState([]);
  const [loading, setLoading] = useState(true);
  const [admins, setAdmins] = useState([]); // admins créés par superadmin
  const [adminsLoading, setAdminsLoading] = useState(true);
  const [planModalShop, setPlanModalShop] = useState(null);
  const [planForm, setPlanForm] = useState({ plan: "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });

  // ── Charger tous les shops ──────────────────────────────────────
  useEffect(() => {
    if (!db) { setLoading(false); return; }
    const unsub = db.collection("shops").onSnapshot(snap => {
      setShops(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, []);

  // ── Charger les admins SuperAdmin ──────────────────────────────
  useEffect(() => {
    if (!db) { setAdminsLoading(false); return; }
    const unsub = db.collection("superadmin").doc("admins").collection("list")
      .onSnapshot(snap => {
        setAdmins(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        setAdminsLoading(false);
      }, () => setAdminsLoading(false));
    return unsub;
  }, []);

  // ── Activer / Désactiver session d'un shop ─────────────────────
  const toggleShopSession = async (shop) => {
    const newVal = !shop.sessionActive && shop.sessionActive !== undefined ? true : shop.sessionActive === false ? true : false;
    // Par défaut sessionActive=true ; on la passe à false pour désactiver
    const val = shop.sessionActive !== false; // si c'était actif on désactive
    try {
      await db.collection("shops").doc(shop.id).update({ sessionActive: !val });
      flashMsg(val ? `🔒 Session désactivée : ${shop.shopName}` : `✅ Session activée : ${shop.shopName}`);
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  // ── Gestion manuelle de l'abonnement ────────────────────────────
  const openPlanModal = (shop) => {
    setPlanModalShop(shop);
    setPlanForm({ plan: shop.plan || "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });
  };

  const previewNewEnd = (shop, form) => {
    if(!shop) return null;
    const base = form.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    if(form.plan === "personnalise") {
      if(form.customMode === "date") {
        if(!form.customDate) return null;
        return new Date(form.customDate + "T23:59:59").getTime();
      }
      const days = parseInt(form.customDays) || 0;
      if(days <= 0) return null;
      return calculateEndDateDays(base, days);
    }
    return calculateEndDate(base, form.plan);
  };

  const confirmPlanChange = async () => {
    const shop = planModalShop;
    if(!shop) return;
    const newEnd = previewNewEnd(shop, planForm);
    if(!newEnd) { flashMsg(planForm.customMode === "date" ? "Choisissez une date" : "Entrez un nombre de jours valide"); return; }
    const base = planForm.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    try {
      await db.collection("shops").doc(shop.id).update({ plan: planForm.plan, subscriptionStart: base, subscriptionEnd: newEnd });
      flashMsg(`Abonnement ${shop.shopName} mis à jour : ${planLabel(planForm.plan)}`);
      setPlanModalShop(null);
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  // ── Créer un admin pour un shop ────────────────────────────────
  const [showAdminForm, setShowAdminForm] = useState(false);
  const [aName, setAName] = useState("");
  const [aPin, setAPin] = useState("");
  const [aShopId, setAShopId] = useState("");

  const createAdmin = async () => {
    if (!aName.trim() || aPin.length < 4 || !aShopId) { flashMsg("Nom, PIN (4+ chiffres) et commerce requis"); return; }
    const doc = { name: aName.trim(), pin: btoa(aPin), shopId: aShopId, active: true, createdAt: Date.now() };
    try {
      await db.collection("superadmin").doc("admins").collection("list").add(doc);
      setAName(""); setAPin(""); setAShopId(""); setShowAdminForm(false);
      flashMsg("✅ Admin créé");
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const toggleAdmin = async (adm) => {
    try {
      await db.collection("superadmin").doc("admins").collection("list").doc(adm.id).update({ active: !adm.active });
      flashMsg(adm.active ? `🔒 Admin désactivé : ${adm.name}` : `✅ Admin activé : ${adm.name}`);
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const deleteAdmin = async (adm) => {
    if (!window.confirm(`Supprimer l'admin ${adm.name} ?`)) return;
    try {
      await db.collection("superadmin").doc("admins").collection("list").doc(adm.id).delete();
      flashMsg("🗑️ Admin supprimé");
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  // ── Activités consolidées (toutes ventes de tous les shops) ─────
  const [allSales, setAllSales] = useState([]);
  const [salesLoading, setSalesLoading] = useState(false);
  const loadAllSales = async () => {
    if (!db || salesLoading) return;
    setSalesLoading(true);
    try {
      const allS = [];
      for (const shop of shops.slice(0, 20)) { // limité à 20 shops pour perfs
        const snap = await db.collection("shops").doc(shop.id).collection("sales")
          .orderBy("timestamp", "desc").limit(50).get();
        snap.docs.forEach(d => allS.push({ ...d.data(), id: d.id, _shopName: shop.shopName }));
      }
      allS.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setAllSales(allS);
    } catch(e) { flashMsg("Erreur chargement ventes: " + e.message); }
    setSalesLoading(false);
  };

  const today = new Date().toISOString().slice(0, 10);
  const totalShops = shops.length;
  const activeShops = shops.filter(s => s.active !== false && s.sessionActive !== false).length;
  const expiringShops = shops.filter(s => { const d = getDaysLeft(s.subscriptionEnd); return d <= 7 && d > 0; }).length;
  const expiredShops = shops.filter(s => getDaysLeft(s.subscriptionEnd) === 0 && s.active !== false).length;

  const TABS = [["shops","🏪 Commerces"],["admins","👥 Admins"],["activites","📊 Activités"],["settings","⚙️ Paramètres"]];

  return (
    <div className="dev-dash-root" style={{ background:T.bg, color:T.text }}>
      {/* Header */}
      <div style={{ background:T.header, borderBottom:`1px solid ${T.border}`, padding:"10px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:22 }}>🛡️</span>
          <div>
            <div style={{ fontFamily:"'Outfit'", fontSize:16, fontWeight:800, color:T.purple }}>Super Admin</div>
            <div style={{ fontSize:9, color:T.textMute }}>Tableau de bord global</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <div style={{ display:"flex", gap:2, padding:3, borderRadius:20, background:T.surface2 }}>
            {Object.values(THEMES).map(th => (
              <button key={th.id} onClick={() => setThemeName(th.id)}
                className={`theme-btn${themeName===th.id?" active":""}`}
                style={{ background: themeName===th.id ? T.accent : "transparent", color: themeName===th.id ? T.bg : T.textMute }}>
                {th.label}
              </button>
            ))}
          </div>
          <button onClick={logout} style={{ background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 10px", fontSize:11, color:T.textMute }}>↩ Déco</button>
        </div>
      </div>

      {/* KPI */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8, padding:12, flexShrink:0 }}>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.green}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Commerces actifs</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.green }}>{activeShops}</div>
          <div style={{ fontSize:9, color:T.textMute }}>/ {totalShops} total</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.blue}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Admins créés</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.blue }}>{admins.filter(a=>a.active).length}</div>
          <div style={{ fontSize:9, color:T.textMute }}>/ {admins.length} total</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.orange}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Abonnements expirant</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.orange }}>{expiringShops}</div>
          <div style={{ fontSize:9, color:T.textMute }}>dans 7 jours</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.red}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Abonnements expirés</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.red }}>{expiredShops}</div>
          <div style={{ fontSize:9, color:T.textMute }}>à renouveler</div>
        </div>
      </div>

      {/* Onglets */}
      <div style={{ display:"flex", gap:5, padding:"0 12px 8px", flexWrap:"wrap", flexShrink:0 }}>
        {TABS.map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)}
            style={{ background:tab===k?T.purple:T.surface, borderRadius:12, padding:"7px 14px", fontSize:11, fontWeight:700, color:tab===k?"#fff":T.text, border:"none" }}>
            {l}
          </button>
        ))}
      </div>

      <div className="dev-dash-scroll" style={{ padding:"0 12px 32px" }}>

        {/* ── COMMERCES ── */}
        {tab === "shops" && (
          <div>
            {loading && <div className="spin" style={{ width:28,height:28,border:`2px solid ${T.border}`,borderTopColor:T.accent,borderRadius:"50%",margin:"20px auto" }}></div>}
            {shops.map(shop => {
              const daysLeft = getDaysLeft(shop.subscriptionEnd);
              const isActive = shop.active !== false && shop.sessionActive !== false;
              const isSessionOff = shop.sessionActive === false;
              const statusColor = isSessionOff ? T.orange : shop.active === false ? T.red : daysLeft <= 0 ? T.red : daysLeft <= 7 ? T.orange : T.green;
              return (
                <div key={shop.id} style={{ background:T.surface, borderRadius:14, padding:14, marginBottom:10, borderLeft:`4px solid ${statusColor}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", flexWrap:"wrap", gap:8 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:800, fontSize:14 }}>{shop.shopName}</div>
                      <div style={{ fontSize:10, color:T.textMute }}>👤 {shop.ownerName} · 📱 {shop.whatsapp}</div>
                      <div style={{ fontSize:10, color:T.textMute }}>📅 Créé: {formatDate(shop.createdAt)} · Plan: {shop.plan||"mensuel"}</div>
                      {shop.subscriptionEnd && <div style={{ fontSize:10, color:daysLeft<=7?T.red:T.textMute }}>⏳ Expire dans {daysLeft}j ({formatDate(shop.subscriptionEnd)})</div>}
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4 }}>
                      <span style={{ fontSize:10, fontWeight:700, color:statusColor }}>
                        {isSessionOff ? "🔶 Session OFF" : shop.active===false ? "🔴 Inactif" : daysLeft<=0 ? "⚠️ Expiré" : daysLeft<=7 ? "⚠️ Bientôt expiré" : "🟢 Actif"}
                      </span>
                      <button onClick={() => openPlanModal(shop)}
                        style={{ background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"5px 12px", fontSize:11, fontWeight:600, color:T.text }}>
                        📝 Gérer abonnement
                      </button>
                      <button onClick={() => toggleShopSession(shop)}
                        style={{ background: isSessionOff ? T.btnGreen.bg : T.btnRed.bg, border:"none", borderRadius:8, padding:"5px 12px", fontSize:11, fontWeight:700, color: isSessionOff ? T.green : T.red }}>
                        {isSessionOff ? "▶ Activer session" : "⏸ Désactiver session"}
                      </button>
                    </div>
                  </div>
                  {/* Statistiques rapides du shop */}
                  <ShopQuickStats T={T} shopId={shop.id} />
                </div>
              );
            })}
          </div>
        )}

        {/* ── ADMINS ── */}
        {tab === "admins" && (
          <div>
            <div style={{ background:T.surface2, borderRadius:12, padding:12, marginBottom:12, fontSize:11, color:T.textMute }}>
              ℹ️ Les admins créés ici peuvent accéder à n'importe quel commerce via leur PIN. Chaque admin est lié à un commerce spécifique.
            </div>
            <button onClick={() => setShowAdminForm(true)}
              style={{ background:T.purple, border:"none", borderRadius:12, padding:12, marginBottom:12, width:"100%", fontWeight:700, color:"#fff" }}>
              + Créer un nouvel admin
            </button>

            {showAdminForm && (
              <div style={{ background:T.surface, borderRadius:16, padding:16, marginBottom:12, border:`1px solid ${T.purple}44` }}>
                <div style={{ fontSize:14, fontWeight:700, marginBottom:10, color:T.purple }}>👥 Nouvel Admin</div>
                <input placeholder="Nom complet" value={aName} onChange={e => setAName(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:8 }} />
                <input type="password" placeholder="PIN (4-6 chiffres)" maxLength={6} value={aPin} onChange={e => setAPin(e.target.value.replace(/\D/g,""))}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:8 }} />
                <select value={aShopId} onChange={e => setAShopId(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:12 }}>
                  <option value="">— Choisir un commerce —</option>
                  {shops.map(s => <option key={s.id} value={s.id}>{s.shopName}</option>)}
                </select>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={() => { setShowAdminForm(false); setAName(""); setAPin(""); setAShopId(""); }}
                    style={{ flex:1, background:T.surface2, border:"none", borderRadius:10, padding:10 }}>Annuler</button>
                  <button onClick={createAdmin}
                    style={{ flex:1, background:T.purple, border:"none", borderRadius:10, padding:10, fontWeight:700, color:"#fff" }}>Créer</button>
                </div>
              </div>
            )}

            {adminsLoading && <div style={{ textAlign:"center", padding:20, color:T.textMute }}>⏳ Chargement...</div>}
            {!adminsLoading && admins.length === 0 && (
              <div style={{ textAlign:"center", padding:40, color:T.textMute, fontSize:12 }}>Aucun admin créé</div>
            )}
            {admins.map(adm => {
              const shop = shops.find(s => s.id === adm.shopId);
              return (
                <div key={adm.id} style={{ background:T.surface, borderRadius:12, padding:12, marginBottom:8, borderLeft:`3px solid ${adm.active ? T.purple : T.red}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start" }}>
                    <div>
                      <div style={{ fontWeight:700 }}>👤 {adm.name}</div>
                      <div style={{ fontSize:10, color:T.textMute }}>Commerce: {shop?.shopName || adm.shopId}</div>
                      <div style={{ fontSize:9, color:T.textMute }}>Créé: {formatDate(adm.createdAt)}</div>
                      <span style={{ fontSize:9, fontWeight:700, color:adm.active?T.green:T.red }}>
                        {adm.active ? "✅ Actif" : "🔒 Désactivé"}
                      </span>
                    </div>
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={() => toggleAdmin(adm)}
                        style={{ background: adm.active ? T.btnRed.bg : T.btnGreen.bg, border:"none", borderRadius:8, padding:"5px 10px", fontSize:11, color: adm.active ? T.red : T.green }}>
                        {adm.active ? "🔒 Désactiver" : "✅ Activer"}
                      </button>
                      <button onClick={() => deleteAdmin(adm)}
                        style={{ background:T.btnRed.bg, border:"none", borderRadius:8, padding:"5px 8px", color:T.red }}>🗑️</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── ACTIVITÉS ── */}
        {tab === "activites" && (
          <div>
            <div style={{ background:T.surface2, borderRadius:12, padding:12, marginBottom:10, fontSize:11, color:T.textMute }}>
              📊 Activités consolidées de tous les commerces (50 dernières ventes par commerce, max 20 commerces)
            </div>
            {allSales.length === 0 && !salesLoading && (
              <button onClick={loadAllSales}
                style={{ background:T.purple, border:"none", borderRadius:12, padding:14, width:"100%", fontWeight:700, color:"#fff", marginBottom:12 }}>
                🔄 Charger les activités
              </button>
            )}
            {salesLoading && <div className="spin" style={{ width:28,height:28,border:`2px solid ${T.border}`,borderTopColor:T.purple,borderRadius:"50%",margin:"20px auto" }}></div>}
            {allSales.map(sale => (
              <div key={sale.id + sale._shopName} style={{ background:T.surface, borderRadius:10, padding:10, marginBottom:6, borderLeft:`3px solid ${sale.cancelled?T.red:T.green}` }}>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:11, fontWeight:700 }}>{sale._shopName}</div>
                    <div style={{ fontSize:10, color:T.textMute }}>
                      {sale.caissier ? `👤 ${sale.caissier}` : "Admin"} · {sale.date}
                      {sale.timestamp && ` à ${new Date(sale.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}`}
                    </div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontWeight:800, color:sale.cancelled?T.red:T.accent }}>{sale.cancelled?"❌":""}{fmtPrice(sale.total)}</div>
                    <div style={{ fontSize:9, color:T.textMute }}>{(sale.items||[]).length} art.</div>
                  </div>
                </div>
              </div>
            ))}
            {allSales.length > 0 && (
              <button onClick={loadAllSales} style={{ background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:10, width:"100%", fontSize:11, color:T.textMute, marginTop:8 }}>
                🔄 Actualiser
              </button>
            )}
          </div>
        )}

        {/* ── PARAMÈTRES ── */}
        {tab === "settings" && (
          <div>
            <div style={{ background:T.surface, borderRadius:14, padding:16, marginBottom:12 }}>
              <div style={{ fontSize:14, fontWeight:700, marginBottom:8 }}>🎨 Thème</div>
              <div style={{ display:"flex", gap:8 }}>
                {Object.values(THEMES).map(th => (
                  <button key={th.id} onClick={() => setThemeName(th.id)}
                    style={{ flex:1, background:themeName===th.id?T.accent:T.surface2, border:`2px solid ${themeName===th.id?T.accent:T.border}`, borderRadius:10, padding:10, fontWeight:700, color:themeName===th.id?T.bg:T.text }}>
                    {th.label} {th.label}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ background:T.surface2, borderRadius:12, padding:12, fontSize:11, color:T.textMute }}>
              <div style={{ fontWeight:700, color:T.purple, marginBottom:4 }}>🛡️ Super Admin — Informations</div>
              <div>PIN d'accès : <code style={{ background:T.surface, padding:"1px 6px", borderRadius:4 }}>{DEV_PIN}</code> (triple-clic sur le logo)</div>
              <div style={{ marginTop:4 }}>Données Firestore : <code>superadmin/admins/list</code></div>
              <div style={{ marginTop:4 }}>Suspension shop : champ <code>sessionActive: false</code> sur le document shop</div>
            </div>
          </div>
        )}

      </div>
      {planModalShop && (() => {
        const shop = planModalShop;
        const preview = previewNewEnd(shop, planForm);
        const canExtend = shop.subscriptionEnd && shop.subscriptionEnd > Date.now();
        const PLAN_OPTS = [["mensuel","📅 Mensuel","30 jours"],["trimestriel","📆 Trimestriel","90 jours"],["annuel","🗓️ Annuel","365 jours"],["personnalise","✏️ Personnalisé","jours libres ou date"]];
        return (
          <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16}}>
            <div style={{background:T.surface, borderRadius:24, padding:20, width:"100%", maxWidth:380, maxHeight:"90vh", overflowY:"auto"}}>
              <div style={{fontSize:16, fontWeight:800, marginBottom:2}}>📝 Gérer l'abonnement</div>
              <div style={{fontSize:11, color:T.textMute, marginBottom:14}}>{shop.shopName} · actuellement {planLabel(shop.plan)}{shop.subscriptionEnd ? ` (expire le ${formatDate(shop.subscriptionEnd)})` : ""}</div>

              <div style={{fontSize:11, color:T.textMute, marginBottom:6}}>Plan</div>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14}}>
                {PLAN_OPTS.map(([val,lbl,sub])=>(
                  <button key={val} onClick={()=>setPlanForm(f=>({...f, plan:val}))} style={{background:planForm.plan===val?T.accent:T.surface2, border:`1px solid ${planForm.plan===val?T.accent:T.border}`, borderRadius:12, padding:"10px 8px", textAlign:"left"}}>
                    <div style={{fontWeight:700, fontSize:12, color:planForm.plan===val?T.bg:T.text}}>{lbl}</div>
                    <div style={{fontSize:9, color:planForm.plan===val?T.bg:T.textMute}}>{sub}</div>
                  </button>
                ))}
              </div>

              {planForm.plan === "personnalise" && (
                <div style={{marginBottom:14}}>
                  <div style={{display:"flex", gap:6, marginBottom:8}}>
                    <button onClick={()=>setPlanForm(f=>({...f, customMode:"days"}))} style={{flex:1, background:planForm.customMode==="days"?T.btnBlue.bg:T.surface2, border:`1px solid ${planForm.customMode==="days"?T.blue:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.customMode==="days"?T.blue:T.textMute}}>🔢 Nombre de jours</button>
                    <button onClick={()=>setPlanForm(f=>({...f, customMode:"date"}))} style={{flex:1, background:planForm.customMode==="date"?T.btnBlue.bg:T.surface2, border:`1px solid ${planForm.customMode==="date"?T.blue:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.customMode==="date"?T.blue:T.textMute}}>📆 Date précise</button>
                  </div>
                  {planForm.customMode === "days" ? (

                  ) : (

                  )}
                </div>
              )}

              {(planForm.plan !== "personnalise" || planForm.customMode === "days") && (
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11, color:T.textMute, marginBottom:6}}>Point de départ</div>

                    <button disabled={!canExtend} onClick={()=>setPlanForm(f=>({...f, from:"extend"}))} style={{flex:1, opacity:canExtend?1:0.4, background:planForm.from==="extend"?T.accent:T.surface2, border:`1px solid ${planForm.from==="extend"?T.accent:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.from==="extend"?T.bg:T.textMute}}>Prolonger depuis l'expiration</button>
                  </div>
                </div>
              )}

              <div style={{background:T.surface2, borderRadius:12, padding:12, marginBottom:16, textAlign:"center"}}>
                <div style={{fontSize:10, color:T.textMute}}>Nouvelle date d'expiration</div>
                <div style={{fontSize:18, fontWeight:800, color:preview?T.accent:T.textMute}}>{preview ? formatDate(preview) : "—"}</div>
              </div>

              <div style={{display:"flex", gap:8}}>
                <button onClick={()=>setPlanModalShop(null)} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button>
                <button onClick={confirmPlanChange} style={{flex:1, background:T.accent, borderRadius:12, padding:12, fontWeight:700, color:T.bg}}>Valider</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Statistiques rapides d'un shop (lazy) ──────────────────────────────
function ShopQuickStats({ T, shopId }) {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(false);
  const [expanded, setExpanded] = useState(false);

  const load = async () => {
    if (stats || loading || !db) return;
    setLoading(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const snap = await db.collection("shops").doc(shopId).collection("sales")
        .where("date", "==", today).get();
      const sales = snap.docs.map(d => d.data()).filter(s => !s.cancelled && s.id !== "_init");
      const ca = sales.reduce((a, s) => a + (s.total || 0), 0);
      // Grouper par caissier
      const byCaissier = {};
      sales.forEach(s => {
        const k = s.caissier || "Admin";
        byCaissier[k] = (byCaissier[k] || 0) + (s.total || 0);
      });
      setStats({ ca, nb: sales.length, byCaissier });
    } catch(e) { setStats({ ca: 0, nb: 0, byCaissier: {} }); }
    setLoading(false);
  };

  return (
    <div style={{ marginTop:8, paddingTop:8, borderTop:`1px solid ${T.border}` }}>
      <button onClick={() => { setExpanded(!expanded); if (!expanded) load(); }}
        style={{ background:"transparent", border:"none", fontSize:10, color:T.blue, padding:0, cursor:"pointer" }}>
        {expanded ? "▲ Masquer stats" : "▼ Stats du jour"}
      </button>
      {expanded && (
        <div style={{ marginTop:8 }}>
          {loading && <span style={{ fontSize:10, color:T.textMute }}>⏳...</span>}
          {stats && (
            <div>
              <div style={{ display:"flex", gap:8, marginBottom:6 }}>
                <div style={{ background:T.surface2, borderRadius:8, padding:"6px 10px", flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:9, color:T.textMute }}>CA Auj.</div>
                  <div style={{ fontWeight:800, color:T.green, fontSize:13 }}>{fmtPrice(stats.ca)}</div>
                </div>
                <div style={{ background:T.surface2, borderRadius:8, padding:"6px 10px", flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:9, color:T.textMute }}>Ventes</div>
                  <div style={{ fontWeight:800, color:T.blue, fontSize:13 }}>{stats.nb}</div>
                </div>
              </div>
              {Object.entries(stats.byCaissier).length > 0 && (
                <div>
                  <div style={{ fontSize:9, color:T.textMute, marginBottom:4 }}>Par caissier aujourd'hui :</div>
                  {Object.entries(stats.byCaissier).map(([name, ca]) => (
                    <div key={name} style={{ display:"flex", justifyContent:"space-between", fontSize:10, padding:"2px 0" }}>
                      <span style={{ color:T.text }}>👤 {name}</span>
                      <span style={{ fontWeight:700, color:T.accent }}>{fmtPrice(ca)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Vérification session SuperAdmin côté shop ──────────────────────────
// Appelé au démarrage du shop pour vérifier si sessionActive !== false
async function checkShopSessionActive(shopId) {
  if (!db || !shopId) return true;
  try {
    const doc = await db.collection("shops").doc(shopId).get();
    if (!doc.exists) return false;
    return doc.data().sessionActive !== false;
  } catch(e) { return true; } // en cas d'erreur réseau, on laisse passer
}

//  FEAT 15 — SESSIONS DE TRAVAIL
// ══════════════════════════════════════════════════════════════════
function SectionSessions({ T, shopId, sales, caissiers }) {
  const KEY=`pos_sessions_${shopId}`;
  const [sessions, setSessions] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } });
  const save=(list)=>{setSessions(list); localStorage.setItem(KEY, JSON.stringify(list));};
  const open=(cName)=>{save([...sessions,{id:Date.now().toString(36),caissier:cName,openedAt:Date.now(),closedAt:null}]);};
  const close=(id)=>save(sessions.map(s=>s.id===id?{...s,closedAt:Date.now()}:s));
  const getSessStats=(cName,openedAt,closedAt)=>{
    const end=closedAt||Date.now();
    const ss=sales.filter(s=>s.caissier===cName&&!s.cancelled&&(s.timestamp||0)>=openedAt&&(s.timestamp||0)<=end);
    return {ca:ss.reduce((a,s)=>a+(s.total||0),0),nb:ss.length,duration:Math.round((end-openedAt)/60000)};
  };
  const openSess=sessions.find(s=>!s.closedAt);
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:12}}>⏰ Sessions de travail</div>
    {!openSess&&<div style={{background:T.surface,borderRadius:14,padding:12,marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Ouvrir une session</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {caissiers.map(c=><button key={c.id} onClick={()=>open(c.name)} style={{background:T.accent,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,color:T.bg,fontSize:11}}>{c.name}</button>)}
        {caissiers.length===0&&<div style={{color:T.textMute,fontSize:11}}>Créez d'abord des caissiers</div>}
      </div>
    </div>}
    {openSess&&<div style={{background:T.accent+"22",borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${T.accent}44`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:13,fontWeight:800,color:T.accent}}>🟢 Session ouverte</div><div style={{fontSize:11}}>{openSess.caissier} · {new Date(openSess.openedAt).toLocaleTimeString("fr-FR")}</div></div>
        <button onClick={()=>close(openSess.id)} style={{background:T.red,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,color:"#fff"}}>Fermer</button>
      </div>
      {(()=>{const s=getSessStats(openSess.caissier,openSess.openedAt,null); return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}}>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>CA</div><div style={{fontWeight:800,color:T.green}}>{fmtPrice(s.ca)}</div></div>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>Ventes</div><div style={{fontWeight:800,color:T.blue}}>{s.nb}</div></div>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>Durée</div><div style={{fontWeight:800}}>{s.duration}min</div></div>
      </div>;})()}
    </div>}
    <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Historique ({sessions.filter(s=>s.closedAt).length})</div>
    {[...sessions].filter(s=>s.closedAt).reverse().slice(0,8).map(s=>{const st=getSessStats(s.caissier,s.openedAt,s.closedAt); return <div key={s.id} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700}}>{s.caissier}</span><span style={{fontWeight:800,color:T.accent}}>{fmtPrice(st.ca)}</span></div>
      <div style={{fontSize:9,color:T.textMute}}>{new Date(s.openedAt).toLocaleDateString("fr-FR")} · {st.duration}min · {st.nb} vente(s)</div>
    </div>;})}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
//  FEAT 17 — IMPORT CSV PRODUITS
// ══════════════════════════════════════════════════════════════════
function SectionImportCSV({ T, shopId, products, setProducts, flashMsg }) {
  const [preview, setPreview] = useState([]); const [importing, setImporting] = useState(false);
  const parseCSV=(text)=>{
    const lines=text.trim().split("\n"); const headers=lines[0].split(/[;,]/).map(h=>h.trim().toLowerCase().replace(/"/g,""));
    return lines.slice(1).map(line=>{const vals=line.split(/[;,]/).map(v=>v.trim().replace(/"/g,"")); const obj={}; headers.forEach((h,i)=>obj[h]=vals[i]||""); return obj;}).filter(r=>r.nom||r.name);
  };
  const handleFile=(e)=>{const f=e.target.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=ev=>setPreview(parseCSV(ev.target.result).slice(0,50)); reader.readAsText(f,"utf-8");};
  const doImport=()=>{
    setImporting(true);
    const newProds=preview.map(r=>({id:"imp_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:r.nom||r.name||"Article",price:parseInt(r["prix vente"]||r.prix||r.price||0)||0,prixAchat:parseInt(r["prix achat"]||r.achat||r.cost||0)||0,category:r.categorie||r.category||"Importé",stock:parseInt(r.stock)||0,barcode:r.barcode||null,active:true,photo:null}));
    const updated=[...products,...newProds]; setProducts(updated); OfflineStore.set(shopId,"products",updated);
    if(db) newProds.forEach(p=>db.collection("shops").doc(shopId).collection("products").doc(p.id).set(p).catch(()=>{}));
    setPreview([]); setImporting(false); flashMsg(`✅ ${newProds.length} produits importés`);
    auditLog.add(shopId,"produit",`Import CSV: ${newProds.length} produits`);
  };
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>🗂️ Import produits CSV</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:12}}>Colonnes: nom, prix vente, prix achat, categorie, stock, barcode</div>
    <label style={{display:"block",background:T.btnBlue.bg,border:`2px dashed ${T.blue}55`,borderRadius:14,padding:24,textAlign:"center",cursor:"pointer",marginBottom:12}}>
      <div style={{fontSize:24,marginBottom:6}}>📁</div><div style={{fontSize:12,fontWeight:700,color:T.blue}}>Choisir fichier CSV</div>
      <input type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/>
    </label>
    {preview.length>0&&<><div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Aperçu ({preview.length})</div>
      {preview.slice(0,5).map((r,i)=><div key={i} style={{background:T.surface,borderRadius:8,padding:8,marginBottom:4,fontSize:10}}><span style={{fontWeight:600}}>{r.nom||r.name}</span> · {fmtPrice(parseInt(r["prix vente"]||r.prix||0))} · {r.categorie||r.category||"—"} · Stock: {r.stock||"0"}</div>)}
      {preview.length>5&&<div style={{fontSize:10,color:T.textMute,textAlign:"center",marginBottom:8}}>+{preview.length-5} autres...</div>}
      <div style={{display:"flex",gap:8}}><button onClick={()=>setPreview([])} style={{flex:1,background:T.surface2,border:"none",borderRadius:10,padding:10}}>Annuler</button><button onClick={doImport} disabled={importing} style={{flex:1,background:T.green,border:"none",borderRadius:10,padding:10,fontWeight:700,color:T.bg}}>⬆️ Importer {preview.length}</button></div>
    </>}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
//  FEAT 20 — SCAN FACTURE (OCR IA)
// ══════════════════════════════════════════════════════════════════
function SectionScanFacture({ T, shopId, flashMsg }) {
  const [img, setImg] = useState(null); const [loading, setLoading] = useState(false); const [result, setResult] = useState(null);
  const [history, setHistory] = useState(() => { try { return JSON.parse(localStorage.getItem(`pos_factures_${shopId}`)||"[]"); } catch(e){ return []; } });
  const handleImg=(e)=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>setImg(ev.target.result); r.readAsDataURL(f);};
  const analyze=async()=>{
    if(!img) return; setLoading(true);
    try {
      const base64=img.split(",")[1]; const mediaType=img.split(";")[0].split(":")[1];
      const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:'Analyse cette facture et extrais en JSON UNIQUEMENT: {"fournisseur":"","date":"YYYY-MM-DD","total":0,"items":[{"nom":"","qte":1,"prix":0}],"notes":""}'}]}]})});
      const data=await response.json(); const text=(data.content||[]).find(c=>c.type==="text")?.text||"{}";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setResult(parsed);
      const saved=[...history,{...parsed,id:Date.now().toString(36),analyzedAt:Date.now()}];
      setHistory(saved); localStorage.setItem(`pos_factures_${shopId}`,JSON.stringify(saved));
      flashMsg("✅ Facture analysée");
    } catch(e){flashMsg("❌ Erreur: "+e.message);}
    setLoading(false);
  };
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>📷 Scan facture fournisseur (IA)</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:12}}>Photographiez une facture — l'IA extrait les montants automatiquement</div>
    <label style={{display:"block",background:T.btnBlue.bg,border:`2px dashed ${T.blue}55`,borderRadius:14,padding:20,textAlign:"center",cursor:"pointer",marginBottom:img?8:12}}>
      {img?<img src={img} style={{maxWidth:"100%",maxHeight:160,borderRadius:8,objectFit:"contain"}}/>:<><div style={{fontSize:32}}>📷</div><div style={{fontSize:12,color:T.blue,fontWeight:700}}>Photo ou fichier</div></>}
      <input type="file" accept="image/*" capture="environment" onChange={handleImg} style={{display:"none"}}/>
    </label>
    {img&&!result&&<button onClick={analyze} disabled={loading} style={{width:"100%",background:T.accent,border:"none",borderRadius:12,padding:12,fontWeight:700,color:T.bg,marginBottom:12}}>{loading?"⏳ Analyse IA...":"🤖 Analyser la facture"}</button>}
    {result&&<div style={{background:T.surface,borderRadius:14,padding:14,marginBottom:12}}>
      <div style={{fontSize:12,fontWeight:800,marginBottom:8,color:T.accent}}>✅ Résultat</div>
      {result.fournisseur&&<div style={{fontSize:11}}><span style={{color:T.textMute}}>Fournisseur:</span> <b>{result.fournisseur}</b></div>}

// ══════════════════════════════════════════════════════════════════
//  IMPRESSION BLE - ESC/POS 80mm
// ══════════════════════════════════════════════════════════════════
class BLEPrinter {
  constructor() {
    this.device = null;
    this.server = null;
    this.characteristic = null;
    this.connected = false;
    this.listeners = [];
    this.reconnecting = false;
    this._keepAliveTimer = null;
    this._printing = false;
  }

  subscribe(callback) {
    this.listeners.push(callback);
    return () => { this.listeners = this.listeners.filter(l => l !== callback); };
  }

  notify(data) {
    this.listeners.forEach(l => l(data));
  }

  async connect() {
    if (!navigator.bluetooth) {
      throw new Error("Web Bluetooth non disponible. Utilisez Chrome/Edge sur Android.");
    }
    this.notify({ status: "searching", message: "Recherche d'imprimante..." });
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        "000018f0-0000-1000-8000-00805f9b34fb",
        "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455",
        "0000ff00-0000-1000-8000-00805f9b34fb"
      ]
    });
    this.device = device;
    device.addEventListener("gattserverdisconnected", () => {
      this.connected = false;
      this.characteristic = null;
      this.notify({ status: "disconnected", message: "Imprimante déconnectée" });
      this.autoReconnect();
    });
    await this.doConnect();
    this._startKeepAlive();
    this.notify({ status: "connected", message: `Connecté à ${device.name || "Imprimante"}`, name: device.name });
    return device.name;
  }

  async doConnect() {
    this.server = await this.device.gatt.connect();
    const services = await this.server.getPrimaryServices();
    let foundChar = null;
    for (const service of services) {
      const chars = await service.getCharacteristics();
      for (const char of chars) {
        if (char.properties.write || char.properties.writeWithoutResponse) {
          foundChar = char;
          break;
        }
      }
      if (foundChar) break;
    }
    if (!foundChar) throw new Error("Caractéristique d'écriture introuvable");
    this.characteristic = foundChar;
    this.connected = true;
  }

  _startKeepAlive() {
    if (this._keepAliveTimer) clearInterval(this._keepAliveTimer);
    this._keepAliveTimer = setInterval(async () => {
      if (!this.connected || this._printing) return;
      try {
        if (this.characteristic && this.device?.gatt?.connected) {
          const noop = new Uint8Array([0x1B, 0x00]);
          await this.characteristic.writeValueWithoutResponse(noop);
        }
      } catch(e) {
        this.connected = false;
        this.autoReconnect();
      }
    }, 8000);
  }

  _stopKeepAlive() {
    if (this._keepAliveTimer) { clearInterval(this._keepAliveTimer); this._keepAliveTimer = null; }
  }

  async autoReconnect() {
    if (this.reconnecting) return;
    this.reconnecting = true;
    this.notify({ status: "reconnecting", message: "Tentative de reconnexion..." });
    for (let i = 0; i < 5; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        if (this.device && this.device.gatt) {
          await this.doConnect();
          this.reconnecting = false;
          this._startKeepAlive();
          this.notify({ status: "connected", message: "Reconnecté !", name: this.device.name });
          return;
        }
      } catch(e) {}
    }
    this.reconnecting = false;
    this.notify({ status: "disconnected", message: "Reconnexion échouée" });
  }

  async disconnect() {
    this._stopKeepAlive();
    if (this.device && this.device.gatt.connected) {
      this.device.gatt.disconnect();
    }
    this.connected = false;
    this.characteristic = null;
    this.notify({ status: "disconnected", message: "Déconnecté" });
  }

  async print(data) {
    if (!this.connected || !this.characteristic) {
      throw new Error("Imprimante non connectée");
    }
    this._printing = true;
    const chunkSize = 95;
    const useWrite = this.characteristic.properties.writeWithoutResponse === false;
    try {
      for (let i = 0; i < data.length; i += chunkSize) {
        const chunk = data.slice(i, i + chunkSize);
        if (useWrite) {
          await this.characteristic.writeValue(chunk);
        } else {
          await this.characteristic.writeValueWithoutResponse(chunk);
        }
        await new Promise(r => setTimeout(r, 40));
      }
    } finally {
      this._printing = false;
    }
  }
}

const printer = new BLEPrinter();

// ESC/POS Commands
const ESC = 0x1B;
const GS = 0x1D;
const LF = 0x0A;
const COL_80 = 42;
const COL_57 = 32;
const COL = 42; // default 80mm

async function buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo, ticketFooter, shopAddress, shopSlogan) {
  const C = col || COL_80;
  const is80 = C >= COL_80;
  const buf = [];
  const push = (arr) => buf.push(...arr);

  // ── Encodage caractères (Latin-1 étendu pour accents) ───────
  const text = (str) => {
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code >= 32 && code <= 126) buf.push(code);
      else if (code === 0xE9 || code === 0xE8 || code === 0xEA) buf.push(0x65); // é è ê → e
      else if (code === 0xE0 || code === 0xE2) buf.push(0x61);                   // à â → a
      else if (code === 0xF9 || code === 0xFB) buf.push(0x75);                   // ù û → u
      else if (code === 0xE7) buf.push(0x63);                                     // ç → c
      else if (code === 0xEE) buf.push(0x69);                                     // î → i
      else if (code === 0xF4) buf.push(0x6F);                                     // ô → o
      else buf.push(0x20);
    }
  };
  const line = (str) => { text(str); push([LF]); };
  const emptyLine = () => push([LF]);

  // ── Taille normale (reset) ───────────────────────────────────
  // GS ! n : bit 0-2 = largeur, bit 4-6 = hauteur (0=x1, 1=x2, 3=x4)
  const sizeNormal  = () => push([GS, 0x21, 0x00]); // x1 / x1
  const sizeMedium  = () => push([GS, 0x21, 0x11]); // x2 largeur + x2 hauteur
  const sizeLarge   = () => push([GS, 0x21, 0x11]); // idem (x2)
  const boldOn      = () => push([ESC, 0x45, 0x01]);
  const boldOff     = () => push([ESC, 0x45, 0x00]);
  const alignCenter = () => push([ESC, 0x61, 0x01]);
  const alignLeft   = () => push([ESC, 0x61, 0x00]);

  // ── INIT ────────────────────────────────────────────────────
  push([ESC, 0x40]);           // Reset imprimante
  push([ESC, 0x74, 0x00]);     // Page de codes PC437

  // ── Logo ────────────────────────────────────────────────────
  alignCenter();
  if (shopLogo) {
    try {
      const maxPx = is80 ? 512 : 384;
      const logoBytes = await logoToESCPOS(shopLogo, maxPx);
      push(logoBytes);
      emptyLine();
    } catch(e) { console.warn('Logo ESC/POS ignoré:', e); }
  }

  // ── En-tête commerce ────────────────────────────────────────
  alignCenter();
  boldOn();
  push([GS, 0x21, is80 ? 0x11 : 0x10]); // x2h+x2l sur 80mm, x2h sur 57mm
  line(shopName.toUpperCase().slice(0, is80 ? 20 : 16));
  boldOff();
  sizeNormal();
  if (shopAddress) { alignCenter(); line(shopAddress.slice(0, C)); }
  if (shopPhone)   { alignCenter(); line("Tel: " + shopPhone); }
  if (shopSlogan)  { alignCenter(); line(shopSlogan.slice(0, C)); }

  // ── Date & N° ───────────────────────────────────────────────
  const d = new Date();
  const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  alignCenter();
  line("TICKET DE CAISSE");
  if (invoiceNum) line("N " + String(invoiceNum).slice(-12));
  line("Date: " + dateStr);

  // ── Séparateur ──────────────────────────────────────────────
  alignLeft();
  sizeNormal();
  line("=".repeat(C));
  boldOn(); line("ARTICLE / QTE" + " ".repeat(Math.max(1, C - 13 - 7)) + "MONTANT"); boldOff();
  line("-".repeat(C));

  // ── Articles ────────────────────────────────────────────────
  const maxLabel = is80 ? 22 : 16;
  items.forEach(it => {
    const qty = it.qty || 1;
    const price = it.amount;
    const totalLine = price * qty;
    const priceStr = fmtPrice(totalLine);
    const label = (it.label || "Article").slice(0, maxLabel);
    const spaces = Math.max(1, C - label.length - priceStr.length);
    sizeNormal();
    line(label + " ".repeat(spaces) + priceStr);
    if (qty > 1) {
      const qtyStr = `  x${qty} @ ${fmtPrice(price)}`;
      line(qtyStr);
    }
  });

  // ── Total ───────────────────────────────────────────────────
  line("=".repeat(C));
  alignCenter();
  sizeMedium();
  boldOn();
  line("TOTAL: " + fmtPrice(total));
  boldOff();
  sizeNormal();

  // ── Pied de ticket ──────────────────────────────────────────
  emptyLine();
  alignCenter();
  // Pied personnalisable — jusqu'à 3 lignes séparées par \n
  const piedLines = (ticketFooter || "Merci pour votre confiance !\n--- Digitale Solution ---").split("\n").map(l=>l.trim()).filter(Boolean);
  piedLines.forEach(l => line(l.slice(0, C)));

  // ── Avance papier + coupe ───────────────────────────────────
  push([ESC, 0x64, 0x05]);      // Avancer 5 lignes
  push([GS, 0x56, 0x41, 0x03]); // Coupe partielle

  return new Uint8Array(buf);
}

async function printViaBLE(shopName, shopPhone, items, total, invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter, shopAddress, shopSlogan) {
  if (!printer.connected) throw new Error("Imprimante non connectée");
  const col = ticketFormat === "57mm" ? COL_57 : COL_80;
  const copies = Math.max(1, parseInt(nbCopies) || 1);
  const ticket = await buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo, ticketFooter, shopAddress, shopSlogan);
  for (let i = 0; i < copies; i++) {
    await printer.print(ticket);
    // Petite pause entre copies pour ne pas saturer le buffer BLE
    if (i < copies - 1) await new Promise(r => setTimeout(r, 600));
  }
  return true;
}

async function buildCommandeESCPOS(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, col, ticketFooter) {
  const C = col || COL_80;
  const is80 = C >= COL_80;
  const buf = [];
  const push = (arr) => buf.push(...arr);
  const text = (str) => {
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code >= 32 && code <= 126) buf.push(code);
      else if (code === 0xE9 || code === 0xE8 || code === 0xEA) buf.push(0x65);
      else if (code === 0xE0 || code === 0xE2) buf.push(0x61);
      else if (code === 0xF9 || code === 0xFB) buf.push(0x75);
      else if (code === 0xE7) buf.push(0x63);
      else if (code === 0xEE) buf.push(0x69);
      else if (code === 0xF4) buf.push(0x6F);
      else buf.push(0x20);
    }
  };
  const line = (str) => { text(str); push([LF]); };
  const emptyLine = () => push([LF]);
  const sizeNormal  = () => push([GS, 0x21, 0x00]);
  const sizeMedium  = () => push([GS, 0x21, 0x11]);
  const boldOn      = () => push([ESC, 0x45, 0x01]);
  const boldOff     = () => push([ESC, 0x45, 0x00]);
  const alignCenter = () => push([ESC, 0x61, 0x01]);
  const alignLeft   = () => push([ESC, 0x61, 0x00]);

  push([ESC, 0x40]);
  push([ESC, 0x74, 0x00]);

  alignCenter();
  if (shopLogo) {
    try { const maxPx = is80 ? 512 : 384; push(await logoToESCPOS(shopLogo, maxPx)); emptyLine(); } catch(e) {}
  }

  alignCenter(); boldOn();
  push([GS, 0x21, is80 ? 0x11 : 0x10]);
  line(shopName.toUpperCase().slice(0, is80 ? 20 : 16));
  boldOff(); sizeNormal();
  if (shopAddress) { alignCenter(); line(shopAddress.slice(0, C)); }
  if (shopPhone)   { alignCenter(); line("Tel: " + shopPhone); }
  if (shopSlogan)  { alignCenter(); line(shopSlogan.slice(0, C)); }

  const d = new Date();
  const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  alignCenter();
  line("BON DE COMMANDE");
  line("Date: " + dateStr);

  alignLeft(); sizeNormal();
  line("=".repeat(C));
  line("Client: " + `${commande.prenom} ${commande.nom}`);
  line("Tel: " + commande.telephone);
  line("Articles: " + commande.nbArticles);
  line("-".repeat(C));
  boldOn(); line("TOTAL A PAYER: " + fmtPrice(commande.total)); boldOff();
  line("VERSE: " + fmtPrice(commande.paidAmount || 0));
  boldOn(); line("RESTE A PAYER: " + fmtPrice(Math.max(0, commande.total - (commande.paidAmount||0)))); boldOff();
  line("=".repeat(C));

  emptyLine();
  alignCenter();
  const piedLines = (ticketFooter || "Merci pour votre confiance !\n--- Digitale Solution ---").split("\n").map(l=>l.trim()).filter(Boolean);
  piedLines.forEach(l => line(l.slice(0, C)));

  push([ESC, 0x64, 0x05]);
  push([GS, 0x56, 0x41, 0x03]);
  return new Uint8Array(buf);
}

    html += `<div class="row" style="font-weight:bold;color:${reste>0?'#c0392b':'#1f9d55'}"><span>RESTE À PAYER</span><span>${fmtPrice(reste)}</span></div>`;
    html += `<hr class="sep">`;
    html += `<div class="footer">${piedLines.map(l=>`<div>${l}</div>`).join("")}</div></body></html>`;
    return html;
  };
  const win = window.open("", "_blank", "width=500,height=700");
  if(win) {
    let fullHtml = buildHtml();
    fullHtml = fullHtml.replace('</head>', `<style>@page{size:${w} auto;margin:4mm}</style></head>`);
    win.document.write(fullHtml);
    win.document.close();
    win.onload = () => {
      for(let i=0;i<copies;i++) win.print();
      setTimeout(()=>win.close(), 1500 * copies);
    };
  }
}

function buildReliquatWhatsAppMsg(commande, shopName) {
  const reste = Math.max(0, commande.total - (commande.paidAmount||0));
  return `Bonjour ${commande.prenom} ${commande.nom}, nous vous rappelons que le solde de votre commande chez ${shopName||"notre boutique"} s'élève à ${fmtPrice(reste)} (Total: ${fmtPrice(commande.total)}, déjà versé: ${fmtPrice(commande.paidAmount||0)}). Merci de bien vouloir régler ce reliquat dès que possible. Cordialement.`;
}

// ══════════════════════════════════════════════════════════════════
function SubscriptionBanner({ T, shopId }) {
  const [subscription, setSubscription] = useState(null);
  const [loading, setLoading] = useState(true);
  
  useEffect(() => {
    if(!db || !shopId) return;
    const unsub = db.collection("shops").doc(shopId).onSnapshot(doc => {
      if(doc.exists) {
        const data = doc.data();
        setSubscription({ 
          end: data.subscriptionEnd, 
          plan: data.plan || "mensuel",
          start: data.subscriptionStart
        });
      }
      setLoading(false);
    });
    return unsub;
  }, [shopId]);
  
  if(loading || !subscription || !subscription.end) return null;
  
  const daysLeft = getDaysLeft(subscription.end);
  const expired = daysLeft === 0;
  const warning = daysLeft <= 7 && daysLeft > 0;
  
  if(!expired && !warning) return null;
  
  const bgColor = expired ? T.red : T.orange;
  const message = expired 
    ? `⚠️⚠️⚠️ VOTRE ABONNEMENT A EXPIRE ! Veuillez contacter l'administrateur immédiatement pour renouveler. ⚠️⚠️⚠️`
    : `🔔🔔🔔 Votre abonnement ${planLabel(subscription.plan)} expire dans ${daysLeft} JOUR${daysLeft > 1 ? "S" : ""} (le ${formatDate(subscription.end)}). Contactez-nous pour renouveler ! 🔔🔔🔔`;
  
  return (
    <div style={{ 
      background: bgColor, 
      color: "#fff", 
      padding: "10px 12px", 
      overflow: "hidden", 
      whiteSpace: "nowrap", 
      position: "relative", 
      flexShrink: 0,
      boxShadow: "inset 0 -2px 0 rgba(0,0,0,0.1)",
      zIndex: 10
    }}>
      <div className="marquee" style={{ display: "inline-block", paddingRight: "80px" }}>
        {message} &nbsp;&nbsp;&nbsp; {message} &nbsp;&nbsp;&nbsp; {message}
      </div>
      <a 
        href={`https://wa.me/${DEV_WHATSAPP}?text=${encodeURIComponent(`Bonjour, je souhaite renouveler mon abonnement (${planLabel(subscription.plan)}), il expire le ${formatDate(subscription.end)}.`)}`}
        target="_blank"
        rel="noopener noreferrer"
        style={{ 
          position: "absolute", 
          right: 8, 
          top: "50%", 
          transform: "translateY(-50%)", 
          background: "#fff", 
          color: "#000", 
          padding: "4px 12px", 
          borderRadius: 25, 
          fontSize: 11, 
          fontWeight: "bold", 
          textDecoration: "none",
          boxShadow: "0 2px 8px rgba(0,0,0,0.2)",
          zIndex: 11
        }}
      >
        📱 WhatsApp
      </a>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  COMPOSANT BLE STATUS
// ══════════════════════════════════════════════════════════════════
function BLEStatus({ T }) {
  const [status, setStatus] = useState({ status: "disconnected", message: "Hors ligne" });
  const [connecting, setConnecting] = useState(false);
  const [testPrinting, setTestPrinting] = useState(false);
  
  useEffect(() => {
    const unsub = printer.subscribe(setStatus);
    return unsub;
  }, []);
  
  const connect = async () => {
    setConnecting(true);
    try {
      await printer.connect();
    } catch(e) {
      setStatus({ status: "error", message: e.message });
    }
    setConnecting(false);
  };
  
  const disconnect = () => printer.disconnect();
  
  const testPrint = async () => {
    if (!printer.connected) { alert("Connectez d'abord l'imprimante"); return; }
    setTestPrinting(true);
    try {
      const testItems = [{ label: "TEST IMPRESSION THERMIQUE", amount: 500, qty: 1 }, { label: "ESC/POS BLE - Impression OK", amount: 250, qty: 2 }];
      await printViaBLE("TEST CAISSE PRO", "", testItems, 1000, Date.now(), "80mm", null, 1, "Test impression OK");
      alert("✅ Impression test envoyée avec succès !");
    } catch(e) { alert("❌ Erreur: " + e.message); }
    setTestPrinting(false);
  };
  
  const isConnected = status.status === "connected";
  const color = isConnected ? T.green : (status.status === "searching" || status.status === "reconnecting" ? T.blue : T.red);
  const icon = isConnected ? "🖨️" : (status.status === "searching" || status.status === "reconnecting" ? "⏳" : "❌");
  
  return (
    <div style={{ background: T.surface, borderRadius: 12, padding: 10, marginBottom: 12, border: `1px solid ${color}` }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 24 }}>{icon}</span>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color }}>{isConnected ? "Imprimante connectée" : (status.status === "searching" ? "Recherche..." : status.status === "reconnecting" ? "Reconnexion..." : "Hors ligne")}</div>
            {status.name && <div style={{ fontSize: 10, color: T.textMute }}>{status.name}</div>}
            {status.message && !isConnected && <div style={{ fontSize: 9, color: T.textMute }}>{status.message}</div>}
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {!isConnected ? (
            <button onClick={connect} disabled={connecting} style={{ background: T.btnGreen.bg, border:`1px solid ${T.border}`, borderRadius: 8, padding: "6px 12px", fontSize: 11, color: T.green, fontWeight: 600 }}>{connecting ? "..." : "🔌 Connecter"}</button>
          ) : (
            <>
              <button onClick={testPrint} disabled={testPrinting} style={{ background: T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius: 8, padding: "4px 10px", fontSize: 10, color: T.blue }}>{testPrinting ? "..." : "🖨️ Test"}</button>
              <button onClick={disconnect} style={{ background: T.btnRed.bg, border:`1px solid ${T.red}44`, borderRadius: 8, padding: "4px 10px", fontSize: 10, color: T.red }}>Déco</button>
            </>
          )}
        </div>
      </div>
      {isConnected && <div style={{ fontSize: 9, color: T.textMute, marginTop: 6, textAlign: "center" }}>✅ ESC/POS — Formats 80mm & 57mm disponibles</div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  COMPOSANT VENTE RAPIDE
// ══════════════════════════════════════════════════════════════════
function VenteRapide({ T, addSale, flashMsg }) {
  const [lines, setLines] = useState([]);
  const [montant, setMontant] = useState("");
  const [label, setLabel] = useState("");
  const [modeMonnaie, setModeMonnaie] = useState(false);
  const [recu, setRecu] = useState("");
  // Historique montants fréquents
  const HIST_KEY = "pos_vr_history";
  const [montantHistory] = useState(() => { try { return JSON.parse(localStorage.getItem(HIST_KEY)||"[]"); } catch(e){ return []; } });
  const saveHistory = (montant) => { const h=[montant, ...montantHistory.filter(x=>x!==montant)].slice(0,8); localStorage.setItem(HIST_KEY, JSON.stringify(h)); };
  const QUICK_LABELS = ["Repas","Boisson","Transport","Service","Autre"];
  
  const montantNum = parseInt(montant) || 0;
  const totalLines = lines.reduce((s,l)=>s + l.montant, 0);
  const recuNum = parseInt(recu) || 0;
  const monnaie = recuNum - totalLines;
  const BILLS = [500, 1000, 2000, 5000, 10000, 25000];
  
  const ajouterLigne = () => {
    if(!montantNum || montantNum < 1) { flashMsg("Entrez un montant"); return; }
    const nom = label.trim() || `Vente ${fmtPrice(montantNum)}`;
    setLines([...lines, { id: Date.now()+Math.random(), label: nom, montant: montantNum }]);
    saveHistory(montantNum);
    setMontant("");
    setLabel("");
  };
  
  const supprimerLigne = (id) => setLines(lines.filter(l=>l.id!==id));
  const reset = () => { setLines([]); setMontant(""); setLabel(""); setModeMonnaie(false); setRecu(""); };
  
  const valider = (print) => {
    if(lines.length === 0) { flashMsg("Ajoutez des lignes"); return; }
    const items = lines.map(l => ({ label: l.label, amount: l.montant, qty: 1 }));
    addSale(items, totalLines, print);
    reset();
  };
  
  const pushDigit = (d) => {
    if(modeMonnaie) setRecu(p => p.length >= 8 ? p : p + d);
    else setMontant(p => p.length >= 8 ? p : p + d);
  };
  const del = () => {
    if(modeMonnaie) setRecu(p => p.slice(0,-1));
    else setMontant(p => p.slice(0,-1));
  };
  
  return (
    <div className="vr-root" style={{display:"flex", flexDirection:"column", width:"100%", maxWidth:900, margin:"0 auto", boxSizing:"border-box"}}>
      <div className="vr-layout" style={{display:"flex", gap:16, alignItems:"flex-start"}}>
        <div className="vr-left" style={{flex:"1 1 340px", minWidth:0}}>
          <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12, border:`2px solid ${modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.border)}`}}>
            {!modeMonnaie && (
              <>
                <input placeholder="Libellé (optionnel)" value={label} onChange={e=>setLabel(e.target.value)} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, marginBottom:6, color:T.text}} />
                <div style={{display:"flex", gap:4, flexWrap:"wrap", marginBottom:8}}>
                  {QUICK_LABELS.map(l=>(
                    <button key={l} onClick={()=>setLabel(l)} style={{background:label===l?T.accent:T.surface2, border:`1px solid ${label===l?T.accent:T.border}`, borderRadius:8, padding:"3px 8px", fontSize:10, color:label===l?T.bg:T.textMute}}>{l}</button>
                  ))}
                </div>
                {montantHistory.length > 0 && montant === "" && (
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:9, color:T.textMute, marginBottom:4}}>🕐 Récents :</div>
                    <div style={{display:"flex", gap:4, flexWrap:"wrap"}}>
                      {montantHistory.slice(0,6).map(h=>(
                        <button key={h} onClick={()=>setMontant(String(h))} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"3px 8px", fontSize:10, fontWeight:600}}>{fmtPrice(h)}</button>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
              <span style={{fontSize:11, color:T.textMute, flexShrink:0}}>{modeMonnaie ? "Montant reçu" : "Montant"}</span>
              <span style={{fontSize:"clamp(22px,min(8vw,5vh),36px)", fontWeight:800, color:modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.textMute), overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                {modeMonnaie ? (recu ? fmtPrice(recuNum) : "—") : (montant ? fmtPrice(montantNum) : "0 F")}
              </span>
            </div>
          </div>

          {modeMonnaie && (
            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, marginBottom:12}}>
              {BILLS.map(b=><button key={b} onClick={()=>setRecu(String(b))} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:12, fontWeight:700}}>{b>=1000?(b/1000)+"k":b}</button>)}
            </div>
          )}

          {lines.length > 0 && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10, color:T.textMute, marginBottom:6}}>Lignes ({lines.length})</div>
              <div style={{maxHeight:"clamp(120px,30vh,260px)", overflowY:"auto"}}>
                {lines.map((l,idx)=>(
                  <div key={l.id} style={{background:T.surface2, borderRadius:10, padding:10, marginBottom:6, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                    <div><span style={{color:T.textMute, marginRight:8}}>{idx+1}.</span><span>{l.label}</span></div>
                    <div style={{display:"flex", alignItems:"center", gap:10}}>
                      <span style={{fontWeight:700, color:T.accent}}>{fmtPrice(l.montant)}</span>
                      {!modeMonnaie && <button onClick={()=>supprimerLigne(l.id)} style={{background:T.btnRed.bg, border:"none", borderRadius:6, width:28, height:28, color:T.red, fontSize:16, flexShrink:0}}>×</button>}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{background:T.btnGreen.bg, borderRadius:12, padding:12, marginTop:6, display:"flex", justifyContent:"space-between", border:`1px solid ${T.green}`}}>
                <span style={{fontWeight:700}}>TOTAL</span>
                <span style={{fontSize:20, fontWeight:800, color:T.green}}>{fmtPrice(totalLines)}</span>
              </div>
            </div>
          )}

          {modeMonnaie && recuNum > 0 && (
            <div style={{background:monnaie>=0 ? T.btnGreen.bg : T.btnRed.bg, borderRadius:12, padding:16, textAlign:"center", marginBottom:12}}>
              <div style={{fontSize:11, color:T.textMute}}>Monnaie à rendre</div>
              <div style={{fontSize:32, fontWeight:800, color:monnaie>=0 ? T.green : T.red}}>{monnaie>=0 ? fmtPrice(monnaie) : `-${fmtPrice(Math.abs(monnaie))}`}</div>
            </div>
          )}
        </div>

        <div className="vr-right" style={{flex:"1 1 260px", minWidth:0, background:T.bg}}>
          <div className="vr-numpad" style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"clamp(4px,1vw,6px)"}}>
            {[7,8,9,4,5,6,1,2,3].map(d=><button key={d} className="vr-numkey" onClick={()=>pushDigit(String(d))} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(16px,min(5vw,3.4vh),22px)", fontWeight:600, color:T.text}}>{d}</button>)}
            <button className="vr-numkey" onClick={()=>pushDigit("00")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(13px,min(3.6vw,2.6vh),17px)", color:T.text}}>00</button>
            <button className="vr-numkey" onClick={()=>pushDigit("0")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(16px,min(5vw,3.4vh),22px)", color:T.text}}>0</button>
            <button className="vr-numkey" onClick={del} style={{background:T.btnRed.bg, border:`1px solid ${T.red}44`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(14px,min(4vw,2.8vh),19px)", color:T.red}}>⌫</button>
          </div>

          {!modeMonnaie ? (
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
              <button onClick={reset} style={{background:"transparent", border:`1px solid ${T.red}44`, borderRadius:12, padding:"10px 6px", color:T.red, fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>✕ Annuler</button>
              <button onClick={ajouterLigne} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:700, fontSize:"clamp(11px,2.6vw,13px)"}}>➕ Ajouter ligne</button>
              <button onClick={()=>{ if(lines.length) setModeMonnaie(true); else flashMsg("Ajoutez des lignes d'abord"); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>💵 Monnaie</button>
              <button onClick={()=>valider(false)} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:700, fontSize:"clamp(11px,2.6vw,13px)"}}>✅ Sans ticket</button>
              <button onClick={()=>valider(true)} style={{gridColumn:"1 / -1", background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800, fontSize:"clamp(13px,3vw,15px)"}}>🖨️ Valider et imprimer</button>
            </div>
          ) : (
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
              <button onClick={()=>{ setModeMonnaie(false); setRecu(""); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", fontSize:"clamp(11px,2.6vw,13px)"}}>← Retour</button>
              <button onClick={()=>valider(false)} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>✅ Sans ticket</button>
              <button onClick={()=>valider(true)} style={{gridColumn:"1 / -1", background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800, fontSize:"clamp(13px,3vw,15px)"}}>🖨️ Imprimer</button>
            </div>
          )}
        </div>
      </div>
      {/* Spacer FAB mobile */}
      <div style={{height:80}} />
    </div>
  );
}

function App() {

  // Écoute les changements de préférence système quand mode=auto
