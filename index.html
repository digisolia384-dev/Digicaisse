    const handler = () => { /* force re-render */ setThemeName(n => n === "auto" ? "auto" : n); };
    mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
    return () => mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
  }, [themeName]);
  const [session, setSession] = useState(() => {
    // Restauration depuis session locale (offline OU rechargement de page)
    const saved = SessionStore.load();
    if (saved) return saved;
    return null;
  });
  const [sessionRestored, setSessionRestored] = useState(() => !!SessionStore.load());
  const [reAuthPending, setReAuthPending] = useState(false);
  const [authMode, setAuthMode] = useState("login");
  const [authShopName, setAuthShopName] = useState("");
  const [authOwnerName, setAuthOwnerName] = useState("");
  const [authWhatsapp, setAuthWhatsapp] = useState("");
  const [authPhone, setAuthPhone] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authConfirm, setAuthConfirm] = useState("");
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [flash, setFlash] = useState(null);
  const [devMode, setDevMode] = useState(false);
  const [devPin, setDevPin] = useState("");
  const [devPinError, setDevPinError] = useState(false);
  const [devPinShake, setDevPinShake] = useState(false);
  const [adminPinMode, setAdminPinMode] = useState(false);
  const [adminPin, setAdminPin] = useState("");
  const [adminPinError, setAdminPinError] = useState(false);
  const [adminPinShake, setAdminPinShake] = useState(false);
  const [adminPinLoading, setAdminPinLoading] = useState(false);
  const clickCountRef = useRef({ count: 0, timer: null });
  
  const flashMsg = (msg) => { setFlash(msg); setTimeout(()=>setFlash(null),2500); };

  useEffect(()=>{ document.body.style.background = T.bg; document.documentElement.setAttribute("data-theme", T.mode||"dark"); localStorage.setItem("pos_theme", themeName); }, [themeName, T.bg]);

  const handleLogoTripleClick = () => {
    const ref = clickCountRef.current;
    ref.count++;
    clearTimeout(ref.timer);
    if (ref.count >= 3) {
      ref.count = 0;
      setDevMode(true);
      setDevPin("");
      setDevPinError(false);
    }
    ref.timer = setTimeout(() => { ref.count = 0; }, 500);
  };

  const verifyDevPin = () => {
    if (devPin === DEV_PIN) {
      setDevMode(false);
      setDevPin("");
      setSession({ shopId: "dev_dashboard", shopName: "Développeur", ownerName: "Admin", isDev: true, isSuperAdmin: true });
    } else {
      setDevPinError(true);
      setDevPinShake(true);
      setTimeout(() => { setDevPinShake(false); setDevPin(""); setDevPinError(false); }, 700);
    }
  };

  // ── Connexion via PIN admin (créé depuis Super Admin) ──────────────
  const failAdminPin = () => {
    setAdminPinError(true);
    setAdminPinShake(true);
    setTimeout(() => { setAdminPinShake(false); setAdminPin(""); setAdminPinError(false); }, 700);
  };

  const verifyAdminPin = async () => {
    if (adminPinLoading || !adminPin || !db) return;
    setAdminPinLoading(true);
    try {
      const snap = await db.collection("superadmin").doc("admins").collection("list").get();
      let found = null;
      snap.docs.forEach(d => {
        const data = d.data();
        if (data.active === false) return;
        try { if (atob(data.pin || "") === adminPin) found = { id: d.id, ...data }; } catch(e) {}
      });
      if (!found) { failAdminPin(); setAdminPinLoading(false); return; }
      const shopDoc = await db.collection("shops").doc(found.shopId).get();
      if (!shopDoc.exists) { flashMsg("Commerce introuvable pour cet admin"); failAdminPin(); setAdminPinLoading(false); return; }
      const data = shopDoc.data();
      if (data.active === false) { flashMsg("Compte commerce désactivé"); setAdminPinLoading(false); return; }
      if (data.sessionActive === false) { flashMsg("Session suspendue par l'administrateur — contactez le support"); setAdminPinLoading(false); return; }
      const newSession = {
        shopId: shopDoc.id, shopName: data.shopName, shopPhone: data.phone || "",
        whatsapp: data.whatsapp, ownerName: data.ownerName, plan: data.plan || "mensuel",
        subscriptionEnd: data.subscriptionEnd, adminPin: data.adminPin || btoa("0000"), isDev: false,
        shopLogo: data.logoBase64 || null,
        shopAddress: data.shopAddress || "", shopSlogan: data.shopSlogan || "",
        gerantPin: data.gerantPin || null,
        isAdminAccess: true, adminName: found.name
      };
      SessionStore.save(newSession);
      setSession(newSession);
      setSessionRestored(false);
      setAdminPinMode(false);
      setAdminPin("");
      flashMsg(`✅ Connecté en tant qu'admin (${found.name})`);
    } catch(e) { flashMsg("Erreur: " + e.message); }
    setAdminPinLoading(false);
  };

  const handleRegister = async () => {
    if(!authShopName.trim() || !authOwnerName.trim() || !authWhatsapp.trim() || authPassword.length<4 || authPassword!==authConfirm) { setAuthError("Vérifiez les champs"); return; }
    setAuthLoading(true);
    try {
      const existing = await db.collection("shops").where("shopName", "==", authShopName.trim()).get();
      if(!existing.empty) throw new Error("Nom déjà utilisé");
      const shopId = "shop_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
      const now = Date.now();
      await db.collection("shops").doc(shopId).set({ 
        shopName: authShopName.trim(), ownerName: authOwnerName.trim(), whatsapp: authWhatsapp.trim(), phone: authPhone.trim(), 
        password: btoa(authPassword), createdAt: now, active: true, plan: "mensuel", 
        subscriptionStart: now, subscriptionEnd: calculateEndDate(now, "mensuel"),
        adminPin: btoa("0000"), logoBase64: null
      });
      await db.collection("shops").doc(shopId).collection("products").doc("_init").set({init:true});
      await db.collection("shops").doc(shopId).collection("sales").doc("_init").set({init:true});
      await db.collection("shops").doc(shopId).collection("stock_movements").doc("_init").set({init:true});
      flashMsg("Commerce créé ! Connectez-vous");
      setAuthMode("login");
    } catch(e) { setAuthError(e.message); }
    setAuthLoading(false);
  };

  const handleLogin = async () => {
    if(!authShopName.trim() || !authPassword) { setAuthError("Nom et mot de passe requis"); return; }
    setAuthLoading(true);
    try {
      const query = await db.collection("shops").where("shopName", "==", authShopName.trim()).get();
      if(query.empty) throw new Error("Commerce introuvable");
      const doc = query.docs[0];
      const data = doc.data();
      if(btoa(authPassword) !== data.password) throw new Error("Mot de passe incorrect");
      if(data.active === false) throw new Error("Compte désactivé");
      if(data.sessionActive === false) throw new Error("Session suspendue par l'administrateur — contactez le support");
      const newSession = { 
        shopId: doc.id, shopName: data.shopName, shopPhone: data.phone || "", 
        whatsapp: data.whatsapp, ownerName: data.ownerName, plan: data.plan || "mensuel", 
        subscriptionEnd: data.subscriptionEnd, adminPin: data.adminPin || btoa("0000"), isDev: false,
        shopLogo: data.logoBase64 || null,
        shopAddress: data.shopAddress || "", shopSlogan: data.shopSlogan || "",
        gerantPin: data.gerantPin || null
      };
      SessionStore.save(newSession);
      setSession(newSession);
      setSessionRestored(false);
    } catch(e) { setAuthError(e.message); }
    setAuthLoading(false);
  };

  const logout = () => { SessionStore.clear(); setSession(null); setSessionRestored(false); };

  // ── Reconnexion silencieuse au retour du réseau ───────────────────────────
  useEffect(() => {
    if (!sessionRestored || !session) return;
    let active = true;

    const tryReAuth = async () => {
      if (!navigator.onLine || !db) return;
      setReAuthPending(true);
      try {
        const doc = await db.collection("shops").doc(session.shopId).get();
        if (!active) return;
        if (doc.exists) {
          const data = doc.data();
          if (data.active === false) { logout(); return; }
          if (data.sessionActive === false) { logout(); return; }
          // Met à jour la session avec les données fraîches
          const refreshed = {
            ...session,
            shopName: data.shopName || session.shopName,
            shopPhone: data.phone || session.shopPhone,
            shopAddress: data.shopAddress || session.shopAddress || "",
            shopSlogan: data.shopSlogan || session.shopSlogan || "",
            adminPin: data.adminPin || session.adminPin,
            gerantPin: data.gerantPin || session.gerantPin || null,
            subscriptionEnd: data.subscriptionEnd || session.subscriptionEnd,
            plan: data.plan || session.plan,
            shopLogo: data.logoBase64 || session.shopLogo,
          };
          SessionStore.save(refreshed);
          setSession(refreshed);
          setSessionRestored(false);
        }
      } catch(e) { /* réseau instable, on reste en mode offline */ }
      if (active) setReAuthPending(false);
    };

    // Essai immédiat si en ligne
    if (navigator.onLine) { tryReAuth(); }

    // Puis écoute le retour de connexion
    const onOnline = () => tryReAuth();
    window.addEventListener("online", onOnline);
    return () => { active = false; window.removeEventListener("online", onOnline); };
  }, [sessionRestored]);

  if (devMode) {
    return (
      <div style={{minHeight:"100dvh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:16, overflowY:"auto"}}>
        <div style={{maxWidth:400, width:"100%", background:T.surface, borderRadius:32, padding:32, textAlign:"center", border:`1px solid ${T.border}`}}>
          <div style={{fontSize:48, marginBottom:16}}>🔧</div>
          <div style={{fontFamily:"'Outfit'", fontSize:20, fontWeight:800, color:T.purple, marginBottom:8}}>Accès Développeur</div>
          <div style={{display:"flex", gap:12, justifyContent:"center", marginBottom:24, animation: devPinShake ? "shake 0.35s ease" : "none"}}>
            {Array(6).fill(0).map((_,i)=><div key={i} style={{width:16,height:16,borderRadius:"50%", background: i < devPin.length ? (devPinError ? T.red : T.accent) : T.border}} />)}
          </div>
          {devPinError && <div style={{fontSize:12, color:T.red, marginBottom:16}}>✗ Code incorrect</div>}
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10}}>
            {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
              <button key={i} onClick={()=>{ if(d==="⌫") setDevPin(p=>p.slice(0,-1)); else if(d!=="") setDevPin(p=>p.length<6 ? p+d : p); }} style={{background:d===""?"transparent":T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:60, fontSize:22, color:d==="⌫"?T.red:T.text}}>{d}</button>
            ))}
          </div>
          <button onClick={verifyDevPin} style={{marginTop:20, background:T.accent, border:"none", borderRadius:12, padding:12, width:"100%", fontWeight:700, color:T.bg}}>Valider</button>
          <button onClick={()=>{setDevMode(false); setDevPin("");}} style={{marginTop:12, background:"transparent", border:"none", color:T.textMute, fontSize:12}}>← Retour</button>
        </div>
      </div>
    );
  }

  if (adminPinMode) {
    return (
      <div style={{minHeight:"100dvh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:16, overflowY:"auto"}}>
        <div style={{maxWidth:400, width:"100%", background:T.surface, borderRadius:32, padding:32, textAlign:"center", border:`1px solid ${T.border}`}}>
          <div style={{fontSize:48, marginBottom:16}}>🛡️</div>
          <div style={{fontFamily:"'Outfit'", fontSize:20, fontWeight:800, color:T.purple, marginBottom:4}}>Connexion Admin</div>
          <div style={{fontSize:11, color:T.textMute, marginBottom:20}}>Entrez le PIN fourni par le Super Admin</div>
          <div style={{display:"flex", gap:12, justifyContent:"center", marginBottom:24, animation: adminPinShake ? "shake 0.35s ease" : "none", flexWrap:"wrap"}}>
            {Array(Math.max(6, adminPin.length)).fill(0).map((_,i)=><div key={i} style={{width:16,height:16,borderRadius:"50%", background: i < adminPin.length ? (adminPinError ? T.red : T.accent) : T.border}} />)}
          </div>
          {adminPinError && <div style={{fontSize:12, color:T.red, marginBottom:16}}>✗ PIN incorrect ou admin désactivé</div>}
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10}}>
            {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
              <button key={i} onClick={()=>{ if(d==="⌫") setAdminPin(p=>p.slice(0,-1)); else if(d!=="") setAdminPin(p=>p.length<6 ? p+d : p); }} style={{background:d===""?"transparent":T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:60, fontSize:22, color:d==="⌫"?T.red:T.text}}>{d}</button>
            ))}
          </div>
          <button onClick={verifyAdminPin} disabled={adminPinLoading || adminPin.length<4} style={{marginTop:20, background:T.accent, border:"none", borderRadius:12, padding:12, width:"100%", fontWeight:700, color:T.bg, opacity:(adminPinLoading || adminPin.length<4)?0.6:1}}>{adminPinLoading ? "..." : "Valider"}</button>
          <button onClick={()=>{setAdminPinMode(false); setAdminPin(""); setAdminPinError(false);}} style={{marginTop:12, background:"transparent", border:"none", color:T.textMute, fontSize:12}}>← Retour</button>
        </div>
      </div>
    );
  }

  if(!session) {
    return (
      <div style={{minHeight:"100dvh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:16, overflowY:"auto"}}>
        <div style={{maxWidth:420, width:"100%", background:T.surface, borderRadius:28, padding:"20px 20px 28px", border:`1px solid ${T.border}`, margin:"auto"}}>
          <div style={{textAlign:"center", marginBottom:24, cursor:"pointer"}} onClick={handleLogoTripleClick}>
            <div style={{fontSize:42}}>🏪</div>
            <div style={{fontFamily:"'Outfit'", fontSize:28, fontWeight:800, color:T.accent}}>Caisse SaaS Pro</div>
            <div style={{fontSize:10, color:T.textMute, marginTop:4}}>Triple-clic mode développeur</div>
          </div>
          {flash && <div style={{background:T.btnRed.bg, color:T.red, padding:8, borderRadius:8, marginBottom:12, textAlign:"center"}}>{flash}</div>}
          <div style={{display:"flex", gap:8, marginBottom:20, background:T.surface2, borderRadius:12, padding:4}}>
            <button onClick={()=>{setAuthMode("login"); setAuthError("");}} style={{flex:1, background:authMode==="login"?T.accent:"transparent", border:"none", borderRadius:8, padding:"8px", fontWeight:700, color:authMode==="login"?T.bg:T.textSub}}>Connexion</button>
            <button onClick={()=>{setAuthMode("register"); setAuthError("");}} style={{flex:1, background:authMode==="register"?T.accent:"transparent", border:"none", borderRadius:8, padding:"8px", fontWeight:700, color:authMode==="register"?T.bg:T.textSub}}>Créer</button>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:12}}>
            <input placeholder="Nom du commerce" value={authShopName} onChange={e=>setAuthShopName(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />
            {authMode==="register" && (<><input placeholder="Nom du propriétaire" value={authOwnerName} onChange={e=>setAuthOwnerName(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /><input placeholder="WhatsApp" value={authWhatsapp} onChange={e=>setAuthWhatsapp(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /><input placeholder="Téléphone" value={authPhone} onChange={e=>setAuthPhone(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /></>)}
            <input type="password" placeholder="Mot de passe" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />
            {authMode==="register" && <input type="password" placeholder="Confirmer" value={authConfirm} onChange={e=>setAuthConfirm(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />}
            {authError && <div style={{fontSize:12, color:T.red, textAlign:"center"}}>{authError}</div>}
            <button onClick={authMode==="register"?handleRegister:handleLogin} disabled={authLoading} style={{background:T.accent, border:"none", borderRadius:16, padding:"16px", fontWeight:800, fontSize:16, color:T.bg}}>{authLoading ? "..." : (authMode==="register" ? "Créer" : "Se connecter")}</button>
            {authMode==="login" && <button onClick={()=>{setAdminPinMode(true); setAdminPin(""); setAdminPinError(false);}} style={{background:"transparent", border:"none", color:T.purple, fontSize:12, fontWeight:600, padding:"4px"}}>🛡️ Connexion Admin (PIN)</button>}
          </div>
        </div>
      </div>
    );
  }

  if(session?.isSuperAdmin) return <SuperAdminDashboard T={T} themeName={themeName} setThemeName={setThemeName} logout={logout} flashMsg={flashMsg} />;
  if(session?.isDev) return <DevDashboard T={T} themeName={themeName} setThemeName={setThemeName} logout={logout} flashMsg={flashMsg} />;
  return <MainApp session={session} T={T} themeName={themeName} setThemeName={setThemeName} logout={logout} flashMsg={flashMsg} sessionRestored={sessionRestored} reAuthPending={reAuthPending} />;
}

// ══════════════════════════════════════════════════════════════════
//  MAIN APP AVEC BANDE D'ABONNEMENT
// ══════════════════════════════════════════════════════════════════
function MainApp({ session, T, themeName, setThemeName, logout, flashMsg, sessionRestored, reAuthPending }) {
  const [products, setProducts] = useState(() => OfflineStore.get(session.shopId, "products") || []);
  const [sales, setSales] = useState(() => OfflineStore.get(session.shopId, "sales") || []);
  const [stockMovements, setStockMovements] = useState(() => OfflineStore.get(session.shopId, "stock_movements") || []);
  const [credits, setCredits] = useState(() => OfflineStore.get(session.shopId, "credits") || []);
  const [caissiers, setCaissiers] = useState(() => OfflineStore.get(session.shopId, "caissiers") || []);
  const [commandes, setCommandes] = useState(() => OfflineStore.get(session.shopId, "commandes") || []);
  const [currentCaissier, setCurrentCaissier] = useState(() => { try { return JSON.parse(sessionStorage.getItem("pos_caissier_"+session.shopId)||"null"); } catch(e){ return null; } });
  const [mode, setMode] = useState("CAISSE");
  const [items, setItems] = useState([]);
  const [ownerMode, setOwnerMode] = useState(false);
  const [gerantMode, setGerantMode] = useState(false);
  const [pinModal, setPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [pinShake, setPinShake] = useState(false);
  const [useBLE, setUseBLE] = useState(true);
  const [ticketFormat, setTicketFormat] = useState(() => localStorage.getItem("pos_ticket_fmt") || "80mm");
  const [nbCopies, setNbCopies] = useState(() => parseInt(localStorage.getItem("pos_ticket_copies") || "1"));
  const [ticketFooter, setTicketFooter] = useState(() => localStorage.getItem("pos_ticket_footer") || "Merci pour votre confiance !\n--- Digitale Solution ---");
  const [mobileCartOpen, setMobileCartOpen] = useState(false);
  const [shopLogo, setShopLogo] = useState(session.shopLogo || null);
  const [caissDash, setCaissDash] = useState(false);
  // ── Infos établissement modifiables ──────────────────────────
  const [shopName, setShopName] = useState(session.shopName || "");
  const [shopPhone, setShopPhone] = useState(session.shopPhone || "");
  const [shopAddress, setShopAddress] = useState(session.shopAddress || "");
  const [shopSlogan, setShopSlogan] = useState(session.shopSlogan || "");
  // ── Mode PIN (admin ou gérant) ─────────────────────────────────
  const [pinModalTarget, setPinModalTarget] = useState("admin");

  useEffect(() => { const unsub = syncShopData(session.shopId, setProducts, setSales, setStockMovements, setCredits, setCaissiers, setCommandes); return unsub; }, [session.shopId]);

  const total = items.reduce((s,i)=>s + (i.amount || 0) * (i.qty || 1), 0);
  
  const updateStock = (productId, quantity, type, reason) => {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    if (product.stock === null || product.stock === undefined || product.stock === -1) return;
    const newStock = Math.max(0, (product.stock || 0) + quantity);
    const updatedProducts = products.map(p => p.id === productId ? { ...p, stock: newStock } : p);
    setProducts(updatedProducts);
    OfflineStore.set(session.shopId, "products", updatedProducts);
    const movement = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), productId, productName: product.name, quantity, type, reason, timestamp: Date.now() };
    setStockMovements(prev => [movement, ...prev]);
    OfflineStore.set(session.shopId, "stock_movements", [movement, ...stockMovements]);
    // Fire-and-forget : pas d'await — ne bloque pas la caisse
    if(db) {
      db.collection("shops").doc(session.shopId).collection("products").doc(productId).update({ stock: newStock }).catch(()=>{});
      db.collection("shops").doc(session.shopId).collection("stock_movements").doc(movement.id).set(movement).catch(()=>{});
    }
  };

  // ── addSale optimisé : ticket instantané, persistance en arrière-plan ──
  const addSale = (saleItems, saleTotal, print=true, saleNote="") => {
    // 1. État local immédiat (synchrone) — panier vidé sans attendre le réseau
    const newSale = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), date: new Date().toISOString().slice(0,10), timestamp: Date.now(), items: saleItems, total: saleTotal, invoiceNum: Date.now(), cancelled: false, caissier: currentCaissier?.name || null, note: saleNote||null };
    setSales(prev => [...prev, newSale]);
    OfflineStore.set(session.shopId, "sales", [...sales, newSale]);
    setItems([]);

    // 2. Impression immédiate — ne bloque pas, ticket sort instantanément
    if(print) {
      try {
        if (useBLE && printer.connected) {
          printViaBLE(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter)
            .catch(() => printFallback(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter));
          flashMsg(`✅ Vente + impression BLE ${ticketFormat}${nbCopies>1?" x"+nbCopies+" copies":""}`);
        } else {
          printFallback(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter);
          flashMsg(`✅ Vente + impression navigateur${nbCopies>1?" x"+nbCopies+" copies":""}`);
        }
      } catch(e) {
        printFallback(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter);
        flashMsg("✅ Vente (fallback)");
      }
    } else {
      flashMsg("✅ Vente enregistrée");
    }

    // 3. Persistance en arrière-plan (fire-and-forget — n'impacte plus l'UX)
    setTimeout(() => {
      // Décrémenter le stock
      for (const item of saleItems) {
        const product = products.find(p => p.id === item.productId);
        if (product && product.stock !== null && product.stock !== undefined && product.stock !== -1) {
          updateStock(item.productId, -(item.qty || 1), "sortie", `Vente #${newSale.id}`);
        }
      }
      // Audit
      auditLog.add(session.shopId, "vente", `Vente ${fmtPrice(saleTotal)} · ${saleItems.length} article(s)`, currentCaissier?.name||"Admin");
      // Sauvegarde Firestore
      if(db && navigator.onLine) {
        db.collection("shops").doc(session.shopId).collection("sales").doc(newSale.id).set(newSale)
          .catch(() => offlineQueue.push(session.shopId, newSale));
      } else if (!navigator.onLine) {
        offlineQueue.push(session.shopId, newSale);
      }
      // Alerte stock bas
      const lowStockItems = saleItems.filter(item => {
        const prod = products.find(p=>p.id===item.productId);
        return prod && prod.stock !== undefined && prod.stock !== null && prod.stock !== -1 && (prod.stock - (item.qty||1)) <= 3;
      });
      if (lowStockItems.length > 0) {
        triggerNotification("⚠️ Stock bas", lowStockItems.map(it=>it.label).join(", ") + " — stock faible");
      }
    }, 0);
  };

  const addCredit = async (saleItems, saleTotal, clientName) => {
    for (const item of saleItems) {
      const product = products.find(p => p.id === item.productId);
      if (product && product.stock !== null && product.stock !== undefined && product.stock !== -1) {
        await updateStock(item.productId, -(item.qty||1), "sortie", `Crédit ${clientName}`);
      }
    }
    const newCredit = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), clientName, items: saleItems, total: saleTotal, paidAmount: 0, paid: false, date: new Date().toISOString().slice(0,10), timestamp: Date.now(), caissier: currentCaissier?.name || null, payments: [] };
    const updated = [...credits, newCredit];
    setCredits(updated);
    OfflineStore.set(session.shopId, "credits", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("credits").doc(newCredit.id).set(newCredit).catch(()=>{});
    flashMsg(`💳 Crédit enregistré pour ${clientName}`);
    setItems([]);
  };

  const payCredit = async (creditId, amount) => {
    const credit = credits.find(c=>c.id===creditId);
    if(!credit) return;
    const newPaid = (credit.paidAmount||0) + amount;
    const paid = newPaid >= credit.total;
    const payment = { amount, date: new Date().toISOString().slice(0,10), timestamp: Date.now() };
    const updated = credits.map(c=>c.id===creditId?{...c, paidAmount:newPaid, paid, payments:[...(c.payments||[]), payment]}:c);
    setCredits(updated);
    OfflineStore.set(session.shopId, "credits", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("credits").doc(creditId).update({paidAmount:newPaid, paid, payments:[...(credit.payments||[]), payment]}).catch(()=>{});
    flashMsg(paid ? `✅ Crédit ${credit.clientName} soldé !` : `💰 Paiement partiel enregistré`);
  };

  const addCommande = (data) => {
    const newCommande = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2),
      nom: data.nom, prenom: data.prenom, telephone: data.telephone,
      nbArticles: data.nbArticles, total: data.total,
      paidAmount: data.paidAmount || 0,
      paid: (data.paidAmount||0) >= data.total,
      date: new Date().toISOString().slice(0,10), timestamp: Date.now(),
      caissier: currentCaissier?.name || null,
      payments: (data.paidAmount||0) > 0 ? [{ amount: data.paidAmount, date: new Date().toISOString().slice(0,10), timestamp: Date.now() }] : []
    };
    const updated = [...commandes, newCommande];
    setCommandes(updated);
    OfflineStore.set(session.shopId, "commandes", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("commandes").doc(newCommande.id).set(newCommande).catch(()=>{});
    flashMsg(`📝 Commande enregistrée pour ${data.prenom} ${data.nom}`);
    return newCommande;
  };

  const payCommande = async (commandeId, amount) => {
    const commande = commandes.find(c=>c.id===commandeId);
    if(!commande) return;
    const newPaid = (commande.paidAmount||0) + amount;
    const paid = newPaid >= commande.total;
    const payment = { amount, date: new Date().toISOString().slice(0,10), timestamp: Date.now() };
    const updated = commandes.map(c=>c.id===commandeId?{...c, paidAmount:newPaid, paid, payments:[...(c.payments||[]), payment]}:c);
    setCommandes(updated);
    OfflineStore.set(session.shopId, "commandes", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("commandes").doc(commandeId).update({paidAmount:newPaid, paid, payments:[...(commande.payments||[]), payment]}).catch(()=>{});
    flashMsg(paid ? `✅ Commande de ${commande.prenom} ${commande.nom} soldée !` : `💰 Versement enregistré`);
  };

  const loginCaissier = (caissier) => {
    setCurrentCaissier(caissier);
    sessionStorage.setItem("pos_caissier_"+session.shopId, JSON.stringify(caissier));
    flashMsg(`👤 ${caissier.name} connecté`);
  };
  const logoutCaissier = () => {
    setCurrentCaissier(null);
    sessionStorage.removeItem("pos_caissier_"+session.shopId);
    flashMsg("👤 Caissier déconnecté");
  };
  const saveCaissier = async (caissier) => {
    const updated = caissiers.find(c=>c.id===caissier.id) ? caissiers.map(c=>c.id===caissier.id?caissier:c) : [...caissiers, caissier];
    setCaissiers(updated);
    OfflineStore.set(session.shopId, "caissiers", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("caissiers").doc(caissier.id).set(caissier).catch(()=>{});
    // Sync immediate si c est le caissier connecte
    if (currentCaissier && currentCaissier.id === caissier.id) {
      setCurrentCaissier(caissier);
      sessionStorage.setItem("pos_caissier_"+session.shopId, JSON.stringify(caissier));
    }
  };
  const deleteCaissier = async (id) => {
    const updated = caissiers.filter(c=>c.id!==id);
    setCaissiers(updated);
    OfflineStore.set(session.shopId, "caissiers", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("caissiers").doc(id).delete().catch(()=>{});
  };

  const cancelSale = (saleId, raison) => {
    const sale = sales.find(s => s.id === saleId);
    if (sale && !sale.cancelled) {
      for (const item of sale.items) {
        if (item.productId) updateStock(item.productId, item.qty || 1, "entree", `Annulation vente #${sale.invoiceNum}`);
      }
    }
    const updated = sales.map(s => s.id===saleId ? {...s, cancelled:true, cancelRaison:raison, cancelledAt:Date.now()} : s);
    setSales(updated);
    OfflineStore.set(session.shopId, "sales", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("sales").doc(saleId).update({cancelled:true, cancelRaison:raison, cancelledAt:Date.now()}).catch(()=>{});
    flashMsg(`🗑️ Vente annulée : ${raison}`);
  };

  const saveShopInfo = async () => {
    const updates = { shopName, shopPhone: shopPhone||null, shopAddress: shopAddress||null, shopSlogan: shopSlogan||null };
    if (db) await db.collection("shops").doc(session.shopId).update(updates).catch(()=>{});
    Object.assign(session, updates);
    flashMsg("✅ Informations mises à jour");
  };

  const verifyAdminPin = () => {
    if (pinModalTarget === "gerant") {
      if (!session.gerantPin) { setPinError(true); setPinShake(true); setTimeout(()=>{setPinShake(false);setPinInput("");setPinError(false);},700); return; }
      const expectedGerantPin = atob(session.gerantPin);
      if (pinInput === expectedGerantPin) { setPinModal(false); setPinInput(""); setGerantMode(true); setOwnerMode(false); }
      else { setPinError(true); setPinShake(true); setTimeout(()=>{setPinShake(false);setPinInput("");setPinError(false);},700); }
      return;
    }
    const expectedPin = atob(session.adminPin || btoa("0000"));
    if (pinInput === expectedPin) {
      setPinModal(false); setPinInput(""); setOwnerMode(true); setGerantMode(false);
    } else {
      setPinError(true); setPinShake(true);
      setTimeout(() => { setPinShake(false); setPinInput(""); setPinError(false); }, 700);
    }
  };

  const enterOwnerMode = () => { setPinModalTarget("admin"); setPinModal(true); setPinInput(""); setPinError(false); };
  const exitOwnerMode = () => { setOwnerMode(false); };
  const enterGerantMode = () => {
    if (!session.gerantPin) { flashMsg("⚠️ Aucun PIN gérant défini. Configurez-le dans Admin → Paramètres."); return; }
    setPinModalTarget("gerant"); setPinModal(true); setPinInput(""); setPinError(false);
  };
  const exitGerantMode = () => { setGerantMode(false); };

  const updateAdminPin = async (newPin) => {
    const newEncoded = btoa(newPin);
    await db.collection("shops").doc(session.shopId).update({ adminPin: newEncoded });
    session.adminPin = newEncoded;
    flashMsg("PIN administrateur modifié");
  };

  const updateGerantPin = async (newPin) => {
    const newEncoded = btoa(newPin);
    if (db) await db.collection("shops").doc(session.shopId).update({ gerantPin: newEncoded }).catch(()=>{});
    session.gerantPin = newEncoded;
    flashMsg("✅ PIN gérant défini");
  };

  return (
    <div style={{height:"100dvh", background:T.bg, display:"flex", flexDirection:"column"}}>
      {/* BANDE D'ABONNEMENT DÉFILANTE */}
      <SubscriptionBanner T={T} shopId={session.shopId} />
      {/* INDICATEUR HORS-LIGNE / FILE D'ATTENTE SYNC */}
      <OfflineSyncBanner T={T} shopId={session.shopId} />
      {/* BANNIÈRE SESSION OFFLINE RESTAURÉE */}
      {(sessionRestored || reAuthPending) && (
        <div style={{
          background: reAuthPending ? "#0a1a2a" : "#1a0f00",
          borderBottom: `1px solid ${reAuthPending ? "#1e3a5a" : "#3a2000"}`,
          padding: "7px 14px",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          fontSize: 11, flexShrink: 0, gap: 8
        }}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            {reAuthPending
              ? <><span style={{fontSize:13}}>🔄</span><span style={{color:"#60a5fa"}}>Reconnexion en cours… données locales actives</span></>
              : <><span style={{fontSize:13}}>📴</span><span style={{color:"#fb923c"}}>Mode hors ligne — session restaurée localement · en attente du réseau</span></>
            }
          </div>
          {!reAuthPending && (
            <div style={{display:"flex", gap:6}}>
              <span style={{background:"#fb923c22", color:"#fb923c", borderRadius:8, padding:"2px 8px", fontSize:10, fontWeight:700}}>
                {navigator.onLine ? "🟡 Sync…" : "🔴 Offline"}
              </span>
            </div>

            <div style={{width:14, height:14, border:"2px solid #60a5fa44", borderTopColor:"#60a5fa", borderRadius:"50%", animation:"spin .8s linear infinite", flexShrink:0}} />

      {pinModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:2000}}>
          <div style={{background:T.surface, borderRadius:32, padding:24, width:"90%", maxWidth:360, textAlign:"center"}}>
            <div style={{fontSize:48, marginBottom:12}}>{pinModalTarget==="gerant"?"📋":"👑"}</div>
            <div style={{fontSize:18, fontWeight:800, marginBottom:8}}>{pinModalTarget==="gerant"?"Accès Gérant":"Accès Administrateur"}</div>
            <div style={{fontSize:12, color:T.textMute, marginBottom:20}}>Entrez votre code PIN à 4 chiffres</div>
            <div style={{display:"flex", gap:12, justifyContent:"center", marginBottom:20, animation: pinShake ? "shake 0.35s ease" : "none"}}>
              {Array(4).fill(0).map((_,i)=><div key={i} style={{width:16,height:16,borderRadius:"50%", background: i < pinInput.length ? (pinError ? T.red : T.accent) : T.border}} />)}

            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8}}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
                <button key={i} onClick={()=>{ if(d==="⌫") setPinInput(p=>p.slice(0,-1)); else if(d!=="") setPinInput(p=>p.length<4 ? p+d : p); }} style={{background:d===""?"transparent":T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:55, fontSize:22, color:d==="⌫"?T.red:T.text}}>{d}</button>

            </div>
            <button onClick={verifyAdminPin} style={{marginTop:16, background:T.accent, border:"none", borderRadius:12, padding:12, width:"100%", fontWeight:700, color:T.bg}}>Valider</button>
            <button onClick={()=>{setPinModal(false); setPinInput("");}} style={{marginTop:8, background:"transparent", border:"none", color:T.textMute}}>Annuler</button>

        </div>

      <div className="pos-header" style={{background:T.header, padding:"8px 12px", borderBottom:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0, gap:6}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:10, color:T.textMute, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{shopName}</div>

        </div>
        <div style={{display:"flex", gap:6, alignItems:"center", flexShrink:0}}>
          <div className="hdr-themes theme-toggle" style={{background:T.surface2}}>
            <button className={`theme-btn${themeName==="auto"?"  active":""}`} onClick={()=>setThemeName("auto")} title="Automatique (système)" style={{background:themeName==="auto"?T.accent:"transparent", color:themeName==="auto"?T.bg:T.textSub}}>⚙️</button>
            <button className={`theme-btn${themeName==="light"?" active":""}`} onClick={()=>setThemeName("light")} title="Mode clair"           style={{background:themeName==="light"?T.accent:"transparent", color:themeName==="light"?T.bg:T.textSub}}>☀️</button>
            <button className={`theme-btn${themeName==="dark"?"  active":""}`} onClick={()=>setThemeName("dark")}  title="Mode sombre"           style={{background:themeName==="dark"?T.accent:"transparent",  color:themeName==="dark"?T.bg:T.textSub}}>🌙</button>
            <button className={`theme-btn${themeName==="neon"?"  active":""}`} onClick={()=>setThemeName("neon")}  title="Néon"                  style={{background:themeName==="neon"?T.accent:"transparent",  color:themeName==="neon"?T.bg:T.textSub}}>⚡</button>
          </div>
          <button className="hdr-btn" onClick={()=>{ setMode("CAISSE"); setOwnerMode(false); setGerantMode(false); }} style={{background:mode==="CAISSE"&&!ownerMode&&!gerantMode?T.accent:"transparent", border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:mode==="CAISSE"&&!ownerMode&&!gerantMode?T.bg:T.textSub}}>🛒<span className="hdr-text-label"> Caisse</span></button>
          {!gerantMode ? (
            <button className="hdr-btn" onClick={enterGerantMode} style={{background:T.btnGreen.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.green, opacity:session.gerantPin?1:0.5}}>📋<span className="hdr-text-label"> Gérant</span></button>
          ) : (
            <button className="hdr-btn" onClick={exitGerantMode} style={{background:T.btnRed.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.red}}>✕<span className="hdr-text-label"> Gérant</span></button>
          )}
          {!ownerMode ? (
            <button className="hdr-btn" onClick={enterOwnerMode} style={{background:T.btnBlue.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.blue}}>👑<span className="hdr-text-label"> Admin</span></button>
          ) : (
            <button className="hdr-btn" onClick={exitOwnerMode} style={{background:T.btnRed.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.red}}>🔒<span className="hdr-text-label"> Quitter</span></button>
          )}
          <button className="hdr-btn" onClick={logout} style={{background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 8px", fontSize:11}}>↩<span className="hdr-text-label"> Déco</span></button>
          <NotifButton T={T} />
        </div>
      </div>
      
      {mode === "CAISSE" && (
        <div className="desktop-grid" style={{flex:1, overflow:"hidden", position:"relative"}}>
          {/* caissier bar */}
          {caissiers.length > 0 && (
            <div style={{display:"flex", alignItems:"center", gap:8, padding:"4px 12px", background:T.surface2, borderBottom:`1px solid ${T.border}`, flexShrink:0}}>
              <span style={{fontSize:11, color:T.textMute}}>👤</span>
              {currentCaissier
                ? <>
                    <span style={{fontSize:11, fontWeight:600}}>{currentCaissier.name}</span>
                    {currentCaissier.role && <span style={{fontSize:9, background:ROLES[currentCaissier.role]?.color+"33"||"transparent", color:ROLES[currentCaissier.role]?.color||"#aaa", borderRadius:6, padding:"1px 6px", fontWeight:700}}>{ROLES[currentCaissier.role]?.label||currentCaissier.role}</span>}
                    <button onClick={()=>setCaissDash(true)} style={{fontSize:10, background:T.btnBlue.bg, border:`1px solid ${T.blue}44`, borderRadius:6, padding:"2px 8px", color:T.blue}}>📊 Mes stats</button>
                    <button onClick={logoutCaissier} style={{fontSize:10, background:"transparent", border:"none", color:T.red}}>Quitter</button>
                  </>
                : <span style={{fontSize:11, color:T.orange}}>Aucun caissier — cliquez Admin → Caissiers</span>
              }
            </div>
          )}
          {caissDash && currentCaissier && (
            <CaissierDashboard T={T} caissier={currentCaissier} sales={sales} onClose={()=>setCaissDash(false)} />
          )}
          <div className="desktop-main" style={{flex:1, overflowY:"auto", padding:12}}>
            <BLEStatus T={T} />
            <div style={{display:"flex", gap:6, marginBottom:8, flexWrap:"wrap"}}>
              <button onClick={()=>{ setUseBLE(true); const f="80mm"; setTicketFormat(f); localStorage.setItem("pos_ticket_fmt",f); }} style={{flex:"1 0 auto", background:useBLE&&ticketFormat==="80mm"?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:useBLE&&ticketFormat==="80mm"?T.bg:T.text}}>🖨️ BLE 80mm</button>
              <button onClick={()=>{ setUseBLE(true); const f="57mm"; setTicketFormat(f); localStorage.setItem("pos_ticket_fmt",f); }} style={{flex:"1 0 auto", background:useBLE&&ticketFormat==="57mm"?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:useBLE&&ticketFormat==="57mm"?T.bg:T.text}}>🖨️ BLE 57mm</button>
              <button onClick={()=>setUseBLE(false)} style={{flex:"1 0 auto", background:!useBLE?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:!useBLE?T.bg:T.text}}>🖥️ Navigateur</button>
            </div>
            <CaisseContent T={T} products={products} addSale={addSale} items={items} setItems={setItems} total={total} flashMsg={flashMsg} sales={sales} cancelSale={cancelSale} shopId={session.shopId} currentCaissier={currentCaissier} loginCaissier={loginCaissier} caissiers={caissiers} shopName={shopName} shopPhone={shopPhone} shopAddress={shopAddress} shopSlogan={shopSlogan} shopLogo={shopLogo} useBLE={useBLE} ticketFormat={ticketFormat} nbCopies={nbCopies} ticketFooter={ticketFooter} />
            {/* Spacer so FAB doesn't cover last product card */}
            <div style={{height:80}} />
          </div>

          {/* ── Desktop sidebar (hidden on mobile/tablet via CSS) ── */}
          <div className="desktop-sidebar" style={{background:T.surface, borderLeft:`1px solid ${T.border}`}}>
            <PanierContent T={T} items={items} setItems={setItems} total={total} addSale={addSale} addCredit={addCredit} flashMsg={flashMsg} useBLE={useBLE} ticketFormat={ticketFormat} nbCopies={nbCopies} />
          </div>

          {/* ── FAB panier mobile/tablette ── */}
          <button
            className="mobile-cart-fab"
            onClick={()=>setMobileCartOpen(true)}
            style={{
              position:"fixed", bottom:24, right:20, zIndex:500,
              background:items.length>0 ? T.accent : T.surface2,
              border:`2px solid ${items.length>0 ? T.accent : T.border}`,
              borderRadius:32, minWidth:64, height:64, padding:"0 16px",
              flexDirection:"column", alignItems:"center", justifyContent:"center",
              boxShadow:"0 6px 24px rgba(0,0,0,.45)", gap:2
            }}
          >
            <span style={{fontSize:26}}>🛒</span>
            {items.length > 0 && (
              <span style={{fontSize:9, fontWeight:800, color:items.length>0?T.bg:T.textSub, lineHeight:1}}>
                {items.reduce((s,i)=>s+(i.qty||1),0)} · {fmtPrice(total)}
              </span>
            )}
          </button>

          {/* ── Bottom-sheet panier mobile/tablette ── */}
          {mobileCartOpen && (
            <div
              className="mobile-cart-overlay"
              onClick={e=>{if(e.target===e.currentTarget) setMobileCartOpen(false);}}
              style={{
                position:"fixed", inset:0, zIndex:600,
                background:"rgba(0,0,0,.55)", display:"flex",
                flexDirection:"column", justifyContent:"flex-end"
              }}
            >
              <div style={{
                background:T.surface, borderRadius:"20px 20px 0 0",
                maxHeight:"82dvh", display:"flex", flexDirection:"column",
                overflow:"hidden"
              }}>
                {/* Drag handle + close */}
                <div style={{padding:"10px 16px 6px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${T.border}`, flexShrink:0}}>
                  <div style={{display:"flex", alignItems:"center", gap:8}}>
                    <div style={{width:36, height:4, background:T.border, borderRadius:2}} />
                    <span style={{fontWeight:700, fontSize:15}}>🛒 Panier</span>
                  </div>
                  <button onClick={()=>setMobileCartOpen(false)} style={{background:T.surface2, border:"none", borderRadius:20, width:32, height:32, fontSize:16, color:T.text}}>✕</button>
                </div>
                <div style={{flex:1, overflow:"hidden", display:"flex", flexDirection:"column"}}>
                  <PanierContent
                    T={T} items={items} setItems={setItems} total={total}
                    addSale={(itms, tot, print) => { addSale(itms, tot, print); setMobileCartOpen(false); }}
                    addCredit={(itms,tot,name) => { addCredit(itms,tot,name); setMobileCartOpen(false); }}
                    flashMsg={flashMsg} useBLE={useBLE} ticketFormat={ticketFormat} nbCopies={nbCopies}
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      )}
      
      {ownerMode && (
        <OwnerContent T={T} shopName={shopName} shopPhone={shopPhone} shopAddress={shopAddress} shopSlogan={shopSlogan} setShopName={setShopName} setShopPhone={setShopPhone} setShopAddress={setShopAddress} setShopSlogan={setShopSlogan} saveShopInfo={saveShopInfo} whatsapp={session.whatsapp} products={products} setProducts={setProducts} sales={sales} flashMsg={flashMsg} shopId={session.shopId} stockMovements={stockMovements} updateStock={updateStock} updateAdminPin={updateAdminPin} updateGerantPin={updateGerantPin} session={session} credits={credits} payCredit={payCredit} caissiers={caissiers} saveCaissier={saveCaissier} deleteCaissier={deleteCaissier} loginCaissier={loginCaissier} currentCaissier={currentCaissier} shopLogo={shopLogo} setShopLogo={setShopLogo} addSale={addSale} ticketFormat={ticketFormat} setTicketFormat={setTicketFormat} nbCopies={nbCopies} setNbCopies={setNbCopies} ticketFooter={ticketFooter} setTicketFooter={setTicketFooter} />
      )}
      {gerantMode && !ownerMode && (
        <GerantContent T={T} products={products} sales={sales} flashMsg={flashMsg} shopId={session.shopId} stockMovements={stockMovements} updateStock={updateStock} shopName={shopName} commandes={commandes} addCommande={addCommande} payCommande={payCommande} shopPhone={shopPhone} shopAddress={shopAddress} shopSlogan={shopSlogan} shopLogo={shopLogo} useBLE={useBLE} ticketFormat={ticketFormat} nbCopies={nbCopies} ticketFooter={ticketFooter} />
      )}
    </div>
  );
}

function CaissePinLock({ T, caissiers, loginCaissier }) {
  const [pinInput, setPinInput] = React.useState("");
  const [pinError, setPinError] = React.useState(false);
  const [pinShake, setPinShake] = React.useState(false);
  const handleDigit = (digit) => {
    const next = (pinInput + digit).slice(0, 4);
    setPinInput(next);
    if (next.length === 4) {
      let found = null;
      try { found = caissiers.find(c => atob(c.pin || btoa("__x__")) === next); } catch(e) {}
      if (found) { loginCaissier(found); setPinInput(""); setPinError(false); }
      else { setPinError(true); setPinShake(true); setTimeout(()=>{setPinShake(false);setPinInput("");setPinError(false);},700); }
    }
  };
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",minHeight:400,padding:20}}>
      <div style={{fontSize:56,marginBottom:8}}>🔐</div>
      <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>Accès Caisse</div>
      <div style={{fontSize:12,color:T.textMute,marginBottom:28,textAlign:"center"}}>Entrez votre PIN pour commencer</div>
      <div style={{display:"flex",gap:14,marginBottom:24}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{width:14,height:14,borderRadius:"50%",
            background:i<pinInput.length?(pinError?T.red:T.accent):T.surface2,
            border:`2px solid ${i<pinInput.length?(pinError?T.red:T.accent):T.border}`,
            transition:"all .15s",transform:pinShake&&i<pinInput.length?"scale(1.3)":"scale(1)"}} />
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,width:"100%",maxWidth:280}}>
        {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
          <button key={i} onClick={()=>{if(d==="⌫")setPinInput(p=>p.slice(0,-1));else if(d!=="")handleDigit(String(d));}}
            style={{background:d===""?T.surface2:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 0",fontSize:d==="⌫"?18:20,fontWeight:700,color:T.text,opacity:d===""?0:1}}>
            {d}
          </button>
        ))}
      </div>
      {pinError&&<div style={{marginTop:16,fontSize:12,color:T.red,fontWeight:700}}>❌ PIN incorrect</div>}
      <div style={{marginTop:24,fontSize:10,color:T.textMute,textAlign:"center"}}>{caissiers.length} caissier(s) enregistré(s)</div>
    </div>
  );
}

function CaisseContent({ T, products, addSale, items, setItems, total, flashMsg, sales, cancelSale, shopId, currentCaissier, loginCaissier, caissiers, shopName, shopPhone, shopAddress, shopSlogan, shopLogo, useBLE, ticketFormat, nbCopies, ticketFooter }) {
  const [view, setView] = useState("catalog");
  // Source de verite des flags : caissiers[] (live Firestore) > currentCaissier (sessionStorage stale)
  const activeCaissier = currentCaissier
    ? (caissiers.find(c => c.id === currentCaissier.id) || currentCaissier)
    : null;
  const canVenteRapide = !activeCaissier?.disableVenteRapide;
  const canManuel = !activeCaissier?.disableManuel;
  // Rediriger si la vue active est bloquée pour ce caissier
  useEffect(() => {
    if (view === "rapide" && !canVenteRapide) setView("catalog");
    if (view === "manual" && !canManuel) setView("catalog");
  }, [canVenteRapide, canManuel, view]);
  const [search, setSearch] = useState("");
  const [activeCat, setActiveCat] = useState("Tous");
  const [manualLabel, setManualLabel] = useState("");
  const [manualAmount, setManualAmount] = useState("");
  const [cancelModal, setCancelModal] = useState(null);
  const [cancelRaison, setCancelRaison] = useState("");
  const [scannerActive, setScannerActive] = useState(false);
  const [showFavOnly, setShowFavOnly] = useState(false);
  const [gridView, setGridView] = useState(true);
  const [sortMode, setSortMode] = useState("default");
  const [filterCaissier, setFilterCaissier] = useState("all");
  const videoRef = React.useRef(null);
  const scannerRef = React.useRef(null);
  const [favIds, toggleFav] = useFavorites(shopId || "default");
  
  const allProds = (products || []).filter(p => p && p.active !== false && p.name);
  const categories = ["Tous", ...Array.from(new Set(allProds.map(p=>p.category).filter(Boolean)))];
  const favProds = allProds.filter(p => favIds.includes(p.id));
  const filtered = useMemo(() => {
    let list = (showFavOnly ? favProds : allProds).filter(p => {
      const matchCat = activeCat === "Tous" || p.category === activeCat;
      const matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
      return matchCat && matchSearch;
    });
    if (sortMode === "prix_asc") list = [...list].sort((a,b) => a.price - b.price);
    else if (sortMode === "prix_desc") list = [...list].sort((a,b) => b.price - a.price);
    else if (sortMode === "nom") list = [...list].sort((a,b) => a.name.localeCompare(b.name));
    else if (sortMode === "stock") list = [...list].sort((a,b) => (b.stock||0) - (a.stock||0));
    return list;
  }, [allProds, favProds, showFavOnly, activeCat, search, sortMode]);
  const todaySalesAll = (sales || []).filter(s => s.date === new Date().toISOString().slice(0,10));
  const todaySales = todaySalesAll.filter(s => !s.cancelled);
  
  const addProduct = (p) => {
    if (p.stock !== undefined && p.stock !== null && p.stock !== -1 && p.stock <= 0) { flashMsg(`⚠️ ${p.name} en rupture`); return; }
    const exist = items.find(i=>i.productId===p.id);
    if(exist) setItems(items.map(i=>i.productId===p.id?{...i, qty:(i.qty||1)+1}:i));
    else setItems([...items, {id:Date.now()+Math.random(), productId:p.id, label:p.name, amount:p.price, qty:1}]);
    flashMsg(`➕ ${p.name}`);
  };
  
  const addManual = () => { if(!manualLabel.trim() || !manualAmount) { flashMsg("Nom et montant requis"); return; } setItems([...items, {id:Date.now()+Math.random(), label:manualLabel.trim(), amount:parseInt(manualAmount), qty:1}]); setManualLabel(""); setManualAmount(""); };

  const startScanner = async () => {
    if (!('BarcodeDetector' in window)) { flashMsg("⚠️ Scanner non supporté sur ce navigateur"); return; }
    setScannerActive(true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
      const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","code_128","qr_code","upc_a","upc_e"] });
      scannerRef.current = setInterval(async () => {
        if (!videoRef.current) return;
        try {
          const barcodes = await detector.detect(videoRef.current);
          if (barcodes.length > 0) {
            const code = barcodes[0].rawValue;
            stopScanner();
            const found = products.find(p => p.barcode === code);
            if (found) { addProduct(found); flashMsg(`📷 ${found.name} ajouté`); }
            else { flashMsg(`📷 Code: ${code} — produit non trouvé`); }
          }
        } catch(e){}
      }, 500);
    } catch(e) { setScannerActive(false); flashMsg("❌ Accès caméra refusé"); }
  };
  
  const stopScanner = () => {
    clearInterval(scannerRef.current);
    if (videoRef.current?.srcObject) { videoRef.current.srcObject.getTracks().forEach(t=>t.stop()); videoRef.current.srcObject = null; }
    setScannerActive(false);
  };

  React.useEffect(() => () => stopScanner(), []);

  const reprintSale = (s) => {
    const saleItems = (s.items||[]).map(i=>({label:i.label,amount:i.amount,qty:i.qty||1}));
    try {
      if (useBLE && printer && printer.connected) {
        printViaBLE(shopName, shopPhone, saleItems, s.total, s.invoiceNum, ticketFormat, shopLogo, nbCopies||1, ticketFooter||"", shopAddress, shopSlogan)
          .catch(()=>printFallback(shopName, shopPhone, saleItems, s.total, s.invoiceNum, ticketFormat, shopLogo, nbCopies||1, ticketFooter||"", shopAddress, shopSlogan));
      } else {
        printFallback(shopName, shopPhone, saleItems, s.total, s.invoiceNum, ticketFormat, shopLogo, nbCopies||1, ticketFooter||"", shopAddress, shopSlogan);
      }
      flashMsg("🖨️ Réimpression envoyée");
    } catch(e) { printFallback(shopName, shopPhone, saleItems, s.total, s.invoiceNum, ticketFormat, shopLogo, 1, "", shopAddress, shopSlogan); }
  };

  if (caissiers && caissiers.length > 0 && !currentCaissier) {
    return <CaissePinLock T={T} caissiers={caissiers} loginCaissier={loginCaissier} />;
  }

  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%", overflow:"hidden"}}>
      <div style={{display:"flex", gap:6, marginBottom:12, overflowX:"auto", paddingBottom:2, flexShrink:0}}>
        <button onClick={()=>setView("catalog")} style={{flex:"1 0 auto", background:view==="catalog"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="catalog"?T.bg:T.text}}>📦 Catalogue</button>
        {canManuel ? (
          <button onClick={()=>setView("manual")} style={{flex:"1 0 auto", background:view==="manual"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="manual"?T.bg:T.text}}>✏️ Manuel</button>
        ) : (
          <button disabled title="Module désactivé par l'admin" style={{flex:"1 0 auto", background:T.surface2, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:T.textMute, opacity:0.45, cursor:"not-allowed"}}>✏️ Manuel 🔒</button>
        )}
        {canVenteRapide ? (
          <button onClick={()=>setView("rapide")} style={{flex:"1 0 auto", background:view==="rapide"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="rapide"?T.bg:T.text}}>⚡ Rapide</button>
        ) : (
          <button disabled title="Module désactivé par l'admin" style={{flex:"1 0 auto", background:T.surface2, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:T.textMute, opacity:0.45, cursor:"not-allowed"}}>⚡ Rapide 🔒</button>
        )}
        <button onClick={()=>setView("annulations")} style={{flex:"1 0 auto", background:view==="annulations"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="annulations"?T.bg:T.text}}>🧾 Historique</button>
      </div>
      
      {view === "catalog" && (
        <>
          <div style={{display:"flex", gap:6, marginBottom:6}}>
            <input placeholder="🔍 Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1, background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, color:T.text}} />
            <button onClick={()=>setShowFavOnly(v=>!v)} style={{background:showFavOnly?T.accent:T.surface, border:`1px solid ${showFavOnly?T.accent:T.border}`, borderRadius:12, padding:"0 12px", fontSize:16}} title="Favoris">⭐</button>
            <button onClick={()=>setGridView(v=>!v)} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:"0 12px", fontSize:16}} title="Changer vue">{gridView?"≡":"⊞"}</button>
            <button onClick={scannerActive ? stopScanner : startScanner} style={{background:scannerActive?T.red:T.surface, border:"none", borderRadius:12, padding:"0 12px", fontSize:16}} title="Scanner">{scannerActive?"⏹️":"📷"}</button>
          </div>
          <div style={{display:"flex", gap:4, marginBottom:6, overflowX:"auto"}}>
            {[["default","✦ Défaut"],["nom","A→Z"],["prix_asc","Prix ↑"],["prix_desc","Prix ↓"],["stock","Stock"]].map(([k,l])=>(
              <button key={k} onClick={()=>setSortMode(k)} style={{flex:"0 0 auto", background:sortMode===k?T.accent:T.surface2, border:"none", borderRadius:8, padding:"4px 10px", fontSize:10, fontWeight:600, color:sortMode===k?T.bg:T.textMute}}>{l}</button>
            ))}
            <span style={{fontSize:10, color:T.textMute, marginLeft:"auto", display:"flex", alignItems:"center"}}>{filtered.length} article(s)</span>
          </div>
          {scannerActive && (
            <div style={{marginBottom:10, borderRadius:12, overflow:"hidden", position:"relative"}}>
              <video ref={videoRef} style={{width:"100%", maxHeight:160, objectFit:"cover", display:"block"}} />
              <div style={{position:"absolute", inset:0, border:"2px solid "+T.accent, borderRadius:12, pointerEvents:"none"}} />
              <div style={{position:"absolute", bottom:6, left:0, right:0, textAlign:"center", fontSize:10, color:"white", textShadow:"0 1px 3px #000"}}>Pointez vers un code-barres</div>
            </div>
          )}
          {/* Strip favoris */}
          {favProds.length > 0 && !showFavOnly && (
            <div style={{marginBottom:8}}>
              <div style={{fontSize:9, color:T.textMute, marginBottom:4, letterSpacing:".5px"}}>⭐ FAVORIS RAPIDES</div>
              <div style={{display:"flex", gap:6, overflowX:"auto", paddingBottom:4}}>
                {favProds.map(p=>(
                  <button key={p.id} onClick={()=>addProduct(p)} style={{flex:"0 0 auto", background:T.accent+"22", border:`1px solid ${T.accent}44`, borderRadius:10, padding:"6px 10px", fontSize:11, fontWeight:700, whiteSpace:"nowrap", color:T.text}}>
                    {p.photo && <img src={p.photo} style={{width:18, height:18, borderRadius:4, objectFit:"cover", marginRight:4, verticalAlign:"middle"}} />}
                    {p.name} · {fmtPrice(p.price)}
                  </button>
                ))}
              </div>
            </div>
          )}
          {categories.length > 1 && !showFavOnly && (
            <div style={{display:"flex", gap:6, overflowX:"auto", paddingBottom:6, marginBottom:8}}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>setActiveCat(cat)} style={{flex:"0 0 auto", background:activeCat===cat?T.accent:T.surface2, borderRadius:20, padding:"4px 12px", fontSize:11, fontWeight:600, color:activeCat===cat?T.bg:T.text, whiteSpace:"nowrap"}}>{cat}</button>
              ))}
            </div>
          )}
          {showFavOnly && <div style={{fontSize:10, color:T.accent, marginBottom:8, fontWeight:700}}>⭐ Affichage : favoris uniquement ({favProds.length})</div>}
          {gridView ? (
            <div style={{display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8, overflowY:"auto", maxHeight:"calc(100vh - 300px)", paddingBottom:8}}>
              {filtered.map(p => {
                const rupture = p.stock !== undefined && p.stock !== null && p.stock !== -1 && p.stock === 0;
                return (
                  <button key={p.id} onClick={()=>!rupture&&addProduct(p)} style={{background:T.surface, border:`1px solid ${rupture?T.red+"66":favIds.includes(p.id)?T.accent+"88":T.border}`, borderRadius:12, padding:0, textAlign:"left", minWidth:0, overflow:"hidden", position:"relative", opacity:rupture?0.6:1}}>
                    {p.photo && <img src={p.photo} style={{width:"100%", height:72, objectFit:"cover", display:"block"}} />}
                    {rupture && <div style={{position:"absolute", top:0, left:0, right:0, background:"rgba(220,50,50,0.85)", fontSize:9, fontWeight:800, color:"#fff", textAlign:"center", padding:"2px 0"}}>RUPTURE</div>}
                    <div style={{padding:"7px 10px 8px"}}>
                      <div style={{fontWeight:600, fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
                      <div style={{fontSize:12, color:rupture?T.red:T.accent, fontWeight:700}}>{fmtPrice(p.price)}</div>
                      {p.category && <div style={{fontSize:9, color:T.textMute, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.category}</div>}
                      {p.stock !== undefined && p.stock !== null && p.stock !== -1 && <div style={{fontSize:9, color:p.stock<=3?T.red:p.stock<=8?T.orange:T.textMute}}>Stock: {p.stock}</div>}
                    </div>
                    <button onClick={e=>{e.stopPropagation(); toggleFav(p.id);}} style={{position:"absolute", top:p.photo?76:4, right:4, background:"rgba(0,0,0,0.4)", border:"none", borderRadius:12, width:24, height:24, fontSize:12, display:"flex", alignItems:"center", justifyContent:"center", color:favIds.includes(p.id)?"#FFCC00":"#fff"}}>
                      {favIds.includes(p.id)?"⭐":"☆"}
                    </button>
                  </button>
                );
              })}
            </div>
          ) : (
            <div style={{overflowY:"auto", maxHeight:"calc(100vh - 300px)", paddingBottom:8}}>
              {filtered.map(p => {
                const rupture = p.stock !== undefined && p.stock !== null && p.stock !== -1 && p.stock === 0;
                return (
                  <button key={p.id} onClick={()=>!rupture&&addProduct(p)} style={{width:"100%", background:T.surface, border:`1px solid ${rupture?T.red+"66":favIds.includes(p.id)?T.accent+"44":T.border}`, borderRadius:12, padding:"10px 12px", marginBottom:6, textAlign:"left", display:"flex", alignItems:"center", gap:10, opacity:rupture?0.65:1}}>
                    {p.photo && <img src={p.photo} style={{width:44, height:44, borderRadius:8, objectFit:"cover", flexShrink:0}} />}
                    {!p.photo && <div style={{width:44, height:44, borderRadius:8, background:T.surface2, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0}}>🛒</div>}
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontWeight:700, fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
                      <div style={{fontSize:11, color:rupture?T.red:T.accent, fontWeight:700}}>{fmtPrice(p.price)}{rupture?" — RUPTURE":""}</div>
                      {p.category && <div style={{fontSize:9, color:T.textMute}}>{p.category}</div>}
                    </div>
                    <div style={{flexShrink:0, textAlign:"right"}}>
                      {p.stock !== undefined && p.stock !== null && p.stock !== -1 && <div style={{fontSize:10, fontWeight:700, color:p.stock<=3?T.red:p.stock<=8?T.orange:T.textMute}}>Stock {p.stock}</div>}
                      <button onClick={e=>{e.stopPropagation(); toggleFav(p.id);}} style={{background:"transparent", border:"none", fontSize:14, color:favIds.includes(p.id)?"#FFCC00":T.textMute}}>{favIds.includes(p.id)?"⭐":"☆"}</button>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </>
      )}
      
      {view === "manual" && (
        <div style={{background:T.surface, borderRadius:16, padding:16}}>
          <input placeholder="Nom article" value={manualLabel} onChange={e=>setManualLabel(e.target.value)} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, marginBottom:8, color:T.text}} />
          <input placeholder="Montant (F)" value={manualAmount} onChange={e=>setManualAmount(e.target.value.replace(/\D/g,""))} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, marginBottom:12, color:T.text}} />
          <button onClick={addManual} style={{background:T.accent, border:"none", borderRadius:12, padding:12, fontWeight:700, width:"100%", color:T.bg}}>➕ Ajouter</button>
        </div>
      )}
      
      {view === "rapide" && <VenteRapide T={T} addSale={addSale} flashMsg={flashMsg} />}
      
      {view === "annulations" && (() => {
        const ventesActives = todaySalesAll.filter(s => !s.cancelled);
        const ventesAnnulees = todaySalesAll.filter(s => s.cancelled);
        const SaleCard = ({ s, annulable }) => {
          const heure = s.timestamp ? new Date(s.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "--:--";
          const nbArt = (s.items||[]).reduce((a,i)=>a+(i.qty||1),0);
          return (
            <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:10, borderLeft:`4px solid ${annulable?T.accent:T.red}`, opacity:annulable?1:0.6}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8}}>
                <div>
                  <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
                    <span style={{fontSize:14, fontWeight:700}}>{heure}</span>
                    <span style={{fontSize:9, background:annulable?"#00ff0022":"#ff000022", color:annulable?T.green:T.red, borderRadius:6, padding:"2px 7px", fontWeight:700}}>
                      {annulable?"✅ Validée":"🗑️ Annulée"}
                    </span>
                  </div>
                  {s.caissier && <div style={{fontSize:10, color:T.textMute, marginTop:2}}>👤 {s.caissier}</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:18, fontWeight:800, color:annulable?T.accent:T.textMute}}>{fmtPrice(s.total)}</div>
                  <div style={{fontSize:9, color:T.textMute}}>{nbArt} art.</div>
                </div>
              </div>
              {(s.items||[]).length>0 && (
                <div style={{background:T.surface2, borderRadius:10, padding:"6px 10px", marginBottom:annulable?10:6}}>
                  {(s.items||[]).slice(0,3).map((it,i)=>(
                    <div key={i} style={{display:"flex", justifyContent:"space-between", fontSize:11, padding:"3px 0", borderBottom:i<Math.min((s.items||[]).length,3)-1?`1px solid ${T.border}`:"none"}}>
                      <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:"60%"}}>{it.label}</span>
                      <span style={{color:T.textMute, flexShrink:0}}>×{it.qty||1} <strong style={{color:T.text}}>{fmtPrice((it.amount||0)*(it.qty||1))}</strong></span>
                    </div>
                  ))}
                  {(s.items||[]).length>3 && <div style={{fontSize:10, color:T.textMute, paddingTop:3}}>+{(s.items||[]).length-3} autre(s)…</div>}
                </div>
              )}
              {!annulable && s.cancelRaison && (
                <div style={{fontSize:10, color:T.textMute, fontStyle:"italic"}}>Motif : {s.cancelRaison}</div>
              )}
              <button onClick={()=>reprintSale(s)}
                style={{width:"100%", background:T.btnBlue?T.btnBlue.bg:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:"8px", color:T.blue||T.accent, fontWeight:700, fontSize:12, marginTop:6}}>
                🖨️ Réimprimer ce ticket
              </button>
              {annulable && (
                <button onClick={()=>{setCancelModal(s); setCancelRaison("");}}
                  style={{width:"100%", background:"#ff000015", border:`1px solid ${T.red}44`, borderRadius:10, padding:"9px", color:T.red, fontWeight:700, fontSize:12, marginTop:6}}>
                  🗑️ Annuler cette vente
                </button>
              )}
            </div>
          );
        };
        const totalActif = ventesActives.reduce((a,s)=>a+(s.total||0),0);
        const totalAnnule = ventesAnnulees.reduce((a,s)=>a+(s.total||0),0);
        const txAnnul = (ventesActives.length+ventesAnnulees.length)>0 ? Math.round((ventesAnnulees.length/(ventesActives.length+ventesAnnulees.length))*100) : 0;
        const allCaissiers = [...new Set(todaySalesAll.map(s=>s.caissier).filter(Boolean))];
        const ventesFiltered = ventesActives.filter(s => filterCaissier==="all" || s.caissier===filterCaissier);

        return (
          <div style={{overflowY:"auto", overflowX:"hidden", flex:1, WebkitOverflowScrolling:"touch", paddingBottom:24}}>
            {/* Stats annulations */}
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6, marginBottom:12}}>
              <div style={{background:T.surface, borderRadius:12, padding:10, textAlign:"center"}}>
                <div style={{fontSize:9, color:T.textMute}}>CA validé</div>
                <div style={{fontSize:14, fontWeight:800, color:T.green}}>{fmtPrice(totalActif)}</div>
              </div>
              <div style={{background:T.surface, borderRadius:12, padding:10, textAlign:"center"}}>
                <div style={{fontSize:9, color:T.textMute}}>Annulé</div>
                <div style={{fontSize:14, fontWeight:800, color:T.red}}>{fmtPrice(totalAnnule)}</div>
              </div>
              <div style={{background:T.surface, borderRadius:12, padding:10, textAlign:"center", background:txAnnul>15?T.btnRed.bg:T.surface}}>
                <div style={{fontSize:9, color:T.textMute}}>Taux annul.</div>
                <div style={{fontSize:14, fontWeight:800, color:txAnnul>15?T.red:T.green}}>{txAnnul}%</div>
              </div>
            </div>
            {/* Filtre caissier */}
            {allCaissiers.length > 1 && (
              <div style={{display:"flex", gap:4, overflowX:"auto", marginBottom:10, paddingBottom:4}}>
                {["all", ...allCaissiers].map(c=>(
                  <button key={c} onClick={()=>setFilterCaissier(c)} style={{flex:"0 0 auto", background:filterCaissier===c?T.accent:T.surface2, border:"none", borderRadius:8, padding:"4px 10px", fontSize:10, fontWeight:600, color:filterCaissier===c?T.bg:T.text}}>{c==="all"?"Tous":c}</button>
                ))}
              </div>
            )}
            {ventesFiltered.length===0 && ventesAnnulees.length===0 && (
              <div style={{textAlign:"center", padding:50, color:T.textMute}}>
                <div style={{fontSize:32, marginBottom:8}}>🧾</div>
                <div style={{fontSize:13}}>Aucune vente aujourd'hui</div>
              </div>
            )}
            {ventesActives.length>0 && (
              <>
                <div style={{fontSize:11, fontWeight:700, color:T.textMute, marginBottom:8, letterSpacing:".5px"}}>ANNULABLES · {ventesFiltered.length}{filterCaissier!=="all"?` (${filterCaissier})`:""}</div>
                {[...ventesFiltered].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(s=><SaleCard key={s.id} s={s} annulable={true}/>)}
              </>
            )}
            {ventesAnnulees.length>0 && (
              <>
                <div style={{fontSize:11, fontWeight:700, color:T.textMute, margin:"14px 0 8px", letterSpacing:".5px"}}>DÉJÀ ANNULÉES · {ventesAnnulees.length}</div>
                {[...ventesAnnulees].sort((a,b)=>(b.cancelledAt||b.timestamp||0)-(a.cancelledAt||a.timestamp||0)).map(s=><SaleCard key={s.id} s={s} annulable={false}/>)}
              </>
            )}
          </div>
        );
      })()}

      {cancelModal && (() => {
        const MOTIFS = ["Erreur de saisie","Client a changé d'avis","Doublon","Mauvais produit","Autre"];
        const motifValide = cancelRaison.trim().length>0;
        const motifRapide = MOTIFS.includes(cancelRaison) && cancelRaison!=="Autre";
        return (
          <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.82)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:1000}}>
            <div style={{background:T.surface, borderRadius:"24px 24px 0 0", padding:"20px 20px 36px", width:"100%", maxWidth:480}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
                <div style={{fontSize:16, fontWeight:800, color:T.red}}>🗑️ Annuler la vente</div>
                <button onClick={()=>{setCancelModal(null);setCancelRaison("");}} style={{background:T.surface2, border:"none", borderRadius:50, width:32, height:32, fontSize:15, color:T.textMute, display:"flex", alignItems:"center", justifyContent:"center"}}>✕</button>
              </div>
              {/* Récap */}
              <div style={{background:T.surface2, borderRadius:12, padding:"10px 14px", marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div>
                  <div style={{fontSize:11, color:T.textMute}}>
                    {cancelModal.timestamp?new Date(cancelModal.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""}
                    {cancelModal.caissier?` · 👤 ${cancelModal.caissier}`:""}
                  </div>
                  <div style={{fontSize:11, color:T.textMute}}>{(cancelModal.items||[]).reduce((a,i)=>a+(i.qty||1),0)} article(s)</div>
                </div>
                <div style={{fontSize:20, fontWeight:800, color:T.accent}}>{fmtPrice(cancelModal.total)}</div>
              </div>
              {/* Motifs rapides */}
              <div style={{fontSize:11, fontWeight:700, color:T.textMute, marginBottom:8}}>Motif</div>
              <div style={{display:"flex", flexWrap:"wrap", gap:7, marginBottom:12}}>
                {MOTIFS.map(m=>(
                  <button key={m} onClick={()=>setCancelRaison(m)}
                    style={{background:cancelRaison===m?T.red:"#ff000015", border:`1px solid ${cancelRaison===m?T.red:T.border}`, borderRadius:20, padding:"7px 13px", fontSize:12, fontWeight:600, color:cancelRaison===m?"#fff":T.text}}>
                    {m}
                  </button>
                ))}
              </div>
              {/* Champ libre (si Autre ou texte libre) */}
              {(!motifRapide) && (
                <textarea placeholder="Précisez le motif..." value={cancelRaison==="Autre"?"":cancelRaison} onChange={e=>setCancelRaison(e.target.value)}
                  rows="2" style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:12, resize:"none", marginBottom:14}} />
              )}
              {motifRapide && <div style={{marginBottom:14}}/>}
              {/* Boutons */}
              <div style={{display:"flex", gap:10}}>
                <button onClick={()=>{setCancelModal(null);setCancelRaison("");}}
                  style={{flex:1, background:T.surface2, border:"none", borderRadius:14, padding:"13px", fontWeight:600, fontSize:13, color:T.text}}>
                  Retour
                </button>
                <button onClick={()=>{ if(!motifValide){flashMsg("Choisissez un motif");return;} cancelSale(cancelModal.id,cancelRaison); setCancelModal(null); setCancelRaison(""); }}
                  style={{flex:2, background:motifValide?T.red:T.surface2, border:"none", borderRadius:14, padding:"13px", fontWeight:800, fontSize:13, color:motifValide?"#fff":T.textMute}}>
                  ✅ Confirmer l'annulation
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function PanierContent({ T, items, setItems, total, addSale, addCredit, flashMsg, useBLE, ticketFormat, nbCopies }) {
  const updateQty = (id, delta) => setItems(items.map(i=>i.id===id?{...i, qty:Math.max(1,(i.qty||1)+delta)}:i));
  const removeItem = (id) => setItems(items.filter(i=>i.id!==id));
  const clearCart = () => { if(confirm("Annuler toute la vente ?")) setItems([]); };
  const cartTotal = items.reduce((s,i)=>s+(i.qty||1),0);
  const copiesLabel = nbCopies > 1 ? ` x${nbCopies}` : "";
  const printLabel = useBLE ? `🖨️ BLE ${ticketFormat||"80mm"}${copiesLabel} + Valider` : `🖥️ Imprimer${copiesLabel} + Valider`;
  const [creditModal, setCreditModal] = useState(false);
  const [clientName, setClientName] = useState("");
  // ── FONCTIONNALITÉ 4 : Remise ──────────────────────────────────
  const [discountPct, setDiscountPct] = useState(0);
  const [showDiscountInput, setShowDiscountInput] = useState(false);
  const [discountInput, setDiscountInput] = useState("");
  // ── FONCTIONNALITÉ E : Note de vente ───────────────────────────
  const [saleNote, setSaleNote] = useState("");
