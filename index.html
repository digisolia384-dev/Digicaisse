//  COMPOSANT COMMANDES — SAISIE, SUIVI RELIQUAT, IMPRESSION, WHATSAPP
// ══════════════════════════════════════════════════════════════════
function commInputStyle(T) {
  return { width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:11, marginBottom:8, color:T.text, fontSize:13, boxSizing:"border-box" };
}

function CommandesGerant({ T, commandes, addCommande, payCommande, flashMsg, shopName, shopPhone, shopAddress, shopSlogan, shopLogo, useBLE, ticketFormat, nbCopies, ticketFooter }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ nom:"", prenom:"", telephone:"", nbArticles:"", total:"", versement:"" });
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [payModal, setPayModal] = useState(null);
  const [payAmount, setPayAmount] = useState("");

  const totalNum = parseFloat(form.total) || 0;
  const versementNum = parseFloat(form.versement) || 0;
  const resteForm = Math.max(0, totalNum - versementNum);

  const resetForm = () => setForm({ nom:"", prenom:"", telephone:"", nbArticles:"", total:"", versement:"" });

  const handlePrint = (commande) => {
    try {
      if (useBLE && typeof printer !== "undefined" && printer.connected) {
        printCommandeViaBLE(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, ticketFormat, nbCopies, ticketFooter)
          .catch(()=>printCommandeFallback(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, ticketFormat, nbCopies, ticketFooter));
      } else {
        printCommandeFallback(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, ticketFormat, nbCopies, ticketFooter);
      }
    } catch(e) {
      printCommandeFallback(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, ticketFormat, nbCopies, ticketFooter);
    }
  };

  const handleSendReliquat = (commande) => {
    const msg = buildReliquatWhatsAppMsg(commande, shopName);
    const tel = (commande.telephone||"").replace(/\D/g,"");
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, "_blank");
  };

  const handleSubmit = () => {
    if (!form.nom.trim() || !form.prenom.trim() || !form.telephone.trim()) { flashMsg("⚠️ Nom, prénom et téléphone requis"); return; }
    if (!form.nbArticles || parseInt(form.nbArticles) <= 0) { flashMsg("⚠️ Nombre d'articles invalide"); return; }
    if (!totalNum || totalNum <= 0) { flashMsg("⚠️ Total à payer invalide"); return; }
    if (versementNum > totalNum) { flashMsg("⚠️ Le montant versé dépasse le total"); return; }
    const commande = addCommande({
      nom: form.nom.trim(), prenom: form.prenom.trim(), telephone: form.telephone.trim(),
      nbArticles: parseInt(form.nbArticles), total: totalNum, paidAmount: versementNum
    });
    setShowForm(false);
    resetForm();
    if (commande) setTimeout(()=>handlePrint(commande), 300);
  };

  const filtered = (commandes||[]).filter(c => {
    if (filter==="solde" && !c.paid) return false;
    if (filter==="partiel" && c.paid) return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      return `${c.nom} ${c.prenom} ${c.telephone}`.toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b)=>b.timestamp-a.timestamp);

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
        <div style={{fontSize:13, fontWeight:700}}>📝 Commandes clients</div>
        <button onClick={()=>setShowForm(true)} style={{background:T.accent, border:"none", borderRadius:10, padding:"8px 14px", fontWeight:700, color:T.bg, fontSize:12}}>+ Nouvelle</button>
      </div>

      <input placeholder="🔎 Rechercher (nom, prénom, tél.)" value={search} onChange={e=>setSearch(e.target.value)} style={{...commInputStyle(T), marginBottom:8}} />

      <div style={{display:"flex", gap:5, marginBottom:12}}>
        {[["all","Toutes"],["partiel","🟠 Partielles"],["solde","🟢 Soldées"]].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)} style={{flex:1, background:filter===k?T.green:T.surface2, border:"none", borderRadius:10, padding:7, fontSize:11, fontWeight:600, color:filter===k?T.bg:T.textMute}}>{l}</button>
        ))}
      </div>

      {filtered.length===0 && <div style={{textAlign:"center", padding:24, color:T.textMute, fontSize:12}}>Aucune commande</div>}

      {filtered.map(c => {
        const reste = Math.max(0, c.total - (c.paidAmount||0));
        return (
          <div key={c.id} style={{background:T.surface, borderRadius:14, padding:12, marginBottom:8}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:700, fontSize:13}}>{c.prenom} {c.nom}</div>
                <div style={{fontSize:11, color:T.textMute}}>{c.telephone} · {c.nbArticles} article{c.nbArticles>1?"s":""}</div>
              </div>
              <div style={{fontSize:10, fontWeight:700, padding:"3px 8px", borderRadius:8, background:c.paid?T.btnGreen.bg:"#f5a62322", color:c.paid?T.green:T.orange, flexShrink:0}}>{c.paid?"🟢 Soldé":"🟠 Partiel"}</div>
            </div>
            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6, marginTop:8}}>
              <div><div style={{fontSize:9, color:T.textMute}}>Total</div><div style={{fontSize:12, fontWeight:700}}>{fmtPrice(c.total)}</div></div>
              <div><div style={{fontSize:9, color:T.textMute}}>Versé</div><div style={{fontSize:12, fontWeight:700, color:T.green}}>{fmtPrice(c.paidAmount||0)}</div></div>
              <div><div style={{fontSize:9, color:T.textMute}}>Reste</div><div style={{fontSize:12, fontWeight:700, color:reste>0?T.red:T.green}}>{fmtPrice(reste)}</div></div>
            </div>
            <div style={{display:"flex", gap:6, marginTop:10, flexWrap:"wrap"}}>
              <button onClick={()=>handlePrint(c)} style={{flex:"1 0 auto", background:T.surface2, border:"none", borderRadius:8, padding:"7px 10px", fontSize:11, color:T.text}}>🖨️ Imprimer</button>
              {reste>0 && <button onClick={()=>handleSendReliquat(c)} style={{flex:"1 0 auto", background:"#25D36622", border:"none", borderRadius:8, padding:"7px 10px", fontSize:11, color:"#25D366", fontWeight:600}}>💬 Rappel</button>}
              {reste>0 && <button onClick={()=>{setPayModal(c); setPayAmount("");}} style={{flex:"1 0 auto", background:T.btnGreen.bg, border:"none", borderRadius:8, padding:"7px 10px", fontSize:11, color:T.green, fontWeight:600}}>💰 Encaisser</button>}
            </div>
          </div>
        );
      })}

      {/* Modal nouvelle commande */}
      {showForm && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,.6)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16}}>
          <div style={{background:T.surface, borderRadius:16, padding:18, width:"100%", maxWidth:380, maxHeight:"88vh", overflowY:"auto"}}>
            <div style={{fontSize:16, fontWeight:800, marginBottom:12}}>📝 Nouvelle commande</div>
            <input placeholder="Nom" value={form.nom} onChange={e=>setForm(f=>({...f,nom:e.target.value}))} style={commInputStyle(T)} />
            <input placeholder="Prénom" value={form.prenom} onChange={e=>setForm(f=>({...f,prenom:e.target.value}))} style={commInputStyle(T)} />
            <input placeholder="Numéro de téléphone" value={form.telephone} onChange={e=>setForm(f=>({...f,telephone:e.target.value}))} style={commInputStyle(T)} />
            <input type="number" placeholder="Nombre d'articles commandés" value={form.nbArticles} onChange={e=>setForm(f=>({...f,nbArticles:e.target.value}))} style={commInputStyle(T)} />
            <input type="number" placeholder="Total à payer (FCFA)" value={form.total} onChange={e=>setForm(f=>({...f,total:e.target.value}))} style={commInputStyle(T)} />
            <input type="number" placeholder="Montant versé (FCFA)" value={form.versement} onChange={e=>setForm(f=>({...f,versement:e.target.value}))} style={commInputStyle(T)} />
            <div style={{background:T.surface2, borderRadius:12, padding:12, marginBottom:14, textAlign:"center"}}>
              <div style={{fontSize:10, color:T.textMute}}>Reste à payer</div>
              <div style={{fontSize:20, fontWeight:800, color:resteForm>0?T.red:T.green}}>{fmtPrice(resteForm)}</div>
            </div>
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>{setShowForm(false); resetForm();}} style={{flex:1, background:T.surface2, border:"none", borderRadius:12, padding:12, color:T.text}}>Annuler</button>
              <button onClick={handleSubmit} style={{flex:1, background:T.accent, border:"none", borderRadius:12, padding:12, fontWeight:700, color:T.bg}}>Enregistrer + Imprimer</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal encaissement */}
      {payModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,.6)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16}}>
          <div style={{background:T.surface, borderRadius:16, padding:18, width:"100%", maxWidth:340}}>
            <div style={{fontSize:15, fontWeight:800, marginBottom:4}}>💰 Encaisser un versement</div>
            <div style={{fontSize:11, color:T.textMute, marginBottom:12}}>{payModal.prenom} {payModal.nom} — Reste: {fmtPrice(Math.max(0, payModal.total-(payModal.paidAmount||0)))}</div>
            <input type="number" placeholder="Montant versé" value={payAmount} onChange={e=>setPayAmount(e.target.value)} style={commInputStyle(T)} />
            <div style={{display:"flex", gap:8, marginTop:10}}>
              <button onClick={()=>setPayModal(null)} style={{flex:1, background:T.surface2, border:"none", borderRadius:12, padding:12, color:T.text}}>Annuler</button>
              <button onClick={()=>{
                const amt = parseFloat(payAmount);
                if(!amt || amt<=0){ flashMsg("⚠️ Montant invalide"); return; }
                payCommande(payModal.id, amt);
                setPayModal(null); setPayAmount("");
              }} style={{flex:1, background:T.green, border:"none", borderRadius:12, padding:12, fontWeight:700, color:T.bg}}>Valider</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function OwnerContent({ T, shopName, shopPhone, shopAddress, shopSlogan, setShopName, setShopPhone, setShopAddress, setShopSlogan, saveShopInfo, whatsapp, products, setProducts, sales, flashMsg, shopId, stockMovements, updateStock, updateAdminPin, updateGerantPin, session, credits, payCredit, caissiers, saveCaissier, deleteCaissier, loginCaissier, currentCaissier, shopLogo, setShopLogo, addSale, ticketFormat, setTicketFormat, nbCopies, setNbCopies, ticketFooter, setTicketFooter }) {
  const [tab, setTab] = useState("stats");
  const [showForm, setShowForm] = useState(false);
  const [editProd, setEditProd] = useState(null);
  const [pName, setPName] = useState(""); const [pPrice, setPPrice] = useState(""); const [pPrixAchat, setPPrixAchat] = useState("");
  const [pStock, setPStock] = useState(""); const [pStockUnlimited, setPStockUnlimited] = useState(false);
  const [pCategory, setPCategory] = useState(""); const [pBarcode, setPBarcode] = useState("");
  const [pPhoto, setPPhoto] = useState(null);
  const [showPinForm, setShowPinForm] = useState(false);
  const [newPin, setNewPin] = useState(""); const [newPinConfirm, setNewPinConfirm] = useState("");
  const [showGerantPinForm, setShowGerantPinForm] = useState(false);
  const [newGerantPin, setNewGerantPin] = useState(""); const [newGerantPinConfirm, setNewGerantPinConfirm] = useState("");
  const [payModal, setPayModal] = useState(null); const [payAmount, setPayAmount] = useState("");
  const [cName, setCName] = useState(""); const [cPin, setCPin] = useState(""); const [showCaisForm, setShowCaisForm] = useState(false);
  const [caisLoginModal, setCaisLoginModal] = useState(false); const [loginPin, setLoginPin] = useState(""); const [loginTarget, setLoginTarget] = useState(null);
  const [depenses, setDepenses] = useState([]);
  const [depLoading, setDepLoading] = useState(true);
  const [logoUploading, setLogoUploading] = useState(false);
  const [comptablePin, setComptablePin] = useState(() => localStorage.getItem(`pos_comptable_pin_${shopId}`) || "1234");
  const [showComptablePinForm, setShowComptablePinForm] = useState(false);
  const [newComptablePin, setNewComptablePin] = useState(""); const [newComptablePinConfirm, setNewComptablePinConfirm] = useState("");

  const db_ref = window.db;

  const handleLogoUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLogoUploading(true);
    try {
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const base64 = await resizeLogoToBase64(ev.target.result, 400, 150);
        if (db) await db.collection('shops').doc(shopId).update({ logoBase64: base64 });
        setShopLogo(base64);
        flashMsg('✅ Logo enregistré !');
        setLogoUploading(false);
      };
      reader.readAsDataURL(file);
    } catch(e) { flashMsg('❌ Erreur upload logo'); setLogoUploading(false); }
  };

  const handleLogoDelete = async () => {
    if (!confirm('Supprimer le logo ?')) return;
    if (db) await db.collection('shops').doc(shopId).update({ logoBase64: null });
    setShopLogo(null);
    flashMsg('🗑️ Logo supprimé');
  };

  useEffect(() => {
    if (!db || !shopId) { setDepLoading(false); return; }
    const unsub = db.collection("shops").doc(shopId).collection("depenses")
      .orderBy("timestamp","desc")
      .onSnapshot(snap => {
        setDepenses(snap.docs.map(d=>({id:d.id,...d.data()})));
        setDepLoading(false);
      }, ()=>setDepLoading(false));
    return unsub;
  }, [shopId]);

                      <div style={{fontSize:9, color:T.textMute}}>Dépenses</div>
                      <div style={{fontSize:18, fontWeight:800, color:T.red}}>{fmtPrice(totalSemaine.dep)}</div>

            <input placeholder="Code-barres (optionnel)" value={pBarcode} onChange={e=>setPBarcode(e.target.value)} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, marginBottom:8, color:T.text}} />
            {/* Photo produit */}

          <div style={{background:T.surface, borderRadius:24, padding:20, width:"90%", maxWidth:360}}>
            <div style={{fontSize:18, fontWeight:800}}>🔐 Changer le PIN Admin</div>
            <input type="password" placeholder="Nouveau PIN (4 chiffres)" value={newPin} onChange={e=>setNewPin(e.target.value.replace(/\D/g,"").slice(0,4))} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, margin:"12px 0", color:T.text}} />
            <input type="password" placeholder="Confirmer le PIN" value={newPinConfirm} onChange={e=>setNewPinConfirm(e.target.value.replace(/\D/g,"").slice(0,4))} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, marginBottom:12, color:T.text}} />
            <div style={{display:"flex", gap:8}}><button onClick={()=>{setShowPinForm(false);setNewPin("");setNewPinConfirm("");}} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button><button onClick={handlePinChange} style={{flex:1, background:T.accent, borderRadius:12, padding:12, color:T.bg}}>Modifier</button></div>
          </div>
        </div>
      )}
      {showGerantPinForm && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000}}>
          <div style={{background:T.surface, borderRadius:24, padding:20, width:"90%", maxWidth:360}}>
            <div style={{fontSize:18, fontWeight:800, marginBottom:4}}>📋 PIN Gérant</div>
            <div style={{fontSize:11, color:T.textMute, marginBottom:12}}>Accès aux stats et stock sans accéder aux paramètres admin.</div>
            <input type="password" placeholder="PIN gérant (4 chiffres)" maxLength={4} value={newGerantPin} onChange={e=>setNewGerantPin(e.target.value.replace(/\D/g,"").slice(0,4))} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, margin:"0 0 8px", color:T.text, textAlign:"center", fontSize:18, letterSpacing:8}} />

            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>{setShowGerantPinForm(false);setNewGerantPin("");setNewGerantPinConfirm("");}} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button>
              <button onClick={()=>{
                if(newGerantPin.length!==4){flashMsg("4 chiffres requis");return;}

                updateGerantPin(newGerantPin);
                setShowGerantPinForm(false);setNewGerantPin("");setNewGerantPinConfirm("");

            <div style={{fontSize:18, fontWeight:800, marginBottom:4}}>🧾 PIN Comptable</div>
            <div style={{fontSize:11, color:T.textMute, marginBottom:12}}>Ce PIN protège l'accès au module de clôture des comptes.</div>
            <input type="password" placeholder="Nouveau PIN (4-6 chiffres)" maxLength={6} value={newComptablePin} onChange={e=>setNewComptablePin(e.target.value.replace(/\D/g,"").slice(0,6))} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, margin:"0 0 8px", color:T.text}} />
            <input type="password" placeholder="Confirmer le PIN" maxLength={6} value={newComptablePinConfirm} onChange={e=>setNewComptablePinConfirm(e.target.value.replace(/\D/g,"").slice(0,6))} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, marginBottom:14, color:T.text}} />

              <button onClick={()=>{
                if(newComptablePin.length<4){flashMsg("PIN min. 4 chiffres");return;}
                if(newComptablePin!==newComptablePinConfirm){flashMsg("❌ PIN différents");return;}
                setComptablePin(newComptablePin);
                localStorage.setItem(`pos_comptable_pin_${shopId}`, newComptablePin);
                setShowComptablePinForm(false); setNewComptablePin(""); setNewComptablePinConfirm("");
                flashMsg("✅ PIN comptable mis à jour");
              }} style={{flex:1, background:T.accent, borderRadius:12, padding:12, fontWeight:700, color:T.bg}}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DevDashboard({ T, themeName, setThemeName, logout, flashMsg }) {
  const [shops, setShops] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [planModalShop, setPlanModalShop] = useState(null);
  const [planForm, setPlanForm] = useState({ plan: "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });
  
  useEffect(() => {
    if(!db) return;
    const unsub = db.collection("shops").onSnapshot(snap => { setShops(snap.docs.map(d=>({id:d.id, ...d.data()}))); setLoading(false); });
    return unsub;
  }, []);
  
  const openPlanModal = (shop) => {
    setPlanModalShop(shop);
    setPlanForm({ plan: shop.plan || "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });
  };

  const previewNewEnd = (shop, form) => {
    if(!shop) return null;
    const base = form.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    if(form.plan === "personnalise") {
      if(form.customMode === "date") {
        if(!form.customDate) return null;
        return new Date(form.customDate + "T23:59:59").getTime();
      }
      const days = parseInt(form.customDays) || 0;
      if(days <= 0) return null;
      return calculateEndDateDays(base, days);
    }
    return calculateEndDate(base, form.plan);
  };

  const confirmPlanChange = async () => {
    const shop = planModalShop;
    if(!shop) return;
    const newEnd = previewNewEnd(shop, planForm);
    if(!newEnd) { flashMsg(planForm.customMode === "date" ? "Choisissez une date" : "Entrez un nombre de jours valide"); return; }
    const base = planForm.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    await db.collection("shops").doc(shop.id).update({ plan: planForm.plan, subscriptionStart: base, subscriptionEnd: newEnd });
    flashMsg(`Abonnement ${shop.shopName} mis à jour : ${planLabel(planForm.plan)}`);
    setPlanModalShop(null);
  };
  
  const sendReminder = async (shop) => {
    const daysLeft = shop.subscriptionEnd ? getDaysLeft(shop.subscriptionEnd) : 0;
    const message = `🔔 RAPPEL D'ABONNEMENT - ${shop.shopName}\n\nVotre abonnement ${shop.plan || "mensuel"} expire le ${formatDate(shop.subscriptionEnd)}\nPlus que ${daysLeft} jours !\n\nContactez-nous pour renouveler : ${DEV_WHATSAPP}`;
    window.open(`https://wa.me/${shop.whatsapp?.replace(/\D/g,"")}?text=${encodeURIComponent(message)}`, "_blank");
    flashMsg(`Rappel envoyé à ${shop.shopName}`);
  };
  
  const toggleShop = async (shop) => { await db.collection("shops").doc(shop.id).update({active:!shop.active}); flashMsg(shop.active?"Commerce suspendu":"Commerce activé"); };
  
  const getPlanColor = (plan) => {
    if(plan === "mensuel") return T.blue;
    if(plan === "trimestriel") return T.orange;
    if(plan === "annuel") return T.green;
    if(plan === "personnalise") return T.purple;
    return T.textMute;
  };
  
  const getStatusColor = (shop) => {
    if(!shop.active) return T.red;
    if(!shop.subscriptionEnd) return T.orange;
    const daysLeft = getDaysLeft(shop.subscriptionEnd);
    if(daysLeft <= 0) return T.red;
    if(daysLeft <= 7) return T.orange;
    return T.green;
  };

  const filteredShops = shops.filter(shop => {
    const q = search.trim().toLowerCase();
    if(!q) return true;
    return (shop.shopName||"").toLowerCase().includes(q) || (shop.ownerName||"").toLowerCase().includes(q) || (shop.whatsapp||"").includes(q);
  });

  return (
    <div className="dev-dash-root" style={{background:T.bg}}>
      <div style={{background:T.header, padding:"8px 12px", borderBottom:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, flexWrap:"wrap", flexShrink:0}}>
        <div><div style={{fontSize:9, color:T.textMute}}>Développeur</div><div style={{fontFamily:"'Outfit'", fontWeight:800, color:T.purple, fontSize:13}}>Gestion abonnements + BLE</div></div>
        <div style={{display:"flex", gap:6, alignItems:"center"}}>
          <div className="hdr-themes theme-toggle" style={{background:T.surface2}}>
              <button className={`theme-btn${themeName==="auto"?"  active":""}`} onClick={()=>setThemeName("auto")}  title="Auto"   style={{background:themeName==="auto"?T.accent:"transparent",  color:themeName==="auto"?T.bg:T.textSub}}>⚙️</button>
              <button className={`theme-btn${themeName==="light"?" active":""}`} onClick={()=>setThemeName("light")} title="Clair"  style={{background:themeName==="light"?T.accent:"transparent", color:themeName==="light"?T.bg:T.textSub}}>☀️</button>
              <button className={`theme-btn${themeName==="dark"?"  active":""}`} onClick={()=>setThemeName("dark")}  title="Sombre" style={{background:themeName==="dark"?T.accent:"transparent",  color:themeName==="dark"?T.bg:T.textSub}}>🌙</button>
              <button className={`theme-btn${themeName==="neon"?"  active":""}`} onClick={()=>setThemeName("neon")}  title="Néon"   style={{background:themeName==="neon"?T.accent:"transparent",  color:themeName==="neon"?T.bg:T.textSub}}>⚡</button>
            </div>
          <button onClick={logout} style={{background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 8px", fontSize:11}}>↩<span className="hdr-text-label"> Déco</span></button>
        </div>
      </div>
      <div className="dev-dash-scroll" style={{padding:12}}>
        <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12}}>
          <div style={{fontWeight:700}}>🏪 Multi-commerce SaaS</div>
          <div style={{fontSize:11, color:T.textMute}}>{shops.length} commerces · Gestion des abonnements (mensuel/trimestriel/annuel) · Bande défilante pour alertes</div>
        </div>
        <input
          type="text"
          placeholder="🔎 Rechercher un commerce, un propriétaire, un numéro..."
          value={search}
          onChange={e=>setSearch(e.target.value)}
          style={{width:"100%", background:T.inputBg||T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:13, marginBottom:14}}
        />
        {loading ? (
          <div className="spin" style={{width:30,height:30,border:`2px solid ${T.border}`,borderTopColor:T.accent,borderRadius:"50%",margin:"20px auto"}}></div>
        ) : filteredShops.length === 0 ? (
          <div style={{textAlign:"center", color:T.textMute, fontSize:12, padding:"30px 0"}}>Aucun commerce ne correspond à « {search} »</div>
        ) : (
        <div className="dev-shop-grid">
        {filteredShops.map(shop => {
          const daysLeft = shop.subscriptionEnd ? getDaysLeft(shop.subscriptionEnd) : 0;
          const statusColor = getStatusColor(shop);
          return (
            <div key={shop.id} style={{background:T.surface, borderRadius:16, padding:16, borderLeft: `4px solid ${statusColor}`}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"start", flexWrap:"wrap", gap:8}}>
                <div>
                  <div style={{fontWeight:800, fontSize:16}}>{shop.shopName}</div>
                  <div style={{fontSize:11, color:T.textMute}}>Propriétaire: {shop.ownerName} · WhatsApp: {shop.whatsapp}</div>
                  <div style={{fontSize:11, color:T.textMute}}>Créé le: {formatDate(shop.createdAt)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:12, color:T.textMute}}>Statut</div>
                  <div style={{fontWeight:700, color:statusColor}}>{shop.active ? (daysLeft <= 0 ? "⚠️ Expiré" : (daysLeft <= 7 ? "⚠️ Bientôt expiré" : "✅ Actif")) : "🔒 Suspendu"}</div>
                </div>
              </div>
              <div style={{marginTop:12, paddingTop:12, borderTop:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
                <div>
                  <div style={{fontSize:11, color:T.textMute}}>Abonnement actuel</div>
                  <div style={{display:"flex", alignItems:"center", gap:6}}>
                    <span style={{background:getPlanColor(shop.plan), padding:"2px 10px", borderRadius:20, fontSize:12, fontWeight:600, color:"#fff"}}>{shop.plan || "mensuel"}</span>
                    {shop.subscriptionEnd && <span style={{fontSize:11, color:T.textMute}}>Expire: {formatDate(shop.subscriptionEnd)} ({daysLeft} jours)</span>}
                  </div>
                </div>
                <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                  <button onClick={()=>openPlanModal(shop)} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"6px 12px", fontSize:11, fontWeight:600, color:T.text}}>📝 Gérer abonnement</button>
                  <button onClick={()=>sendReminder(shop)} style={{background:T.btnBlue.bg, border:"none", borderRadius:8, padding:"6px 12px", fontSize:11, color:T.blue}}>📱 Rappel</button>
                  <button onClick={()=>toggleShop(shop)} style={{background:shop.active?T.btnRed.bg:T.btnGreen.bg, border:"none", borderRadius:8, padding:"6px 12px", fontSize:11, color:shop.active?T.red:T.green}}>{shop.active?"🔒 Suspendre":"✅ Activer"}</button>
                </div>
              </div>
            </div>
          );
        })}
        </div>
        )}
      </div>
      {planModalShop && (() => {
        const shop = planModalShop;
        const preview = previewNewEnd(shop, planForm);
        const canExtend = shop.subscriptionEnd && shop.subscriptionEnd > Date.now();
        const PLAN_OPTS = [["mensuel","📅 Mensuel","30 jours"],["trimestriel","📆 Trimestriel","90 jours"],["annuel","🗓️ Annuel","365 jours"],["personnalise","✏️ Personnalisé","jours libres ou date"]];
        return (
          <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16}}>
            <div style={{background:T.surface, borderRadius:24, padding:20, width:"100%", maxWidth:380, maxHeight:"90vh", overflowY:"auto"}}>
              <div style={{fontSize:16, fontWeight:800, marginBottom:2}}>📝 Gérer l'abonnement</div>
              <div style={{fontSize:11, color:T.textMute, marginBottom:14}}>{shop.shopName} · actuellement {planLabel(shop.plan)}{shop.subscriptionEnd ? ` (expire le ${formatDate(shop.subscriptionEnd)})` : ""}</div>

              <div style={{fontSize:11, color:T.textMute, marginBottom:6}}>Plan</div>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14}}>
                {PLAN_OPTS.map(([val,lbl,sub])=>(
                  <button key={val} onClick={()=>setPlanForm(f=>({...f, plan:val}))} style={{background:planForm.plan===val?T.accent:T.surface2, border:`1px solid ${planForm.plan===val?T.accent:T.border}`, borderRadius:12, padding:"10px 8px", textAlign:"left"}}>
                    <div style={{fontWeight:700, fontSize:12, color:planForm.plan===val?T.bg:T.text}}>{lbl}</div>
                    <div style={{fontSize:9, color:planForm.plan===val?T.bg:T.textMute}}>{sub}</div>
                  </button>
                ))}
              </div>

              {planForm.plan === "personnalise" && (
                <div style={{marginBottom:14}}>
                  <div style={{display:"flex", gap:6, marginBottom:8}}>
                    <button onClick={()=>setPlanForm(f=>({...f, customMode:"days"}))} style={{flex:1, background:planForm.customMode==="days"?T.btnBlue.bg:T.surface2, border:`1px solid ${planForm.customMode==="days"?T.blue:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.customMode==="days"?T.blue:T.textMute}}>🔢 Nombre de jours</button>
                    <button onClick={()=>setPlanForm(f=>({...f, customMode:"date"}))} style={{flex:1, background:planForm.customMode==="date"?T.btnBlue.bg:T.surface2, border:`1px solid ${planForm.customMode==="date"?T.blue:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.customMode==="date"?T.blue:T.textMute}}>📆 Date précise</button>
                  </div>
                  {planForm.customMode === "days" ? (
                    <input type="number" min="1" placeholder="Ex: 45" value={planForm.customDays} onChange={e=>setPlanForm(f=>({...f, customDays:e.target.value}))} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text}} />
                  ) : (
                    <input type="date" value={planForm.customDate} onChange={e=>setPlanForm(f=>({...f, customDate:e.target.value}))} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text}} />
                  )}
                </div>
              )}

              {(planForm.plan !== "personnalise" || planForm.customMode === "days") && (
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11, color:T.textMute, marginBottom:6}}>Point de départ</div>
                  <div style={{display:"flex", gap:6}}>
                    <button onClick={()=>setPlanForm(f=>({...f, from:"today"}))} style={{flex:1, background:planForm.from==="today"?T.accent:T.surface2, border:`1px solid ${planForm.from==="today"?T.accent:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.from==="today"?T.bg:T.textMute}}>À partir d'aujourd'hui</button>
                    <button disabled={!canExtend} onClick={()=>setPlanForm(f=>({...f, from:"extend"}))} style={{flex:1, opacity:canExtend?1:0.4, background:planForm.from==="extend"?T.accent:T.surface2, border:`1px solid ${planForm.from==="extend"?T.accent:T.border}`, borderRadius:10, padding:8, fontSize:11, fontWeight:600, color:planForm.from==="extend"?T.bg:T.textMute}}>Prolonger depuis l'expiration</button>
                  </div>
                </div>
              )}

              <div style={{background:T.surface2, borderRadius:12, padding:12, marginBottom:16, textAlign:"center"}}>
                <div style={{fontSize:10, color:T.textMute}}>Nouvelle date d'expiration</div>
                <div style={{fontSize:18, fontWeight:800, color:preview?T.accent:T.textMute}}>{preview ? formatDate(preview) : "—"}</div>
              </div>

              <div style={{display:"flex", gap:8}}>
                <button onClick={()=>setPlanModalShop(null)} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button>
                <button onClick={confirmPlanChange} style={{flex:1, background:T.accent, borderRadius:12, padding:12, fontWeight:700, color:T.bg}}>Valider</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- ════════════════════════════════════════════════════════════
     PWA – Enregistrement du Service Worker + Bannière install
═════════════════════════════════════════════════════════════ -->
<script>
(function() {
  // ── Service Worker ────────────────────────────────────────────
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js", { scope: "/" })
        .then((reg) => {
          console.log("[PWA] SW enregistré – scope :", reg.scope);

          // Détecte une mise à jour disponible et propose le rechargement
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                if (confirm("🔄 Mise à jour disponible – recharger ?")) {
                  newWorker.postMessage("SKIP_WAITING");
                  window.location.reload();
                }
              }
            });
          });
        })
        .catch((err) => console.warn("[PWA] SW non enregistré :", err));
    });
  }

  // ── Bannière « Ajouter à l'écran d'accueil » ─────────────────
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // Affiche la bannière après 4 secondes si l'app n'est pas déjà installée
    setTimeout(() => {
      if (!deferredPrompt) return;
      const banner = document.createElement("div");
      banner.id = "pwa-install-banner";
      Object.assign(banner.style, {
        position: "fixed", bottom: "92px", left: "50%",
        transform: "translateX(-50%)",
        background: "#111620", border: "1px solid #1E2630",
        borderRadius: "20px", padding: "10px 16px",
        display: "flex", alignItems: "center", gap: "12px",
        zIndex: "9999", boxShadow: "0 8px 32px rgba(0,0,0,.6)",
        fontSize: "13px", fontFamily: "'DM Mono', monospace",
        color: "#E8E4DA", maxWidth: "340px", width: "90%",
        animation: "slideUp .35s ease"
      });
      banner.innerHTML = `
        <img src="icon-192.png" width="36" height="36"
             style="border-radius:10px;flex-shrink:0" alt="">
        <div style="flex:1;line-height:1.4">
          <div style="font-weight:700;color:#F5C842">Installer Caisse Pro</div>
          <div style="font-size:11px;color:#A8A49A">Accès rapide, icône sur l'écran</div>
        </div>
        <button id="pwa-install-btn"
          style="background:#F5C842;border:none;border-radius:12px;
                 padding:8px 14px;font-weight:800;font-size:12px;
                 color:#0A0E12;cursor:pointer;flex-shrink:0">
          Installer
        </button>
        <button id="pwa-dismiss-btn"
          style="background:transparent;border:none;color:#A8A49A;
                 font-size:18px;cursor:pointer;flex-shrink:0;line-height:1">
          ✕
        </button>`;

      // Ajoute l'animation dans le style global
      if (!document.getElementById("pwa-anim-style")) {
        const s = document.createElement("style");
        s.id = "pwa-anim-style";
        s.textContent = `@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}`;
        document.head.appendChild(s);
      }

      document.body.appendChild(banner);

      document.getElementById("pwa-install-btn").addEventListener("click", async () => {
        banner.remove();
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log("[PWA] Install choice :", outcome);
        deferredPrompt = null;
      });

      document.getElementById("pwa-dismiss-btn").addEventListener("click", () => {
        banner.remove();
        deferredPrompt = null;
      });
    }, 4000);
  });

  // Masque la bannière si l'app est déjà lancée en mode standalone
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    const b = document.getElementById("pwa-install-banner");
    if (b) b.remove();
    console.log("[PWA] App installée avec succès !");
  });
})();
</script>
</body>
</html>
