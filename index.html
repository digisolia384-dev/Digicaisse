  const [showNoteInput, setShowNoteInput] = useState(false);
  const [showMonnaie, setShowMonnaie] = useState(false);
  const discountAmount = Math.round(total * discountPct / 100);
  const totalAfterDiscount = total - discountAmount;
  const applyDiscount = () => {
    const n = Math.min(100, Math.max(0, parseFloat(discountInput)||0));
    setDiscountPct(n);
    setShowDiscountInput(false);
    if (n > 0) flashMsg(`🏷️ Remise ${n}% appliquée`);
  };
  const QUICK_DISC = [5, 10, 15, 20];

  return (
    <>
      <div style={{padding:12, borderBottom:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", flexShrink:0}}>
        <span style={{fontWeight:700}}>🛒 Panier ({cartTotal})</span>
        <button onClick={clearCart} style={{background:"transparent", border:"none", color:T.red}}>Tout annuler</button>
      </div>
      <div style={{flex:1, overflowY:"auto", padding:8}}>
        {items.length === 0 && <div style={{textAlign:"center", padding:32, color:T.textMute, fontSize:12}}>Panier vide</div>}
        {items.map(it=>(
          <div key={it.id} style={{background:T.surface2, borderRadius:10, padding:8, marginBottom:6}}>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{fontSize:13}}>{it.label}</span><span style={{fontWeight:700}}>{fmtPrice(it.amount*it.qty)}</span></div>
            <div style={{display:"flex", justifyContent:"space-between", marginTop:4}}>
              <div><button onClick={()=>updateQty(it.id,-1)} style={{background:T.bg, border:"none", width:26, borderRadius:5}}>-</button> <span style={{fontSize:13, fontWeight:600}}>{it.qty}</span> <button onClick={()=>updateQty(it.id,1)} style={{background:T.bg, border:"none", width:26, borderRadius:5}}>+</button></div>
              <button onClick={()=>removeItem(it.id)} style={{background:"transparent", border:"none", color:T.red}}>🗑️</button>
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:12, borderTop:`1px solid ${T.border}`, flexShrink:0, background:T.surface}}>
        {/* ── Remise rapide ── */}
        {items.length > 0 && (
          <div style={{marginBottom:8}}>
            {!showDiscountInput ? (
              <div style={{display:"flex", gap:4, alignItems:"center", flexWrap:"wrap"}}>
                <span style={{fontSize:10, color:T.textMute}}>🏷️ Remise:</span>
                {QUICK_DISC.map(d=>(
                  <button key={d} onClick={()=>{setDiscountPct(d); flashMsg(`🏷️ Remise ${d}%`);}}
                    style={{background:discountPct===d?T.orange:T.surface2, border:`1px solid ${discountPct===d?T.orange:T.border}`, borderRadius:8, padding:"2px 8px", fontSize:10, fontWeight:700, color:discountPct===d?"#fff":T.text}}>
                    {d}%
                  </button>
                ))}
                <button onClick={()=>{setShowDiscountInput(true); setDiscountInput(discountPct>0?String(discountPct):"");}}
                  style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"2px 8px", fontSize:10, color:T.textMute}}>
                  ✏️
                </button>
                {discountPct > 0 && <button onClick={()=>setDiscountPct(0)} style={{background:"transparent", border:"none", color:T.red, fontSize:10}}>✕</button>}
              </div>
            ) : (
              <div style={{display:"flex", gap:6, alignItems:"center"}}>
                <input autoFocus value={discountInput} onChange={e=>setDiscountInput(e.target.value)} placeholder="%" 
                  style={{width:60, background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:8, padding:"4px 8px", color:T.text, fontSize:12}} />
                <button onClick={applyDiscount} style={{background:T.accent, border:"none", borderRadius:8, padding:"4px 10px", fontWeight:700, color:T.bg, fontSize:11}}>OK</button>
                <button onClick={()=>setShowDiscountInput(false)} style={{background:"transparent", border:"none", color:T.textMute, fontSize:11}}>✕</button>
              </div>
            )}
            {discountPct > 0 && (
              <div style={{marginTop:4, background:T.btnRed.bg, borderRadius:8, padding:"4px 8px", fontSize:10, display:"flex", justifyContent:"space-between"}}>
                <span style={{color:T.orange}}>Remise {discountPct}%</span>
                <span style={{color:T.orange, fontWeight:700}}>−{fmtPrice(discountAmount)}</span>
              </div>
            )}
          </div>
        )}
        <div style={{display:"flex", justifyContent:"space-between", marginBottom:discountPct>0?2:8, fontSize:discountPct>0?13:18, fontWeight:800, color:discountPct>0?T.textMute:T.accent}}><span>TOTAL</span><span style={{textDecoration:discountPct>0?"line-through":"none"}}>{fmtPrice(total)}</span></div>
        {discountPct > 0 && <div style={{display:"flex", justifyContent:"space-between", marginBottom:8, fontSize:18, fontWeight:800, color:T.green}}><span>À PAYER</span><span>{fmtPrice(totalAfterDiscount)}</span></div>}
        {/* ── Note de vente ── */}
        {items.length > 0 && (
          <div style={{marginBottom:8}}>
            {!showNoteInput && !saleNote ? (
              <button onClick={()=>setShowNoteInput(true)} style={{background:"transparent", border:`1px dashed ${T.border}`, borderRadius:8, padding:"4px 10px", fontSize:10, color:T.textMute, width:"100%"}}>
                📝 Ajouter une note à cette vente
              </button>
            ) : showNoteInput ? (
              <div>
                <textarea autoFocus value={saleNote} onChange={e=>setSaleNote(e.target.value)} placeholder="Ex: client régulier, paiement en 2x..." rows={2}
                  style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:8, padding:"6px 10px", color:T.text, fontSize:11, resize:"none", marginBottom:4}} />
                <div style={{display:"flex", gap:6}}>
                  <button onClick={()=>setShowNoteInput(false)} style={{flex:1, background:T.accent, border:"none", borderRadius:8, padding:"5px", fontSize:10, fontWeight:700, color:T.bg}}>✓ OK</button>
                  <button onClick={()=>{setSaleNote(""); setShowNoteInput(false);}} style={{background:"transparent", border:"none", color:T.red, fontSize:10, padding:"5px 8px"}}>✕</button>
                </div>
              </div>
            ) : (
              <div style={{background:T.surface2, borderRadius:8, padding:"5px 10px", fontSize:10, color:T.textMute, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <span>📝 {saleNote}</span>
                <button onClick={()=>setShowNoteInput(true)} style={{background:"transparent", border:"none", color:T.blue, fontSize:10}}>✏️</button>
              </div>
            )}
          </div>
        )}
        {items.length > 0 && (
          <button onClick={()=>setShowMonnaie(true)} style={{width:"100%", background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:10, marginBottom:8, fontWeight:600, color:T.text, fontSize:12}}>💱 Calculer la monnaie</button>
        )}
        {showMonnaie && <MonnaieCalculator T={T} total={totalAfterDiscount||total} onClose={()=>setShowMonnaie(false)} />}
        <button onClick={()=>{ if(items.length) addSale(items, totalAfterDiscount, true, saleNote); else flashMsg("Panier vide"); }} style={{width:"100%", background:T.green, border:"none", borderRadius:12, padding:12, fontWeight:700, color:T.bg, fontSize:13}}>{printLabel}</button>
        <button onClick={()=>{ if(items.length) addSale(items, totalAfterDiscount, false, saleNote); else flashMsg("Panier vide"); }} style={{marginTop:6, width:"100%", background:T.blue, border:"none", borderRadius:12, padding:11, fontWeight:700, color:T.bg}}>✅ Valider sans ticket</button>
        <button onClick={()=>{ if(items.length) setCreditModal(true); else flashMsg("Panier vide"); }} style={{marginTop:6, width:"100%", background:T.orange||"#f59e0b", border:"none", borderRadius:12, padding:11, fontWeight:700, color:"#fff"}}>💳 Vendre à crédit</button>
      </div>
      {creditModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1200}}>
          <div style={{background:T.surface, borderRadius:24, padding:20, width:"90%", maxWidth:360}}>
            <div style={{fontSize:18, fontWeight:800, marginBottom:4}}>💳 Vente à crédit</div>
            <div style={{fontSize:12, color:T.textMute, marginBottom:12}}>Total: <strong>{fmtPrice(total)}</strong></div>
            <input autoFocus placeholder="Nom du client (obligatoire)" value={clientName} onChange={e=>setClientName(e.target.value)} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, marginBottom:14, color:T.text}} />
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>{setCreditModal(false); setClientName("");}} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button>
              <button onClick={()=>{ if(clientName.trim()){ addCredit(items, total, clientName.trim()); setCreditModal(false); setClientName(""); } else flashMsg("Nom requis"); }} style={{flex:1, background:T.orange||"#f59e0b", borderRadius:12, padding:12, fontWeight:700, color:"#fff"}}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ══════════════════════════════════════════════════════════════════
//  VALORISATION STOCK
// ══════════════════════════════════════════════════════════════════
function SectionValorisation({ T, products }) {
  const prodsAvecStock = products.filter(p=>p.active!==false && p.stock!==undefined && p.stock!==null && p.stock!==-1 && p.stock>0);
  const valeurAchat = prodsAvecStock.reduce((a,p)=>a+((p.prixAchat||0)*p.stock),0);
  const valeurVente = prodsAvecStock.reduce((a,p)=>a+((p.price||0)*p.stock),0);
  const margeStock = valeurVente - valeurAchat;
  const sorted = [...prodsAvecStock].sort((a,b)=>((b.prixAchat||0)*b.stock)-((a.prixAchat||0)*a.stock));

  return (
    <div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14}}>
        <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.blue}44`}}>
          <div style={{fontSize:10, color:T.textMute}}>Coût d'achat total</div>
          <div style={{fontSize:20, fontWeight:800, color:T.blue}}>{fmtPrice(valeurAchat)}</div>
          <div style={{fontSize:9, color:T.textMute, marginTop:2}}>Capital immobilisé</div>
        </div>
        <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.green}44`}}>
          <div style={{fontSize:10, color:T.textMute}}>Valeur de vente</div>
          <div style={{fontSize:20, fontWeight:800, color:T.green}}>{fmtPrice(valeurVente)}</div>
          <div style={{fontSize:9, color:T.textMute, marginTop:2}}>Si tout vendu</div>
        </div>
        <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.accent}44`, gridColumn:"span 2"}}>
          <div style={{fontSize:10, color:T.textMute}}>Marge potentielle du stock</div>
          <div style={{fontSize:24, fontWeight:800, color:margeStock>=0?T.accent:T.red}}>{fmtPrice(margeStock)}</div>
          <div style={{fontSize:9, color:T.textMute, marginTop:2}}>{prodsAvecStock.length} produit(s) en stock · {products.filter(p=>p.stock===-1).length} à stock illimité (exclus)</div>
        </div>
      </div>
      <div style={{background:T.surface, borderRadius:16, padding:14}}>
        <div style={{fontSize:12, fontWeight:700, marginBottom:10, color:T.text}}>📋 Détail par produit</div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 40px 60px 70px", gap:4, marginBottom:6, padding:"0 6px"}}>
          {["Produit","Qté","P.Achat","Valeur"].map(h=>(
            <div key={h} style={{fontSize:9, fontWeight:700, color:T.textMute, textAlign:h==="Produit"?"left":"right"}}>{h}</div>
          ))}
        </div>
        {sorted.map(p=>{
          const va=(p.prixAchat||0)*p.stock; const vv=(p.price||0)*p.stock;
          return (
            <div key={p.id} style={{display:"grid", gridTemplateColumns:"1fr 40px 60px 70px", gap:4, padding:"8px 6px", borderBottom:`1px solid ${T.border}`, alignItems:"center"}}>
              <div>
                <div style={{fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
                {p.category && <div style={{fontSize:9, color:T.textMute}}>{p.category}</div>}
              </div>
              <div style={{textAlign:"right", fontSize:12, fontWeight:600}}>{p.stock}</div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11, color:T.textMute}}>{fmtPrice(p.prixAchat||0)}</div>
                <div style={{fontSize:9, color:T.textMute}}>{fmtPrice(p.price)}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:12, fontWeight:700, color:va>0?T.blue:T.textMute}}>{fmtPrice(va)}</div>
                <div style={{fontSize:9, color:T.green}}>{fmtPrice(vv)}</div>
              </div>
            </div>
          );
        })}
        {sorted.length===0 && (
          <div style={{textAlign:"center", padding:30, color:T.textMute, fontSize:12}}>
            <div style={{fontSize:28, marginBottom:8}}>📭</div>
            Aucun produit avec stock et prix d'achat renseignés
          </div>
        )}
        {sorted.length>0 && (
          <div style={{display:"grid", gridTemplateColumns:"1fr 40px 60px 70px", gap:4, padding:"10px 6px 0", marginTop:4, borderTop:`2px solid ${T.accent}44`}}>
            <div style={{fontSize:11, fontWeight:800}}>TOTAL</div>
            <div style={{textAlign:"right", fontSize:11, fontWeight:700}}>{prodsAvecStock.reduce((a,p)=>a+p.stock,0)}</div>
            <div></div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:12, fontWeight:800, color:T.blue}}>{fmtPrice(valeurAchat)}</div>
              <div style={{fontSize:10, fontWeight:700, color:T.green}}>{fmtPrice(valeurVente)}</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  DÉPENSES JOURNALIÈRES
// ══════════════════════════════════════════════════════════════════
function SectionDepenses({ T, shopId, flashMsg, depenses, depLoading }) {
  const CATS = ["Loyer","Salaires","Électricité","Transport","Achat stock","Maintenance","Autre"];
  const today = new Date().toISOString().slice(0,10);
  const [depLib, setDepLib] = useState("");
  const [depMontant, setDepMontant] = useState("");
  const [depCat, setDepCat] = useState("Autre");
  const [depSaving, setDepSaving] = useState(false);
  const [filterDate, setFilterDate] = useState(today);

  const ajouterDepense = async () => {
    const m = parseInt(depMontant); if(!m||m<=0){flashMsg("Montant invalide");return;}
    if(!depLib.trim()){flashMsg("Libellé requis");return;}
    setDepSaving(true);
    try {
      await db.collection("shops").doc(shopId).collection("depenses").add({
        libelle: depLib.trim(), montant: m, categorie: depCat,
        date: today, timestamp: Date.now()
      });
      setDepLib(""); setDepMontant(""); setDepCat("Autre");
      flashMsg("💸 Dépense enregistrée");
    } catch(e){ flashMsg("Erreur: "+e.message); }
    setDepSaving(false);
  };

  const supprimerDepense = async (id) => {
    if(!confirm("Supprimer cette dépense ?")) return;
    try {
      await db.collection("shops").doc(shopId).collection("depenses").doc(id).delete();
      flashMsg("🗑️ Supprimée");
    } catch(e){ flashMsg("Erreur: "+e.message); }
  };

  const filtered = depenses.filter(d=>d.date===filterDate);
  const totalFiltered = filtered.reduce((a,b)=>a+(b.montant||0),0);
  const bycat = CATS.map(c=>({cat:c, total:filtered.filter(d=>d.categorie===c).reduce((a,b)=>a+(b.montant||0),0)})).filter(x=>x.total>0);

  return (
    <div>
      <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:12}}>
        <div style={{fontSize:12, fontWeight:700, marginBottom:10, color:T.text}}>➕ Nouvelle dépense</div>
        <select value={depCat} onChange={e=>setDepCat(e.target.value)}
          style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:"9px 10px", marginBottom:8, color:T.text, fontSize:12}}>
          {CATS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <input placeholder="Libellé (ex: facture eau, salaire vigile...)" value={depLib} onChange={e=>setDepLib(e.target.value)}
          style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:"9px 10px", marginBottom:8, color:T.text, fontSize:12}} />
        <div style={{display:"flex", gap:8}}>
          <input type="number" min="0" placeholder="Montant (F CFA)" value={depMontant} onChange={e=>setDepMontant(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&ajouterDepense()}
            style={{flex:1, background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:"9px 10px", color:T.text, fontSize:13, fontWeight:600}} />
          <button onClick={ajouterDepense} disabled={depSaving}
            style={{background:T.red, border:"none", borderRadius:10, padding:"9px 16px", fontWeight:700, color:"#fff", fontSize:13, opacity:depSaving?0.6:1}}>
            {depSaving?"...":"💾 Ajouter"}
          </button>
        </div>
      </div>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <div style={{fontSize:12, fontWeight:700, color:T.text}}>Historique</div>
        <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)}
          style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:8, padding:"5px 8px", color:T.text, fontSize:11}} />
      </div>

      {filtered.length>0 && (
        <div style={{background:T.surface, borderRadius:14, padding:12, marginBottom:10}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:bycat.length>0?8:0}}>
            <span style={{fontSize:11, color:T.textMute}}>{filtered.length} dépense(s)</span>
            <span style={{fontSize:20, fontWeight:800, color:T.red}}>{fmtPrice(totalFiltered)}</span>
          </div>
          {bycat.length>1 && (
            <div style={{display:"flex", flexWrap:"wrap", gap:4}}>
              {bycat.map(x=>(
                <span key={x.cat} style={{background:T.surface2, borderRadius:6, padding:"2px 8px", fontSize:9, color:T.textMute}}>
                  {x.cat}: <strong style={{color:T.text}}>{fmtPrice(x.total)}</strong>
                </span>
              ))}
            </div>
          )}
        </div>
      )}

      {depLoading && <div style={{textAlign:"center", padding:20, color:T.textMute, fontSize:11}}>⏳ Chargement...</div>}
      {!depLoading && filtered.length===0 && (
        <div style={{textAlign:"center", padding:40, color:T.textMute, fontSize:12}}>
          <div style={{fontSize:28, marginBottom:8}}>📭</div>
          Aucune dépense ce jour
        </div>
      )}
      {filtered.map(dep=>(
        <div key={dep.id} style={{background:T.surface, borderRadius:14, padding:"10px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10, borderLeft:`3px solid ${T.red}`}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{dep.libelle}</div>
            <div style={{fontSize:10, color:T.textMute}}>
              <span style={{background:T.surface2, borderRadius:5, padding:"1px 6px", marginRight:4}}>{dep.categorie||"Autre"}</span>
              {dep.timestamp && new Date(dep.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
            </div>
          </div>
          <div style={{textAlign:"right", flexShrink:0}}>
            <div style={{fontSize:15, fontWeight:800, color:T.red}}>{fmtPrice(dep.montant)}</div>
            <button onClick={()=>supprimerDepense(dep.id)} style={{background:"none", border:"none", color:T.textMute, fontSize:11, cursor:"pointer", padding:0, marginTop:2}}>🗑️</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  COMMANDES FOURNISSEUR
// ══════════════════════════════════════════════════════════════════
function CommandesFournisseur({ T, products, flashMsg, shopId, updateStock }) {
  const ligneVide = () => ({ id: Date.now() + Math.random(), produitId: "", nom: "", libelle: "", prixUnitaire: 0, quantite: 1, montant: 0 });
  const [lignes, setLignes] = useState([ligneVide()]);
  const [commandes, setCommandes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [view, setView] = useState("new"); // "new" | "history"

  useEffect(() => {
    if (!db || !shopId) { setLoading(false); return; }
    const unsub = db.collection("shops").doc(shopId).collection("commandes_fournisseur")
      .orderBy("createdAt", "desc")
      .onSnapshot(snap => {
        setCommandes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        setLoading(false);
      }, () => setLoading(false));
    return unsub;
  }, [shopId]);

  // ── Calculs ────────────────────────────────────────────────────
  const calculerMontant = (ligne) => Math.round((parseFloat(ligne.prixUnitaire) || 0) * (parseInt(ligne.quantite) || 0));
  const total = lignes.reduce((s, l) => s + calculerMontant(l), 0);

  // ── Mise à jour d'une ligne ────────────────────────────────────
  const updateLigne = (id, field, val) => {
    setLignes(prev => prev.map(l => {
      if (l.id !== id) return l;
      const updated = { ...l, [field]: val };
      // Pré-remplir depuis le produit sélectionné
      if (field === "produitId") {
        const prod = products.find(p => p.id === val);
        if (prod) {
          updated.nom = prod.name;
          updated.libelle = prod.name;
          updated.prixUnitaire = prod.prixAchat || 0;
        } else {
          updated.nom = ""; updated.libelle = ""; updated.prixUnitaire = 0;
        }
      }
      updated.montant = Math.round((parseFloat(updated.prixUnitaire) || 0) * (parseInt(updated.quantite) || 0));
      return updated;
    }));
  };

  const ajouterLigne = () => setLignes(prev => [...prev, ligneVide()]);
  const supprimerLigne = (id) => {
    if (lignes.length === 1) { flashMsg("Au moins une ligne requise"); return; }
    setLignes(prev => prev.filter(l => l.id !== id));
  };

  // ── Enregistrer commande ───────────────────────────────────────
  const enregistrerCommande = async () => {
    const lignesValides = lignes.filter(l => (l.libelle || l.nom).trim() && parseInt(l.quantite) > 0);
    if (lignesValides.length === 0) { flashMsg("⚠️ Ajoutez au moins une ligne valide"); return; }
    setSaving(true);
    try {
      const payload = {
        lignes: lignesValides.map(l => ({
          produitId: l.produitId || null,
          nom: l.nom || l.libelle,
          libelle: l.libelle || l.nom,
          prixUnitaire: parseFloat(l.prixUnitaire) || 0,
          quantite: parseInt(l.quantite) || 0,
          montant: calculerMontant(l)
        })),
        total,
        statut: "en_attente",
        createdAt: Date.now()
      };
      await db.collection("shops").doc(shopId).collection("commandes_fournisseur").add(payload);
      setLignes([ligneVide()]);
      flashMsg("✅ Commande enregistrée !");
      setView("history");
    } catch (e) { flashMsg("❌ Erreur: " + e.message); }
    setSaving(false);
  };

  // ── Marquer comme reçu ────────────────────────────────────────
  const marquerCommeRecu = async (cmd) => {
    if (!window.confirm(`Confirmer la réception de cette commande ?\nLe stock sera mis à jour automatiquement.`)) return;
    try {
      // Mettre à jour stock pour chaque ligne avec produitId connu
      for (const ligne of cmd.lignes) {
        if (ligne.produitId && ligne.quantite > 0) {
          await updateStock(ligne.produitId, parseInt(ligne.quantite), "entree", `Commande fournisseur #${cmd.id.slice(-6)}`);
        }
      }
      await db.collection("shops").doc(shopId).collection("commandes_fournisseur").doc(cmd.id).update({ statut: "recu", recuAt: Date.now() });
      flashMsg("✅ Stock mis à jour — Commande reçue !");
    } catch (e) { flashMsg("❌ Erreur: " + e.message); }
  };

  const supprimerCommande = async (id) => {
    if (!window.confirm("Supprimer cette commande ?")) return;
    try {
      await db.collection("shops").doc(shopId).collection("commandes_fournisseur").doc(id).delete();
      flashMsg("🗑️ Commande supprimée");
    } catch (e) { flashMsg("❌ Erreur: " + e.message); }
  };

  const prodStock = (prodId) => { const p = products.find(x => x.id === prodId); return p ? (p.stock === -1 ? "∞" : p.stock) : null; };

  return (
    <div>
      {/* Toggle New / History */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, background: T.surface2, borderRadius: 12, padding: 4 }}>
        <button onClick={() => setView("new")} style={{ flex: 1, background: view === "new" ? T.accent : "transparent", border: "none", borderRadius: 8, padding: "8px", fontWeight: 700, color: view === "new" ? T.bg : T.textSub, fontSize: 12 }}>➕ Nouvelle commande</button>
        <button onClick={() => setView("history")} style={{ flex: 1, background: view === "history" ? T.accent : "transparent", border: "none", borderRadius: 8, padding: "8px", fontWeight: 700, color: view === "history" ? T.bg : T.textSub, fontSize: 12 }}>📋 Historique ({commandes.length})</button>
      </div>

      {/* ── NOUVELLE COMMANDE ── */}
      {view === "new" && (
        <div>
          <div style={{ background: T.surface, borderRadius: 16, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: T.text }}>🚚 Bon de commande fournisseur</div>

            {lignes.map((ligne, idx) => (
              <div key={ligne.id} style={{ background: T.surface2, borderRadius: 12, padding: 12, marginBottom: 10, border: `1px solid ${T.border}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: T.textMute }}>Ligne {idx + 1}</span>
                  <button onClick={() => supprimerLigne(ligne.id)} style={{ background: T.btnRed.bg, border: "none", borderRadius: 8, width: 28, height: 28, color: T.red, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
                </div>

                {/* Sélecteur produit */}
                <select value={ligne.produitId} onChange={e => updateLigne(ligne.id, "produitId", e.target.value)}
                  style={{ width: "100%", background: T.inputBg, border: `1px solid ${T.inputBd}`, borderRadius: 10, padding: "9px 10px", marginBottom: 8, color: T.text, fontSize: 12 }}>
                  <option value="">— Sélectionner produit (optionnel) —</option>
                  {products.filter(p => p.active !== false).map(p => (
                    <option key={p.id} value={p.id}>{p.name}{p.stock !== undefined && p.stock !== null && p.stock !== -1 ? ` (stock: ${p.stock})` : ""}</option>
                  ))}
                </select>

                {/* Libellé libre */}
                <input placeholder="Libellé / description *" value={ligne.libelle} onChange={e => updateLigne(ligne.id, "libelle", e.target.value)}
                  style={{ width: "100%", background: T.inputBg, border: `1px solid ${T.inputBd}`, borderRadius: 10, padding: "9px 10px", marginBottom: 8, color: T.text, fontSize: 12 }} />

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 6 }}>
                  <div>
                    <div style={{ fontSize: 9, color: T.textMute, marginBottom: 3 }}>Prix unitaire (F)</div>
                    <input type="number" min="0" placeholder="0" value={ligne.prixUnitaire || ""}
                      onChange={e => updateLigne(ligne.id, "prixUnitaire", e.target.value)}
                      style={{ width: "100%", background: T.inputBg, border: `1px solid ${T.inputBd}`, borderRadius: 10, padding: "9px 10px", color: T.text, fontSize: 13, fontWeight: 600 }} />
                  </div>
                  <div>
                    <div style={{ fontSize: 9, color: T.textMute, marginBottom: 3 }}>Quantité</div>
                    <input type="number" min="1" placeholder="1" value={ligne.quantite || ""}
                      onChange={e => updateLigne(ligne.id, "quantite", e.target.value)}
                      style={{ width: "100%", background: T.inputBg, border: `1px solid ${T.inputBd}`, borderRadius: 10, padding: "9px 10px", color: T.text, fontSize: 13, fontWeight: 600 }} />
                  </div>
                </div>

                {/* Montant calculé */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.bg, borderRadius: 8, padding: "7px 12px" }}>
                  <span style={{ fontSize: 11, color: T.textMute }}>Montant</span>
                  <span style={{ fontWeight: 800, fontSize: 15, color: calculerMontant(ligne) > 0 ? T.accent : T.textMute }}>{fmtPrice(calculerMontant(ligne))}</span>
                </div>
              </div>
            ))}

            {/* Bouton ajouter ligne */}
            <button onClick={ajouterLigne} style={{ width: "100%", background: T.btnBlue.bg, border: `1px dashed ${T.blue}`, borderRadius: 12, padding: 12, color: T.blue, fontWeight: 700, fontSize: 13, marginBottom: 12 }}>➕ Ajouter une ligne</button>

            {/* Total */}
            <div style={{ background: total > 0 ? T.btnGreen.bg : T.surface2, border: `2px solid ${total > 0 ? T.green : T.border}`, borderRadius: 14, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 14 }}>TOTAL COMMANDE</span>
              <span style={{ fontSize: 22, fontWeight: 800, color: total > 0 ? T.green : T.textMute }}>{fmtPrice(total)}</span>
            </div>

            {/* Bouton enregistrer */}
            <button onClick={enregistrerCommande} disabled={saving || total === 0}
              style={{ width: "100%", background: total > 0 ? T.accent : T.surface2, border: "none", borderRadius: 14, padding: "14px", fontWeight: 800, fontSize: 14, color: total > 0 ? T.bg : T.textMute, opacity: saving ? 0.7 : 1 }}>
              {saving ? "⏳ Enregistrement..." : "💾 Enregistrer la commande"}
            </button>
          </div>
        </div>
      )}

      {/* ── HISTORIQUE ── */}
      {view === "history" && (
        <div>
          {loading && <div className="spin" style={{ width: 28, height: 28, border: `2px solid ${T.border}`, borderTopColor: T.accent, borderRadius: "50%", margin: "20px auto" }}></div>}
          {!loading && commandes.length === 0 && (
            <div style={{ textAlign: "center", padding: 40, color: T.textMute, fontSize: 12 }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>📭</div>
              Aucune commande enregistrée
            </div>
          )}
          {commandes.map(cmd => {
            const recu = cmd.statut === "recu";
            const borderColor = recu ? T.green : T.orange;
            const d = new Date(cmd.createdAt);
            const dateStr = `${d.getDate().toString().padStart(2,"0")}/${(d.getMonth()+1).toString().padStart(2,"0")}/${d.getFullYear()}`;
            return (
              <div key={cmd.id} style={{ background: T.surface, borderRadius: 16, padding: 14, marginBottom: 12, borderLeft: `4px solid ${borderColor}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                  <div>
                    <div style={{ fontSize: 11, color: T.textMute }}>#{cmd.id.slice(-6).toUpperCase()} · {dateStr}</div>
                    <div style={{ fontWeight: 800, fontSize: 18, color: T.accent }}>{fmtPrice(cmd.total)}</div>
                    <div style={{ fontSize: 11, marginTop: 2 }}>
                      <span style={{ background: recu ? T.btnGreen.bg : T.btnRed.bg, color: recu ? T.green : T.orange, borderRadius: 6, padding: "2px 8px", fontWeight: 600 }}>
                        {recu ? "✅ REÇUE" : "⏳ EN ATTENTE"}
                      </span>
                    </div>
                  </div>
                  <button onClick={() => supprimerCommande(cmd.id)} style={{ background: T.btnRed.bg, border: "none", borderRadius: 8, padding: "5px 9px", color: T.red, fontSize: 14 }}>🗑️</button>
                </div>

                {/* Lignes */}
                {(cmd.lignes || []).map((l, i) => (
                  <div key={i} style={{ background: T.surface2, borderRadius: 8, padding: "7px 10px", marginBottom: 5, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.libelle || l.nom}</div>
                      <div style={{ fontSize: 10, color: T.textMute }}>{fmtPrice(l.prixUnitaire)} × {l.quantite}
                        {l.produitId && <span style={{ marginLeft: 6, color: T.blue }}>({(() => { const s = prodStock(l.produitId); return s !== null ? `stock actuel: ${s}` : ""; })()})</span>}
                      </div>
                    </div>
                    <span style={{ fontWeight: 700, fontSize: 13, marginLeft: 10, flexShrink: 0 }}>{fmtPrice(l.montant)}</span>
                  </div>
                ))}

                {/* Bouton réception */}
                {!recu && (
                  <button onClick={() => marquerCommeRecu(cmd)}
                    style={{ marginTop: 10, width: "100%", background: T.green, border: "none", borderRadius: 12, padding: "11px", fontWeight: 700, color: T.bg, fontSize: 13 }}>
                    📦 Marquer comme REÇUE → Mettre à jour le stock
                  </button>
                )}
                {recu && cmd.recuAt && (
                  <div style={{ marginTop: 8, fontSize: 10, color: T.textMute, textAlign: "center" }}>
                    ✅ Reçue le {new Date(cmd.recuAt).toLocaleDateString("fr-FR")}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  SECTION ANALYTICS — Historique CA
// ══════════════════════════════════════════════════════════════════
function SectionAnalytics({ T, sales, depenses, hasBeneficeData, today, top5, statsByCaissier, setTab }) {
  const [periode, setPeriode] = useState(7);
  const [expandedDay, setExpandedDay] = useState(null);

  const jours = Array.from({length:periode},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(periode-1-i));
    return d.toISOString().slice(0,10);
  });

  const JOURS_FR = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const nomJour = (dateStr) => { const d = new Date(dateStr+"T12:00:00"); return JOURS_FR[d.getDay()]; };
  const formatDate = (dateStr) => { const [y,m,j]=dateStr.split("-"); return `${j}/${m}`; };

  const rowData = jours.map(date => {
    const ventesJour = (sales||[]).filter(s=>s.date===date&&!s.cancelled);
    const annulJour  = (sales||[]).filter(s=>s.date===date&&s.cancelled);
    const ca         = ventesJour.reduce((a,s)=>a+(s.total||0),0);
    const marge      = ventesJour.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+((it.amount||0)-(it.prixAchat||0))*(it.qty||1),0),0);
    const dep        = (depenses||[]).filter(d=>d.date===date).reduce((a,d)=>a+(d.montant||0),0);
    const benef      = hasBeneficeData ? marge - dep : null;
    return { date, ca, marge:hasBeneficeData?marge:null, dep, benef, nbVentes:ventesJour.length, nbAnnul:annulJour.length, ventes:ventesJour };
  });

  const totalCA    = rowData.reduce((a,r)=>a+r.ca,0);
  const totalMarge = hasBeneficeData ? rowData.reduce((a,r)=>a+(r.marge||0),0) : null;
  const totalDep   = rowData.reduce((a,r)=>a+r.dep,0);
  const totalBenef = hasBeneficeData ? rowData.reduce((a,r)=>a+(r.benef||0),0) : null;
  const bestDay    = [...rowData].sort((a,b)=>b.ca-a.ca)[0];
  const maxCA      = Math.max(...rowData.map(r=>r.ca), 1);

  return (
    <div>
      {/* Toggle période */}
      <div style={{display:"flex", gap:6, marginBottom:12, background:T.surface2, borderRadius:12, padding:3}}>
        {[7,14,30].map(p=>(
          <button key={p} onClick={()=>setPeriode(p)}
            style={{flex:1, background:periode===p?T.accent:"transparent", border:"none", borderRadius:8, padding:"7px", fontWeight:700, fontSize:12, color:periode===p?T.bg:T.textMute}}>
            {p} jours
          </button>
        ))}
      </div>

      {/* Cartes synthèse */}
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12}}>
        <div style={{background:T.surface, borderRadius:14, padding:12, gridColumn:"span 2", border:`1px solid ${T.accent}33`}}>
          <div style={{fontSize:10, color:T.textMute, marginBottom:2}}>CA total · {periode} jours</div>
          <div style={{fontSize:26, fontWeight:800, color:T.accent}}>{fmtPrice(totalCA)}</div>
          {bestDay&&bestDay.ca>0&&<div style={{fontSize:9, color:T.textMute, marginTop:2}}>🏆 Meilleur jour : {nomJour(bestDay.date)} {formatDate(bestDay.date)} — {fmtPrice(bestDay.ca)}</div>}
        </div>
        {hasBeneficeData&&(
          <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.green}33`}}>
            <div style={{fontSize:10, color:T.textMute}}>Marge brute</div>
            <div style={{fontSize:18, fontWeight:800, color:T.green}}>{fmtPrice(totalMarge)}</div>
          </div>
        )}
        <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.red}33`}}>
          <div style={{fontSize:10, color:T.textMute}}>Dépenses</div>
          <div style={{fontSize:18, fontWeight:800, color:T.red}}>{fmtPrice(totalDep)}</div>
        </div>
        {hasBeneficeData&&(
          <div style={{background:T.surface, borderRadius:14, padding:12, border:`1px solid ${totalBenef>=0?T.accent:T.red}44`, gridColumn:"span 2"}}>
            <div style={{fontSize:10, color:T.textMute}}>Bénéfice net période</div>
            <div style={{fontSize:22, fontWeight:800, color:totalBenef>=0?T.accent:T.red}}>{fmtPrice(totalBenef)}</div>
            <div style={{fontSize:9, color:T.textMute}}>Marge {fmtPrice(totalMarge)} − Dépenses {fmtPrice(totalDep)}</div>
          </div>
        )}
      </div>

      {/* Graphique */}
      <div style={{background:T.surface, borderRadius:16, padding:"14px 12px 8px", marginBottom:12}}>
        <div style={{fontSize:12, fontWeight:700, marginBottom:10, color:T.text}}>📈 Évolution CA</div>
        <div style={{display:"flex", alignItems:"flex-end", gap:periode>14?2:4, height:90, marginBottom:4}}>
          {rowData.map((r,i)=>{
            const barH = Math.max(r.ca>0?6:2, Math.round((r.ca/maxCA)*80));
            const isToday = r.date===today;
            const isBest  = bestDay&&r.date===bestDay.date&&r.ca>0;
            return (
              <div key={i} onClick={()=>setExpandedDay(expandedDay===r.date?null:r.date)}
                style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2, cursor:"pointer"}}>
                {r.ca>0&&periode<=14&&<div style={{fontSize:7, color:T.textMute, whiteSpace:"nowrap"}}>{Math.round(r.ca/1000)}k</div>}
                <div style={{width:"100%", height:barH, background:isBest?T.accent:isToday?T.green:T.surface2, borderRadius:"4px 4px 0 0", border:isToday?`1px solid ${T.green}`:"none"}}/>
                <div style={{fontSize:7, color:isToday?T.green:T.textMute, fontWeight:isToday?700:400}}>{formatDate(r.date)}</div>
              </div>
            );
          })}
        </div>
        <div style={{fontSize:9, color:T.textMute, textAlign:"center"}}>Appuyez sur une barre pour le détail</div>
      </div>

      {/* Tableau journalier */}
      <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:12}}>
        <div style={{fontSize:12, fontWeight:700, marginBottom:10, color:T.text}}>📅 Détail par jour</div>
        <div style={{display:"grid", gridTemplateColumns:"48px 1fr 1fr"+(hasBeneficeData?" 1fr":""), gap:4, padding:"0 4px", marginBottom:6}}>
          {["Jour","CA","Dép.",...(hasBeneficeData?["Bén."]:[])]
            .map((h,i)=><div key={h} style={{fontSize:9, fontWeight:700, color:T.textMute, textAlign:i===0?"left":"right"}}>{h}</div>)}
        </div>
        {[...rowData].reverse().map(r=>{
          const isToday = r.date===today;
          const isBest  = bestDay&&r.date===bestDay.date&&r.ca>0;
          const isNeg   = r.benef!==null&&r.benef<0;
          const isOpen  = expandedDay===r.date;
          return (
            <div key={r.date}>
              <div onClick={()=>setExpandedDay(isOpen?null:r.date)}
                style={{display:"grid", gridTemplateColumns:"48px 1fr 1fr"+(hasBeneficeData?" 1fr":""), gap:4, padding:"9px 4px",
                  borderBottom:`1px solid ${T.border}`, background:isOpen?T.surface2:"transparent",
                  borderRadius:isOpen?"8px 8px 0 0":"0", cursor:"pointer",
                  borderLeft:isToday?`3px solid ${T.green}`:isBest?`3px solid ${T.accent}`:"3px solid transparent"}}>
                <div>
                  <div style={{fontSize:11, fontWeight:isToday?800:600, color:isToday?T.green:T.text}}>{nomJour(r.date)}</div>
                  <div style={{fontSize:9, color:T.textMute}}>{formatDate(r.date)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:12, fontWeight:700, color:r.ca>0?T.text:T.textMute}}>{r.ca>0?fmtPrice(r.ca):"—"}</div>
                  <div style={{fontSize:9, color:T.textMute}}>{r.nbVentes} vte{r.nbVentes!==1?"s":""}{r.nbAnnul>0?` · ${r.nbAnnul}❌`:""}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:12, fontWeight:700, color:r.dep>0?T.red:T.textMute}}>{r.dep>0?fmtPrice(r.dep):"—"}</div>
                </div>
                {hasBeneficeData&&(
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12, fontWeight:800, color:r.benef===null?T.textMute:r.benef>=0?T.accent:T.red}}>
                      {r.benef===null?"—":fmtPrice(r.benef)}
                    </div>
                    {isNeg&&<div style={{fontSize:8, color:T.red}}>déficit</div>}
                  </div>
                )}
              </div>
              {isOpen&&(
                <div style={{background:T.surface2, borderRadius:"0 0 8px 8px", padding:"8px 10px", marginBottom:4}}>
                  {r.ventes.length===0&&<div style={{fontSize:11, color:T.textMute}}>Aucune vente ce jour</div>}
                  {r.ventes.slice(0,5).map((v,i)=>(
                    <div key={v.id} style={{display:"flex", justifyContent:"space-between", fontSize:11, padding:"3px 0", borderBottom:i<Math.min(r.ventes.length,5)-1?`1px solid ${T.border}`:"none"}}>
                      <span style={{color:T.textMute}}>{v.timestamp?new Date(v.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""}{v.caissier?` · ${v.caissier}`:""}</span>
                      <span style={{fontWeight:700}}>{fmtPrice(v.total)}</span>
                    </div>
                  ))}
                  {r.ventes.length>5&&<div style={{fontSize:9, color:T.textMute, paddingTop:3}}>+{r.ventes.length-5} autre(s)</div>}
                  {(depenses||[]).filter(d=>d.date===r.date).length>0&&(
                    <div style={{marginTop:6, paddingTop:6, borderTop:`1px solid ${T.border}`}}>
                      {(depenses||[]).filter(d=>d.date===r.date).map(d=>(
                        <div key={d.id} style={{display:"flex", justifyContent:"space-between", fontSize:11, padding:"2px 0"}}>
                          <span style={{color:T.red}}>💸 {d.libelle}</span>
                          <span style={{color:T.red, fontWeight:600}}>−{fmtPrice(d.montant)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {/* Totaux */}
        <div style={{display:"grid", gridTemplateColumns:"48px 1fr 1fr"+(hasBeneficeData?" 1fr":""), gap:4, padding:"10px 4px 0", marginTop:4, borderTop:`2px solid ${T.accent}44`}}>
          <div style={{fontSize:10, fontWeight:800, color:T.textMute}}>TOTAL</div>
          <div style={{textAlign:"right", fontSize:12, fontWeight:800, color:T.accent}}>{fmtPrice(totalCA)}</div>
          <div style={{textAlign:"right", fontSize:12, fontWeight:800, color:T.red}}>{totalDep>0?fmtPrice(totalDep):"—"}</div>
          {hasBeneficeData&&<div style={{textAlign:"right", fontSize:12, fontWeight:800, color:totalBenef>=0?T.green:T.red}}>{fmtPrice(totalBenef)}</div>}
        </div>
      </div>

      {/* Top 5 */}
      <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12}}>
        <div style={{fontSize:13, fontWeight:700, marginBottom:10}}>🏆 Top 5 produits (toutes périodes)</div>
        {top5.length===0 ? <div style={{color:T.textMute, fontSize:12}}>Aucune donnée</div> :
          top5.map(([name,count],i)=>(
            <div key={name} style={{display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:`1px solid ${T.border}`, alignItems:"center"}}>
              <div style={{display:"flex", gap:8, alignItems:"center"}}><span style={{fontSize:18}}>{"🥇🥈🥉4️⃣5️⃣".split("").slice(i*2,(i+1)*2).join("")}</span><span style={{fontSize:13}}>{name}</span></div>
              <span style={{fontWeight:700, color:T.accent}}>{count} vendu(s)</span>
            </div>
          ))
        }
      </div>

      {/* CA caissiers */}
      <div style={{background:T.surface, borderRadius:16, padding:16}}>
        <div style={{fontSize:13, fontWeight:700, marginBottom:10}}>📊 CA par caissier (global)</div>
        {statsByCaissier().length===0 ? <div style={{color:T.textMute, fontSize:12}}>Aucune donnée caissier</div> :
          statsByCaissier().map(([name,ca])=>(
            <div key={name} style={{display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:`1px solid ${T.border}`}}>
              <span style={{fontSize:13}}>👤 {name}</span><span style={{fontWeight:700, color:T.green}}>{fmtPrice(ca)}</span>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  SECTION VENTES — Jour / Semaine / Mois
// ══════════════════════════════════════════════════════════════════
function SectionVentes({ T, sales, hasBeneficeData }) {
  const [periode, setPeriode] = useState("jour");
  const [expandedDate, setExpandedDate] = useState(null);

  const JOURS_FR = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const MOIS_FR  = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];

  const today = new Date().toISOString().slice(0,10);
  const nowTs = Date.now();

  // ── Calcul plage ────────────────────────────────────────────────
  const getRange = () => {
    const d = new Date();
    if (periode === "jour") {
      return [today, today];
    } else if (periode === "semaine") {
      const start = new Date(d); start.setDate(d.getDate() - 6);
      return [start.toISOString().slice(0,10), today];
    } else {
      const start = new Date(d); start.setDate(d.getDate() - 29);
      return [start.toISOString().slice(0,10), today];
    }
  };
  const [dateMin, dateMax] = getRange();

  const salesInRange = (sales||[]).filter(s => s.date >= dateMin && s.date <= dateMax);
  const ventesOK     = salesInRange.filter(s => !s.cancelled);
  const ventesAnnul  = salesInRange.filter(s => s.cancelled);

  // ── Totaux période ───────────────────────────────────────────────
  const totalCA    = ventesOK.reduce((a,s)=>a+(s.total||0),0);
  const totalMarge = ventesOK.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+((it.amount||0)-(it.prixAchat||0))*(it.qty||1),0),0);

  // ── Stats par jour (pour graphique) ──────────────────────────────
  const nbJours = periode==="jour" ? 1 : periode==="semaine" ? 7 : 30;
  const joursRange = Array.from({length:nbJours},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(nbJours-1-i));
    return d.toISOString().slice(0,10);
  });
  const statsByDay = joursRange.map(date=>{
    const v = (sales||[]).filter(s=>s.date===date&&!s.cancelled);
    const ca = v.reduce((a,s)=>a+(s.total||0),0);
    const mg = v.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+((it.amount||0)-(it.prixAchat||0))*(it.qty||1),0),0);
    return {date, ca, mg};
  });
  const maxCA2 = Math.max(...statsByDay.map(r=>r.ca),1);
  const MOIS_FR2 = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  const fmt2 = (ds) => { const [,m,j]=ds.split("-"); return `${j}/${m}`; };

  // ── Groupement par date ──────────────────────────────────────────
  const grouped = {};
  salesInRange.forEach(s => {
    if (!grouped[s.date]) grouped[s.date] = [];
    grouped[s.date].push(s);
  });
  const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a));

  const labelDate = (dateStr) => {
    const d = new Date(dateStr + "T12:00:00");
    const j = JOURS_FR[d.getDay()];
    const m = MOIS_FR[d.getMonth()];
    if (dateStr === today) return "Aujourd'hui";
    const hier = new Date(); hier.setDate(hier.getDate()-1);
    if (dateStr === hier.toISOString().slice(0,10)) return "Hier";
    return `${j} ${d.getDate()} ${m}`;
  };

  // ── Carte vente individuelle ─────────────────────────────────────
  const SaleRow = ({ s }) => {
    const heure = s.timestamp ? new Date(s.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "--:--";
    return (
      <div style={{padding:"9px 10px", borderBottom:`1px solid ${T.border}`,
        background:s.cancelled?T.red+"11":"transparent",
        borderLeft:s.cancelled?`3px solid ${T.red}`:`3px solid ${T.green}`}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
              <span style={{fontSize:12, fontWeight:700, color:s.cancelled?T.red:T.text}}>{heure}</span>
              {s.caissier && <span style={{fontSize:10, color:T.textMute}}>👤 {s.caissier}</span>}
              {s.cancelled && <span style={{fontSize:9, background:T.red+"22", color:T.red, borderRadius:5, padding:"1px 6px", fontWeight:700}}>ANNULÉE</span>}
            </div>
            {(s.items||[]).slice(0,2).map((it,i)=>(
              <div key={i} style={{fontSize:10, color:T.textMute, marginTop:1}}>
                · {it.label} ×{it.qty||1}
              </div>
            ))}
            {(s.items||[]).length > 2 && <div style={{fontSize:10, color:T.textMute}}>+{(s.items||[]).length-2} autre(s)</div>}
            {s.cancelled && s.cancelRaison && <div style={{fontSize:10, color:T.red, fontStyle:"italic", marginTop:2}}>Motif : {s.cancelRaison}</div>}
            {s.note && <div style={{fontSize:9, color:T.blue, fontStyle:"italic", marginTop:2}}>📝 {s.note}</div>}
          </div>
          <div style={{flexShrink:0, textAlign:"right", marginLeft:8, display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4}}>
            <div style={{fontSize:14, fontWeight:800, color:s.cancelled?T.red:T.accent}}>{fmtPrice(s.total)}</div>
            <div style={{fontSize:9, color:T.textMute}}>{(s.items||[]).reduce((a,i)=>a+(i.qty||1),0)} art.</div>
            {!s.cancelled && (<>
              <button onClick={()=>generateTicketPDF(shopName, null, s, null)} style={{background:T.btnBlue.bg, border:`1px solid ${T.blue}44`, borderRadius:6, padding:"2px 7px", fontSize:9, color:T.blue, fontWeight:600}}>📄 PDF</button>
              <button onClick={()=>shareTicketWhatsApp(shopName, s)} style={{background:"#25D36622", border:"1px solid #25D36644", borderRadius:6, padding:"2px 7px", fontSize:9, color:"#25D366", fontWeight:600}}>💬 WA</button>
            </>)}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%"}}>
      {/* Toggle période */}
      <div style={{display:"flex", gap:6, marginBottom:12, background:T.surface2, borderRadius:12, padding:3, flexShrink:0}}>
        {[["jour","Aujourd'hui"],["semaine","7 jours"],["mois","30 jours"]].map(([k,l])=>(
          <button key={k} onClick={()=>{setPeriode(k); setExpandedDate(null);}}
            style={{flex:1, background:periode===k?T.accent:"transparent", border:"none", borderRadius:8, padding:"7px 4px", fontWeight:700, fontSize:11, color:periode===k?T.bg:T.textMute}}>
            {l}
          </button>
        ))}
      </div>

      {/* Carte résumé période */}
      <div style={{background:T.surface, borderRadius:14, padding:"10px 14px", marginBottom:12, flexShrink:0}}>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr"+(hasBeneficeData?" 1fr":""), gap:8}}>
          <div>
            <div style={{fontSize:9, color:T.textMute}}>CA</div>
            <div style={{fontSize:16, fontWeight:800, color:T.accent}}>{fmtPrice(totalCA)}</div>
          </div>
          <div>
            <div style={{fontSize:9, color:T.textMute}}>Ventes</div>
            <div style={{fontSize:16, fontWeight:800, color:T.green}}>{ventesOK.length}</div>
          </div>
          <div>
            <div style={{fontSize:9, color:T.textMute}}>Annul.</div>
            <div style={{fontSize:16, fontWeight:800, color:ventesAnnul.length>0?T.red:T.textMute}}>{ventesAnnul.length}</div>
          </div>
          {hasBeneficeData && (
            <div>
              <div style={{fontSize:9, color:T.textMute}}>Marge</div>
              <div style={{fontSize:16, fontWeight:800, color:totalMarge>=0?T.green:T.red}}>{fmtPrice(totalMarge)}</div>
            </div>
          )}
        </div>
      </div>

      {/* Graphique CA + Marge (semaine et mois) */}
      {periode !== "jour" && (
        <div style={{background:T.surface, borderRadius:14, padding:"12px 10px 8px", marginBottom:12, flexShrink:0}}>
          <div style={{fontSize:11, fontWeight:700, color:T.text, marginBottom:8}}>
            📊 CA {hasBeneficeData ? "& Marge" : ""} — {periode==="semaine"?"7 jours":"30 jours"}
          </div>
          <div style={{display:"flex", alignItems:"flex-end", gap:periode==="mois"?2:5, height:80, marginBottom:4}}>
            {statsByDay.map((r,i)=>{
              const barCA = Math.max(r.ca>0?4:1, Math.round((r.ca/maxCA2)*70));
              const barMg = hasBeneficeData && r.mg>0 ? Math.max(2, Math.round((r.mg/maxCA2)*70)) : 0;
              const isToday = r.date===today;
              return (
                <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:1}}>
                  {r.ca>0 && periode==="semaine" && (
                    <div style={{fontSize:7, color:T.textMute, whiteSpace:"nowrap"}}>{Math.round(r.ca/1000)}k</div>
                  )}
                  <div style={{width:"100%", position:"relative", height:70, display:"flex", flexDirection:"column", justifyContent:"flex-end", gap:1}}>
                    {/* Barre CA */}
                    <div style={{width:"100%", height:barCA, background:isToday?T.accent:T.blue+"99", borderRadius:"3px 3px 0 0"}}/>
                    {/* Barre Marge superposée */}
                    {barMg>0 && (
                      <div style={{position:"absolute", bottom:0, left:"25%", width:"50%", height:barMg, background:T.green+"cc", borderRadius:"3px 3px 0 0"}}/>
                    )}
                  </div>
                  <div style={{fontSize:7, color:isToday?T.accent:T.textMute, fontWeight:isToday?700:400}}>{fmt2(r.date)}</div>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex", gap:12, justifyContent:"center", marginTop:4}}>
            <div style={{display:"flex", alignItems:"center", gap:4}}>
              <div style={{width:10, height:10, background:T.blue+"99", borderRadius:2}}/>
              <span style={{fontSize:9, color:T.textMute}}>CA</span>
            </div>
            {hasBeneficeData && (
              <div style={{display:"flex", alignItems:"center", gap:4}}>
                <div style={{width:10, height:10, background:T.green+"cc", borderRadius:2}}/>
                <span style={{fontSize:9, color:T.textMute}}>Marge</span>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Liste groupée par date */}
      <div style={{overflowY:"auto", flex:1, WebkitOverflowScrolling:"touch", paddingBottom:24}}>
        {dates.length === 0 && (
          <div style={{textAlign:"center", padding:50, color:T.textMute}}>
            <div style={{fontSize:32, marginBottom:8}}>🧾</div>
            <div style={{fontSize:13}}>Aucune vente sur cette période</div>
          </div>
        )}

        {/* Vue "jour" — pas de groupement, flat list */}
        {periode === "jour" && dates.length > 0 && (
          <div style={{background:T.surface, borderRadius:14, overflow:"hidden"}}>
            {[...(grouped[today]||[])].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(s=>(
              <SaleRow key={s.id} s={s} />
            ))}
          </div>
        )}

        {/* Vue semaine / mois — groupé par date */}
        {periode !== "jour" && dates.map(date => {
          const ventesDate = [...(grouped[date]||[])].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
          const caDate     = ventesDate.filter(s=>!s.cancelled).reduce((a,s)=>a+(s.total||0),0);
          const margeDate  = ventesDate.filter(s=>!s.cancelled).reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+((it.amount||0)-(it.prixAchat||0))*(it.qty||1),0),0);
          const nbOK       = ventesDate.filter(s=>!s.cancelled).length;
          const nbAnnul    = ventesDate.filter(s=>s.cancelled).length;
          const isOpen     = expandedDate === date || periode === "semaine";
          const isToday    = date === today;

          return (
            <div key={date} style={{marginBottom:8}}>
              {/* En-tête groupe */}
              <div onClick={()=>setExpandedDate(isOpen&&periode!=="semaine"?null:date)}
                style={{background:isToday?T.accent+"22":T.surface, borderRadius:isOpen?"12px 12px 0 0":12,
                  padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"center",
                  cursor:periode==="mois"?"pointer":"default",
                  borderLeft:`4px solid ${isToday?T.accent:T.surface2}`}}>
                <div>
                  <div style={{fontSize:12, fontWeight:800, color:isToday?T.accent:T.text}}>{labelDate(date)}</div>
                  <div style={{fontSize:10, color:T.textMute}}>
                    {nbOK} vente{nbOK!==1?"s":""}
                    {nbAnnul>0?` · ${nbAnnul} annul.`:""}
                  </div>
                </div>
                <div style={{display:"flex", alignItems:"center", gap:8}}>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:15, fontWeight:800, color:caDate>0?T.accent:T.textMute}}>{fmtPrice(caDate)}</div>
                    {hasBeneficeData && caDate>0 && <div style={{fontSize:9, color:T.green}}>+{fmtPrice(margeDate)} marge</div>}
                  </div>
                  {periode==="mois" && <span style={{color:T.textMute, fontSize:12}}>{isOpen?"▲":"▼"}</span>}
                </div>
              </div>

              {/* Ventes du groupe */}
              {isOpen && (
                <div style={{background:T.surface, borderRadius:"0 0 12px 12px", overflow:"hidden", borderTop:`1px solid ${T.border}`}}>
                  {ventesDate.map(s=><SaleRow key={s.id} s={s}/>)}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  GÉRANT CONTENT — Stats + Stock (sans PIN)
// ══════════════════════════════════════════════════════════════════
function GerantContent({ T, products, sales, flashMsg, shopId, stockMovements, updateStock, shopName, commandes, addCommande, payCommande, shopPhone, shopAddress, shopSlogan, shopLogo, useBLE, ticketFormat, nbCopies, ticketFooter }) {
  const [tab, setTab] = useState("stats");

  // ── Stats du jour ──────────────────────────────────────────────
  const today = new Date().toISOString().slice(0,10);
  const todaySales = (sales||[]).filter(s=>s.date===today);
  const caToday = todaySales.filter(s=>!s.cancelled).reduce((a,b)=>a+(b.total||0),0);
  const lowStock = products.filter(p=>p.stock!==undefined&&p.stock!==null&&p.stock!==-1&&p.stock<=5).length;
  const beneficeToday = todaySales.filter(s=>!s.cancelled).reduce((tot,sale)=>tot+(sale.items||[]).reduce((sub,item)=>{ if(!item.productId)return sub; const prod=products.find(p=>p.id===item.productId); if(!prod||!prod.prixAchat)return sub; return sub+(item.amount-prod.prixAchat)*(item.qty||1); },0),0);
  const hasBeneficeData = products.some(p=>p.prixAchat>0);

  // Valorisation stock
  const prodsAvecStock = products.filter(p=>p.active!==false&&p.stock!==undefined&&p.stock!==null&&p.stock!==-1&&p.stock>0);
  const valeurAchat = prodsAvecStock.reduce((a,p)=>a+((p.prixAchat||0)*p.stock),0);
  const valeurVente = prodsAvecStock.reduce((a,p)=>a+((p.price||0)*p.stock),0);

  // 7 derniers jours
  const last7 = Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
  const chartData = last7.map(date=>({ label: date.slice(5).replace("-","/"), v: (sales||[]).filter(s=>s.date===date&&!s.cancelled).reduce((a,b)=>a+(b.total||0),0) }));
  const maxV = Math.max(...chartData.map(c=>c.v), 1);

  // Top 5 produits
  const prodCount = {};
  (sales||[]).filter(s=>!s.cancelled).forEach(s=>(s.items||[]).forEach(it=>{ if(it.label){ prodCount[it.label]=(prodCount[it.label]||0)+(it.qty||1); } }));
  const top5 = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const TABS = [["stats","📊 Stats"],["stock","📋 Stock"],["reappro","🔄 Réappro"],["valorisation","💰 Valeur stock"],["commandes","📝 Commandes"]];

  return (
    <div style={{flex:1, overflowY:"auto", padding:12}}>
      {/* Badge mode gérant */}
      <div style={{background:T.btnGreen.bg, border:`1px solid ${T.green}44`, borderRadius:12, padding:"8px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:8}}>
        <span style={{fontSize:16}}>📋</span>
        <div>
          <div style={{fontWeight:700, fontSize:13, color:T.green}}>Mode Gérant</div>
          <div style={{fontSize:10, color:T.textMute}}>Stats & gestion de stock — accès sans PIN</div>
        </div>
      </div>

      {/* Onglets */}

            <div style={{background:T.surface, borderRadius:16, padding:14}}>
              <div style={{fontSize:11, color:T.textMute}}>Annulations</div>

            <div style={{display:"flex", alignItems:"flex-end", gap:5, height:72}}>

            <div style={{background:T.surface, borderRadius:14, padding:12}}>
              <div style={{fontSize:11, fontWeight:700, marginBottom:8}}>🏆 Top produits</div>
              {top5.map(([label, count], i)=>(
                <div key={label} style={{display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:i<top5.length-1?`1px solid ${T.border}`:"none"}}>
                  <span style={{fontSize:12}}>{i+1}. {label}</span>
                  <span style={{fontSize:12, fontWeight:700, color:T.accent}}>{count} vente{count>1?"s":""}</span>
                </div>
              ))}
            </div>

        </div>
      )}

      {/* ── STOCK ── */}
      {tab==="stock" && (
        <div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12, fontWeight:600, marginBottom:8}}>📦 Niveaux de stock</div>
            {products.filter(p=>p.active!==false).map(p=>(
              <div key={p.id} style={{background:T.surface, borderRadius:12, padding:12, marginBottom:8}}>
                <div style={{display:"flex", justifyContent:"space-between"}}><span style={{fontWeight:600}}>{p.name}</span><span style={{color:T.textMute, fontSize:12}}>{fmtPrice(p.price)}</span></div>
                <div style={{marginTop:6, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                  <span style={{fontSize:12, color:p.stock===undefined||p.stock===null||p.stock===-1?T.textMute:(p.stock<=5?T.red:p.stock<=10?T.orange:T.green)}}>
                    {p.stock===undefined||p.stock===null||p.stock===-1?"♾️ Illimité":`Stock: ${p.stock}`}
                  </span>
                  {p.stock!==undefined&&p.stock!==null&&p.stock!==-1&&(
                    <button onClick={()=>{const q=prompt("Quantité (positif=ajout, négatif=retrait):"); if(q){const n=parseInt(q); if(n!==0) updateStock(p.id, n, n>0?"entree":"sortie", "Ajustement gérant");}}} style={{background:T.btnGreen.bg, border:"none", borderRadius:8, padding:"4px 10px", fontSize:10, color:T.green}}>Ajuster</button>
                  )}
                </div>
              </div>
            ))}
          </div>
          <div>
            <div style={{fontSize:12, fontWeight:600, marginBottom:8}}>📋 Mouvements récents</div>
            {stockMovements.slice(0,15).map(m=>(
              <div key={m.id} style={{background:T.surface2, borderRadius:8, padding:8, marginBottom:6, fontSize:11}}>
                <div style={{display:"flex", justifyContent:"space-between"}}><span>{m.productName}</span><span style={{color:m.type==="entree"?T.green:T.red}}>{m.type==="entree"?`+${m.quantity}`:`-${Math.abs(m.quantity)}`}</span></div>
                <div style={{fontSize:9, color:T.textMute}}>{m.reason} · {new Date(m.timestamp).toLocaleTimeString()}</div>
              </div>
            ))}
            {stockMovements.length===0 && <div style={{textAlign:"center", padding:24, color:T.textMute, fontSize:11}}>Aucun mouvement</div>}
          </div>
        </div>
      )}

      {/* ── RÉAPPRO ── */}
      {tab==="reappro" && (
        <div>
          <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:700, marginBottom:4}}>🔄 Produits à réapprovisionner</div>
            <div style={{fontSize:11, color:T.textMute, marginBottom:12}}>Stock ≤ 5 unités</div>
            {products.filter(p=>p.stock!==undefined&&p.stock!==null&&p.stock!==-1&&p.stock<=5).length===0
              ? <div style={{color:T.green, fontSize:12}}>✅ Tous les stocks sont OK</div>
              : products.filter(p=>p.stock!==undefined&&p.stock!==null&&p.stock!==-1&&p.stock<=5).map(p=>(
                  <div key={p.id} style={{background:T.surface2, borderRadius:12, padding:12, marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600}}>{p.name}</div>
                      <div style={{fontSize:11, color:p.stock<=0?T.red:T.orange}}>Stock actuel: <strong>{p.stock}</strong></div>
                    </div>
                    <button onClick={()=>{const q=prompt(`Ajouter combien à ${p.name} ?`); if(q&&parseInt(q)>0) updateStock(p.id, parseInt(q), "entree", "Réappro gérant");}} style={{background:T.green, border:"none", borderRadius:8, padding:"6px 12px", fontWeight:600, color:T.bg, fontSize:12}}>+ Ajouter</button>
                  </div>
                ))
            }
          </div>
          <div style={{background:T.surface, borderRadius:16, padding:14}}>
            <div style={{fontSize:13, fontWeight:700, marginBottom:10}}>📦 Réapprovisionner n'importe quel produit</div>
            {products.filter(p=>p.stock!==undefined&&p.stock!==null&&p.stock!==-1).map(p=>(
              <div key={p.id} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:12}}>{p.name} <span style={{color:T.textMute}}>({p.stock})</span></span>
                <button onClick={()=>{const q=prompt(`Quantité à ajouter pour ${p.name} ?`); if(q&&parseInt(q)>0) updateStock(p.id, parseInt(q), "entree", "Réappro gérant");}} style={{background:T.btnGreen.bg, border:"none", borderRadius:8, padding:"3px 10px", fontSize:11, color:T.green}}>+ Stock</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── VALORISATION STOCK ── */}
      {tab==="valorisation" && (
        <SectionValorisation T={T} products={products} />

      {/* ── COMMANDES ── */}
      {tab==="commandes" && (
        <CommandesGerant T={T} commandes={commandes} addCommande={addCommande} payCommande={payCommande} flashMsg={flashMsg} shopName={shopName} shopPhone={shopPhone} shopAddress={shopAddress} shopSlogan={shopSlogan} shopLogo={shopLogo} useBLE={useBLE} ticketFormat={ticketFormat} nbCopies={nbCopies} ticketFooter={ticketFooter} />

  );
}
